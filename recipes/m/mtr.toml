[package]
name = "mtr"
version = "0.96"
revision = 2
description = "Network diagnostic tool combining ping and traceroute"
license = "GPL-2.0"
homepage = "https://www.bitwizard.nl/mtr/"

[source]
repo = "traviscross/mtr"
url = "https://github.com/traviscross/mtr/archive/refs/tags/v0.96.tar.gz"
sha256 = "73e6aef3fb6c8b482acb5b5e2b8fa7794045c4f2420276f035ce76c5beae632d"

[build]
steps = [
  "ACLOCAL_BIN=$(which aclocal) && AUTOMAKE_BIN=$(which automake) && AUTOMAKE_PREFIX=$(dirname $(dirname $ACLOCAL_BIN)) && AUTOMAKE_SHARE=$AUTOMAKE_PREFIX/share/automake-1.18 && ACLOCAL_SHARE=$AUTOMAKE_PREFIX/share/aclocal-1.18 && mkdir -p .wrappers && printf '#!/bin/sh\\nAUTOMAKE_UNINSTALLED=1 PERL5LIB=%s ACLOCAL_AUTOMAKE_DIR=%s exec /usr/bin/perl %s \"$@\"\\n' $AUTOMAKE_SHARE $ACLOCAL_SHARE $ACLOCAL_BIN > .wrappers/aclocal && printf '#!/bin/sh\\nAUTOMAKE_UNINSTALLED=1 PERL5LIB=%s AUTOMAKE_LIBDIR=%s exec /usr/bin/perl %s \"$@\"\\n' $AUTOMAKE_SHARE $AUTOMAKE_SHARE $AUTOMAKE_BIN > .wrappers/automake && chmod +x .wrappers/aclocal .wrappers/automake && touch NEWS README AUTHORS ChangeLog && PATH=$PWD/.wrappers:$PATH autoreconf -fi",
  "./configure --prefix=${PREFIX} --without-gtk --without-jansson --disable-bash-completion CPPFLAGS=\"-I$(pkg-config --variable=includedir ncursesw)/ncurses\"",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["autoconf", "automake", "ncurses", "pkgconf"]
