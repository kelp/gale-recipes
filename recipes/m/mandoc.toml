[package]
name = "mandoc"
version = "1.14.6"
revision = 2
description = "UNIX manpage compiler toolset"
license = "ISC"
homepage = "https://mandoc.bsd.lv"

[source]
url = "https://mandoc.bsd.lv/snapshots/mandoc-1.14.6.tar.gz"
sha256 = "8bf0d570f01e70a6e124884088870cbed7537f36328d512909eb10cd53179d9c"

[dependencies]
build = ["zlib"]

[build]
steps = [
  'echo "PREFIX=${PREFIX}" > configure.local',
  'echo "MANDIR=${PREFIX}/share/man" >> configure.local',
  "./configure",
  "make -j ${JOBS}",
  "make install",
]
