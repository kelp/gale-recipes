[package]
name = "gh"
version = "2.97.0"
# rev 3: republish under a fresh tag so users whose store
# already holds the pre-CGO_ENABLED=0 2.92.0-2 binary
# (dynamically linked, segfaults on hosts with different
# glibc) actually pull the static rebuild. The recipe bytes
# didn't change between 2 and 3; the GHCR artifact did.
revision = 3
description = "GitHub command-line tool"
license = "MIT"
homepage = "https://cli.github.com/"

[source]
repo = "cli/cli"
url = "https://github.com/cli/cli/archive/refs/tags/v2.97.0.tar.gz"
sha256 = "18cd1280f70911c9c16dd5965cdac0b9e6b16e54466f0c892ce2829ecdd339a6"
released_at = "2026-07-31"

[build]
# CGO_ENABLED=0 forces a pure-Go static binary — the
# previous default-cgo build linked dynamically against the
# build host's libc, which segfaulted on hosts with a
# differently-versioned glibc (e.g. ubuntu-24.04 build,
# debian-13 runtime). The ldflag Version/Date pair is what
# `gh --version` prints; keep these in sync with the
# [package] version on bumps.
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -trimpath -ldflags \"-s -w -X github.com/cli/cli/v2/internal/build.Version=v${VERSION} -X github.com/cli/cli/v2/internal/build.Date=2026-04-28\" -o ${PREFIX}/bin/gh ./cmd/gh",
]

# Smoke runs against the installed binary. --version
# alone catches segfaults (verify step does this too);
# the help + subcommand probes exercise gh's command
# parser, which would catch a binary whose Go runtime
# fails to initialize past the first syscall.
[smoke]
commands = [
  "${PREFIX}/bin/gh --version",
  "${PREFIX}/bin/gh help",
  "${PREFIX}/bin/gh release --help",
  # Regression guard: the rev-1 build silently dropped
  # CGO_ENABLED=0 and shipped a dynamically-linked binary
  # that segfaulted on hosts whose glibc didn't match the
  # CI runner. The runtime probes above all pass on the
  # build host (same libc), so they can't catch this —
  # only a build-product property check can.
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/gh | grep -q 'statically linked'; fi",
]

[dependencies]
build = ["go"]
