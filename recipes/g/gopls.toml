[package]
name = "gopls"
version = "0.22.0"
revision = 2
description = "The official Go language server"
license = "BSD-3-Clause"
homepage = "https://pkg.go.dev/golang.org/x/tools/gopls"

[source]
repo = "golang/tools"
url = "https://github.com/golang/tools/archive/refs/tags/gopls/v0.22.0.tar.gz"
sha256 = "249dc0c4b9f3e853f6a7fb6f3528db2f48793e7c54323f3b32aa38f6432f088a"

[dependencies]
build = ["go"]

[build]
steps = [
  "cd gopls && mkdir -p ${PREFIX}/bin && go build -ldflags \"-s -w -X main.version=v${VERSION}\" -o ${PREFIX}/bin/gopls .",
]
