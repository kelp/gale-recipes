[package]
name = "gopls"
version = "0.23.0"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "The official Go language server"
license = "BSD-3-Clause"
homepage = "https://pkg.go.dev/golang.org/x/tools/gopls"

[source]
repo = "golang/tools"
url = "https://github.com/golang/tools/archive/refs/tags/gopls/v0.23.0.tar.gz"
sha256 = "1ba41875b918db73c6a409ad8f552b85f72dfeea43ffb541b798322ff6b4152b"

[dependencies]
build = ["go"]

[build]
steps = [
  "cd gopls && mkdir -p ${PREFIX}/bin && CGO_ENABLED=0 go build -ldflags \"-s -w -X main.version=v${VERSION}\" -o ${PREFIX}/bin/gopls .",
]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/gopls | grep -q 'statically linked'; fi",
]
