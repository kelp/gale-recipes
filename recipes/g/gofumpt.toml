[package]
name = "gofumpt"
version = "0.10.0"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Stricter gofmt"
license = "BSD-3-Clause"
homepage = "https://github.com/mvdan/gofumpt"

[source]
repo = "mvdan/gofumpt"
url = "https://github.com/mvdan/gofumpt/archive/refs/tags/v0.10.0.tar.gz"
sha256 = "5f3158f665d1d49a19f3ed48981366c892b68904b2b34cb893c6fe3ff8346929"

[dependencies]
build = ["go"]

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/gofumpt .",
]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/gofumpt | grep -q 'statically linked'; fi",
]
