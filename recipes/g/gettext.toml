[package]
name = "gettext"
version = "1.0"
description = "GNU internationalization (i18n) and localization (l10n) library"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/gettext/"

[source]
url = "https://ftpmirror.gnu.org/gnu/gettext/gettext-1.0.tar.gz"
sha256 = "85d99b79c981a404874c02e0342176cf75c7698e2b51fe41031cf6526d974f1a"

[build]
steps = [
  "./configure --prefix=${PREFIX} --with-included-glib --with-included-libcroco --with-included-libunistring --with-included-gettext --disable-java --disable-csharp --without-emacs --without-git --without-cvs --without-xz",
  "make -j${JOBS}",
  "make install",
]
