[package]
name = "glances"
version = "4.5.4"
revision = 2
description = "A cross-platform curses-based monitoring tool"
license = "LGPL-3.0-only"
homepage = "http://nicolargo.github.io/glances/"

[source]
repo = "nicolargo/glances"
url = "https://github.com/nicolargo/glances/archive/refs/tags/v4.5.4.tar.gz"
sha256 = "a4f421c608d6c40e926c0256f915f0e820d92e5837e6b5a9eea582cf9b241c4a"
released_at = "2026-04-19"

[build]
system = "python"
steps = [
  "${DEP_PYTHON}/bin/python3 -m pip install --prefix=${PREFIX} --no-deps .",
]

[dependencies]
build = ["python"]