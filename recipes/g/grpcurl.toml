# Generated from Homebrew formula (BSD-2-Clause)

[package]
name = "grpcurl"
version = "1.9.3"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Like cURL, but for gRPC"
license = "MIT"
homepage = "https://github.com/fullstorydev/grpcurl"

[source]
repo = "fullstorydev/grpcurl"
url = "https://github.com/fullstorydev/grpcurl/archive/refs/tags/v1.9.3.tar.gz"
sha256 = "bb555087f279af156159c86d4d3d5dd3f2991129e4cd6b09114e6851a679340d"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/grpcurl ./cmd/grpcurl",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/grpcurl | grep -q 'statically linked'; fi",
]
