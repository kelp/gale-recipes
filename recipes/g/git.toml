[package]
name = "git"
version = "2.53.0"
description = "Distributed revision control system"
license = "GPL-2.0-only"
homepage = "https://git-scm.com"

[source]
repo = "git/git"
url = "https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.53.0.tar.xz"
sha256 = "5818bd7d80b061bbbdfec8a433d609dc8818a05991f731ffc4a561e2ca18c653"

[build]
steps = [
  "make -j${JOBS} prefix=${PREFIX} RUNTIME_PREFIX=1 NO_GETTEXT=1 NO_TCLTK=1 USE_LIBPCRE2=1 INSTALL_SYMLINKS=1 LIBPCREDIR=${DEP_PCRE2} CC=cc CFLAGS=\"$CFLAGS $CPPFLAGS\" LDFLAGS=\"$LDFLAGS\"",
  "make prefix=${PREFIX} RUNTIME_PREFIX=1 NO_GETTEXT=1 NO_TCLTK=1 USE_LIBPCRE2=1 INSTALL_SYMLINKS=1 LIBPCREDIR=${DEP_PCRE2} CC=cc CFLAGS=\"$CFLAGS $CPPFLAGS\" LDFLAGS=\"$LDFLAGS\" install",
]

[dependencies]
build = ["gnumake", "pkgconf"]
runtime = ["curl", "expat", "openssl", "pcre2", "zlib"]

[smoke]
commands = [
  "${PREFIX}/bin/git --version",
  "${PREFIX}/bin/git clone --depth 1 https://github.com/kelp/gale-recipes.git ${TMPDIR}/clone",
  "${PREFIX}/bin/git -C ${TMPDIR}/clone log -1 --format=%H",
]
