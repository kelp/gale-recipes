[package]
name = "gdu"
version = "5.36.1"
revision = 2
description = "Disk usage analyzer with console interface written in Go"
license = "MIT"
homepage = "https://github.com/dundee/gdu"

[source]
repo = "dundee/gdu"
url = "https://github.com/dundee/gdu/archive/refs/tags/v5.36.1.tar.gz"
sha256 = "dd31ea9afd848edf734143aabd5fdf66236ce2c866dc09f9dededb61d39fe63c"

[dependencies]
build = ["go"]

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -ldflags=\"-s -w -X 'github.com/dundee/gdu/v5/build.Version=v${VERSION}'\" -o ${PREFIX}/bin/gdu ./cmd/gdu",
]
