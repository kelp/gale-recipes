[package]
name = "gale"
version = "0.21.3"
description = "Package manager that replaces Homebrew, Nix, and home-manager"
license = "MIT"
homepage = "https://github.com/kelp/gale"

[source]
repo = "kelp/gale"
url = "https://github.com/kelp/gale/archive/refs/tags/v0.21.3.tar.gz"
sha256 = "981e75cb0c5e3e974f361213df6afc9d614400b58b3a5dee767ed0670b6570ba"

[dependencies]
build = ["go"]

[build]
steps = [
  "mkdir -p ${PREFIX}/bin ${PREFIX}/man/man1",
  "CGO_ENABLED=0 go build -ldflags \"-X main.version=v${VERSION}\" -o ${PREFIX}/bin/gale ./cmd/gale/",
  "cp gale.1 ${PREFIX}/man/man1/",
]
