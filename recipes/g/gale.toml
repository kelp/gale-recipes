[package]
name = "gale"
version = "0.2.0"
description = "Package manager that replaces Homebrew, Nix, and home-manager"
license = "MIT"
homepage = "https://github.com/kelp/gale"

[source]
repo = "kelp/gale"
url = "https://github.com/kelp/gale/archive/refs/tags/v0.2.0.tar.gz"
sha256 = "a6787cb08abca1ee8c83b3f6081ead585ea32fbb527cff1a9ef65ac5c5b32b14"

[dependencies]
build = ["go"]

[build]
steps = [
  "mkdir -p ${PREFIX}/bin ${PREFIX}/man/man1",
  "go build -ldflags \"-X main.version=v0.2.0\" -o ${PREFIX}/bin/gale ./cmd/gale/",
  "cp gale.1 ${PREFIX}/man/man1/",
]
