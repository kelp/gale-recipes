# Generated from Homebrew formula (BSD-2-Clause)

[package]
name = "git-delta"
version = "0.19.2"
revision = 3
description = "Syntax-highlighting pager for git and diff output"
license = "MIT"
homepage = "https://github.com/dandavison/delta"

[source]
repo = "dandavison/delta"
url = "https://github.com/dandavison/delta/archive/refs/tags/0.19.2.tar.gz"
sha256 = "f59b86f8c8dda4d76a3ba34b8553777a20c3b461646917d8e480fac6531bba9f"
released_at = "2026-03-28"

[build]
steps = [
  "cargo install --path . --root ${PREFIX}",
]

# libgit2 is vendored statically by libgit2-sys: with no farm
# libgit2 on PKG_CONFIG_PATH the crate builds its bundled copy,
# so the binary is self-contained (no @rpath/libgit2.dylib that
# dyld-aborts on darwin when run outside the install farm). See #92.
[dependencies]
build = ["pkgconf", "rust"]
runtime = ["oniguruma", "zlib"]
