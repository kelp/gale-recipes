[package]
name = "golangci-lint"
version = "2.12.2"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Fast Go linters runner"
license = "GPL-3.0"
homepage = "https://golangci-lint.run"

[source]
repo = "golangci/golangci-lint"
url = "https://github.com/golangci/golangci-lint/archive/refs/tags/v2.12.2.tar.gz"
sha256 = "568cfb0ad40832177826608003065a976254415509dd8b4e3ba19ee586388b94"

[dependencies]
build = ["go"]

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/golangci-lint ./cmd/golangci-lint/",
]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/golangci-lint | grep -q 'statically linked'; fi",
]
