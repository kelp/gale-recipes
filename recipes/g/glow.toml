# Generated from Homebrew formula (BSD-2-Clause)

[package]
name = "glow"
version = "2.1.2"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Render markdown on the CLI"
license = "MIT"
homepage = "https://github.com/charmbracelet/glow"

[source]
repo = "charmbracelet/glow"
url = "https://github.com/charmbracelet/glow/archive/refs/tags/v2.1.2.tar.gz"
sha256 = "1b933139da1d08647bf5b3f112cab9548fdc2b40c056c7fa3d84d8706de5265a"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/glow .",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/glow | grep -q 'statically linked'; fi",
]
