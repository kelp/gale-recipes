[package]
name = "flex"
version = "2.6.4"
revision = 4
description = "Fast lexical analyzer generator"
license = "BSD-2-Clause"
homepage = "https://github.com/westes/flex"

[source]
repo = "westes/flex"
url = "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz"
sha256 = "e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995"

[build]
system = "autotools"
# M4=m4 stops configure from baking an absolute path to
# the build-time m4 into the flex binary; flex execs
# `m4` via PATH lookup at runtime, so users don't hit
# `exec of /Users/runner/.gale/pkg/m4/.../bin/m4 failed`
# when the prebuilt CI binary lands on their machine.
steps = [
  "./configure --prefix=${PREFIX} --disable-nls M4=m4",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["m4", "gettext"]
runtime = ["m4"]
