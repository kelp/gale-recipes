# Generated from Homebrew formula (BSD-2-Clause)

[package]
name = "fzf"
version = "0.74.0"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Command-line fuzzy finder written in Go"
license = "MIT"
homepage = "https://github.com/junegunn/fzf"

[source]
repo = "junegunn/fzf"
url = "https://github.com/junegunn/fzf/archive/refs/tags/v0.74.0.tar.gz"
sha256 = "55ab5f2256edd8890f81d407b63d3a3e81cffe10e318cd196031dc85efdeb079"
released_at = "2026-07-06"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/fzf",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/fzf | grep -q 'statically linked'; fi",
]
