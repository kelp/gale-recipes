[package]
name = "fontconfig"
version = "2.17.1"
platforms = ["darwin-amd64", "darwin-arm64"]
description = "Library for configuring and customizing font access"
license = "MIT"
homepage = "https://www.freedesktop.org/wiki/Software/fontconfig/"

[source]
url = "https://gitlab.freedesktop.org/fontconfig/fontconfig/-/archive/2.17.1/fontconfig-2.17.1.tar.gz"
sha256 = "82e73b26adad651b236e5f5d4b3074daf8ff0910188808496326bd3449e5261d"

[build]
steps = [
  "meson setup build --prefix=${PREFIX} --buildtype=release -Ddoc=disabled -Dtests=disabled -Dtools=enabled -Dcache-build=disabled",
  "meson compile -C build -j ${JOBS}",
  "meson install -C build",
]

[dependencies]
build = ["expat", "freetype", "meson", "ninja", "pkgconf"]
runtime = ["expat", "freetype"]
