[package]
name = "flarectl"
version = "7.4.0"
revision = 2
description = "Cloudflare CLI from cloudflare-go"
license = "BSD-3-Clause"
homepage = "https://github.com/cloudflare/cloudflare-go"

[source]
repo = "cloudflare/cloudflare-go"
url = "https://github.com/cloudflare/cloudflare-go/archive/refs/tags/v7.4.0.tar.gz"
sha256 = "5a02f7103255be6b9102d941c5f2062878a12ff91c474436a50cf2590afafc27"
released_at = "2026-05-29"

[build]
system = "go"
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -trimpath -ldflags \"-s -w\" -o ${PREFIX}/bin/flarectl ./cmd/flarectl",
]

[dependencies]
build = ["go"]
