[package]
name = "flarectl"
version = "7.2.0"
revision = 2
description = "Cloudflare CLI from cloudflare-go"
license = "BSD-3-Clause"
homepage = "https://github.com/cloudflare/cloudflare-go"

[source]
repo = "cloudflare/cloudflare-go"
url = "https://github.com/cloudflare/cloudflare-go/archive/refs/tags/v7.2.0.tar.gz"
sha256 = "925c249efd5c288bed095e00b1543d3bfbdcf316725d33d4dbc4e1ae444bfc1f"
released_at = "2026-05-07"

[build]
system = "go"
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -trimpath -ldflags \"-s -w\" -o ${PREFIX}/bin/flarectl ./cmd/flarectl",
]

[dependencies]
build = ["go"]
