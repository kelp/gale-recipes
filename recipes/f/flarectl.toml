[package]
name = "flarectl"
version = "0.117.0"
revision = 2
description = "Cloudflare CLI from cloudflare-go"
license = "BSD-3-Clause"
homepage = "https://github.com/cloudflare/cloudflare-go"

[source]
repo = "cloudflare/cloudflare-go"
url = "https://github.com/cloudflare/cloudflare-go/archive/refs/tags/v0.117.0.tar.gz"
sha256 = "ae76bd5a05eb9f4f8971904377e9570c80a526d670b484d9a31ccd69638d256e"
released_at = "2026-05-20"

[build]
system = "go"
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -trimpath -ldflags \"-s -w\" -o ${PREFIX}/bin/flarectl ./cmd/flarectl",
]

[dependencies]
build = ["go"]
