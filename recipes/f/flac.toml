# Generated from Homebrew formula (BSD-2-Clause)

[package]
name = "flac"
version = "1.5.0"
description = "Free lossless audio codec"
license = "BSD-3-Clause"
homepage = "https://xiph.org/flac/"

[source]
repo = "xiph/flac"
url = "https://ftp.osuosl.org/pub/xiph/releases/flac/flac-1.5.0.tar.xz"
sha256 = "f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920"

[build]
steps = [
  "cmake -S . -B build -DCMAKE_INSTALL_PREFIX=${PREFIX} -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF",
  "cmake --build build -j ${JOBS}",
  "cmake --install build",
]

[dependencies]
build = ["cmake", "pkgconf"]
runtime = ["libogg"]
