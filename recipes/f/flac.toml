# Generated from Homebrew formula (BSD-2-Clause)

[package]
name = "flac"
version = "1.5.0"
revision = 3
description = "Free lossless audio codec"
license = "BSD-3-Clause"
homepage = "https://xiph.org/flac/"

[source]
repo = "xiph/flac"
url = "https://ftp.osuosl.org/pub/xiph/releases/flac/flac-1.5.0.tar.xz"
sha256 = "f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920"

[build]
steps = [
  "cmake -S . -B build -DCMAKE_INSTALL_PREFIX=${PREFIX} -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF",
  "cmake --build build -j ${JOBS}",
  "cmake --install build",
  # The flac/metaflac CLIs link @rpath/libFLAC.14.dylib and
  # libFLAC++ links @rpath/libFLAC.14.dylib — sibling dylibs
  # this build installs to lib/ — but bake no rpath to resolve
  # them, so dyld aborts and check_install fails on darwin. Add
  # @loader_path/<rel>/lib per Mach-O file under bin/ and lib/.
  # Mach-O-gated via file(1), so this is a no-op on Linux.
  # Pattern: recipes/p/postgresql.toml. (libogg, an external
  # dep dylib, is resolved by the dependency farm at install.)
  "find ${PREFIX}/bin ${PREFIX}/lib -type f 2>/dev/null | while read -r f; do file \"$f\" | grep -q Mach-O || continue; rel=${f#${PREFIX}/}; dir=${rel%/*}; ups=\"\"; IFS=/; for c in $dir; do ups=\"../$ups\"; done; unset IFS; install_name_tool -add_rpath \"@loader_path/${ups}lib\" \"$f\" 2>/dev/null || true; done",
]

[dependencies]
build = ["cmake", "pkgconf"]
runtime = ["libogg"]
