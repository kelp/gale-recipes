[package]
name = "freetype"
version = "2.14.3"
platforms = ["darwin-amd64", "darwin-arm64"]
description = "Freely available software library to render fonts"
license = "FTL OR GPL-2.0-or-later"
homepage = "https://www.freetype.org/"

[source]
url = "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.3/freetype-2.14.3.tar.xz"
sha256 = "36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f"

# harfbuzz=disabled intentionally — freetype and harfbuzz
# have a circular build dep. Homebrew does a two-pass
# rebuild for better text shaping; for PDF extraction we
# don't need it.

[build]
steps = [
  "meson setup build --prefix=${PREFIX} --buildtype=release -Dharfbuzz=disabled -Dbrotli=disabled -Dbzip2=disabled -Dpng=enabled -Dzlib=enabled",
  "meson compile -C build -j ${JOBS}",
  "meson install -C build",
]

[dependencies]
build = ["libpng", "meson", "ninja", "pkgconf", "zlib"]
runtime = ["libpng", "zlib"]
