[package]
name = "shfmt"
version = "3.13.1"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Autoformat shell script source code"
license = "BSD-3-Clause"
homepage = "https://github.com/mvdan/sh"

[source]
repo = "mvdan/sh"
url = "https://github.com/mvdan/sh/archive/refs/tags/v3.13.1.tar.gz"
sha256 = "b31aad2d4c26b0c6e8ebe894d59022520bbebce33e082d7d29e4325eee35d308"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/shfmt ./cmd/shfmt",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/shfmt | grep -q 'statically linked'; fi",
]
