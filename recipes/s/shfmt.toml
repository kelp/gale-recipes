[package]
name = "shfmt"
version = "3.13.0"
description = "Autoformat shell script source code"
license = "BSD-3-Clause"
homepage = "https://github.com/mvdan/sh"

[source]
repo = "mvdan/sh"
url = "https://github.com/mvdan/sh/archive/refs/tags/v3.13.0.tar.gz"
sha256 = "efef583999befd358fae57858affa4eb9dc8a415f39f69d0ebab3a9f473d7dd3"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/shfmt ./cmd/shfmt",
]

[dependencies]
build = ["go"]
