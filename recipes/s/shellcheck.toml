[package]
name = "shellcheck"
version = "0.11.0"
revision = 2
description = "Static analysis and lint tool, for (ba)sh scripts"
license = "GPL-3.0-or-later"
homepage = "https://www.shellcheck.net/"

[source]
repo = "koalaman/shellcheck"
url = "https://github.com/koalaman/shellcheck/archive/refs/tags/v0.11.0.tar.gz"
sha256 = "8b07554f92e4fbfc33f1539a1f475f21c6503ceae8f806efcc518b1f529f7102"
released_at = "2025-08-04"

# ShellCheck is written in Haskell. Building from source
# requires GHC and 2GB of RAM. Use prebuilt binaries from
# GitHub releases instead.

[build.darwin-arm64]
steps = [
  "curl -sL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.aarch64.tar.xz",
  "echo '56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79  /tmp/shellcheck.tar.xz' | shasum -a 256 -c",
  "mkdir -p /tmp/shellcheck-extract && tar -xJf /tmp/shellcheck.tar.xz -C /tmp/shellcheck-extract --strip-components=1",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/shellcheck-extract/shellcheck ${PREFIX}/bin/",
]

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz",
  "echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz' | shasum -a 256 -c",
  "mkdir -p /tmp/shellcheck-extract && tar -xJf /tmp/shellcheck.tar.xz -C /tmp/shellcheck-extract --strip-components=1",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/shellcheck-extract/shellcheck ${PREFIX}/bin/",
]

[build.linux-arm64]
steps = [
  "curl -sL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.aarch64.tar.xz",
  "echo '12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588  /tmp/shellcheck.tar.xz' | shasum -a 256 -c",
  "mkdir -p /tmp/shellcheck-extract && tar -xJf /tmp/shellcheck.tar.xz -C /tmp/shellcheck-extract --strip-components=1",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/shellcheck-extract/shellcheck ${PREFIX}/bin/",
]
