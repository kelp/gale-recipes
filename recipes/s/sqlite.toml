[package]
name = "sqlite"
version = "3.48.0"
description = "Official Git mirror of the SQLite source tree"
license = "Public Domain"
homepage = "https://www.sqlite.org/"

[source]
repo = "sqlite/sqlite"
url = "https://github.com/sqlite/sqlite/archive/refs/tags/version-3.48.0.tar.gz"
sha256 = "e764585b074d837a949f0dbb683f53350f95df099f70061710329181477c6fe0"
released_at = "2025-01-15"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --disable-tcl",
  "make -j${JOBS}",
  "make install",
]