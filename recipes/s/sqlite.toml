[package]
name = "sqlite"
version = "3.53.1"
revision = 1
description = "Command-line interface for the SQLite database engine"
license = "Public Domain"
homepage = "https://www.sqlite.org/"

[source]
repo = "sqlite/sqlite"
url = "https://github.com/sqlite/sqlite/archive/refs/tags/version-3.53.1.tar.gz"
sha256 = "71e13e0fa5b925b28a7c5b5515079e8ec21c739b1ddc9cbb87e6524626317c15"
released_at = "2026-05-05"

[build]
system = "autotools"
steps = [
  "CPPFLAGS=\"${DEP_CPPFLAGS} -DSQLITE_ENABLE_API_ARMOR=1 -DSQLITE_ENABLE_COLUMN_METADATA=1 -DSQLITE_ENABLE_DBSTAT_VTAB=1 -DSQLITE_ENABLE_FTS3=1 -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 -DSQLITE_ENABLE_FTS5=1 -DSQLITE_ENABLE_JSON1=1 -DSQLITE_ENABLE_RTREE=1 -DSQLITE_ENABLE_STAT4=1 -DSQLITE_ENABLE_UNLOCK_NOTIFY=1 -DSQLITE_USE_URI=1\" ./configure --prefix=${PREFIX} --disable-tcl --enable-readline --with-readline-cflags=-I${DEP_READLINE}/include --with-readline-ldflags=\"-L${DEP_READLINE}/lib -L${DEP_NCURSES}/lib -lreadline -lncurses\"",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["readline", "ncurses"]
runtime = ["readline"]