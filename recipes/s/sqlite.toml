[package]
name = "sqlite"
version = "3.48.0"
description = "Command-line interface for the SQLite database engine"
license = "Public Domain"
homepage = "https://www.sqlite.org/"

[source]
repo = "sqlite/sqlite"
url = "https://github.com/sqlite/sqlite/archive/refs/tags/version-3.48.0.tar.gz"
sha256 = "e764585b074d837a949f0dbb683f53350f95df099f70061710329181477c6fe0"
released_at = "2025-01-15"

[build]
system = "autotools"
steps = [
  "CPPFLAGS=\"-DSQLITE_ENABLE_API_ARMOR=1 -DSQLITE_ENABLE_COLUMN_METADATA=1 -DSQLITE_ENABLE_DBSTAT_VTAB=1 -DSQLITE_ENABLE_FTS3=1 -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 -DSQLITE_ENABLE_FTS5=1 -DSQLITE_ENABLE_JSON1=1 -DSQLITE_ENABLE_RTREE=1 -DSQLITE_ENABLE_STAT4=1 -DSQLITE_ENABLE_UNLOCK_NOTIFY=1 -DSQLITE_USE_URI=1\" ./configure --prefix=${PREFIX} --disable-tcl --enable-readline",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["readline"]