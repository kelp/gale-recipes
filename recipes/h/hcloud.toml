[package]
name = "hcloud"
version = "1.66.0"
revision = 2
description = "Hetzner Cloud command-line interface"
license = "MIT"
homepage = "https://github.com/hetznercloud/cli"

[source]
repo = "hetznercloud/cli"
url = "https://github.com/hetznercloud/cli/archive/refs/tags/v1.66.0.tar.gz"
sha256 = "0ef5e1b0b10feab53143d49e5b79b8a9ab3fc38e87a33c8d2dbd0e08e0059c52"
released_at = "2026-06-24"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -trimpath -ldflags \"-s -w -X github.com/hetznercloud/cli/internal/version.version=${VERSION} -X github.com/hetznercloud/cli/internal/version.versionPrerelease=\" -o ${PREFIX}/bin/hcloud ./cmd/hcloud",
]

[dependencies]
build = ["go"]
