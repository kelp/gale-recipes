[package]
name = "helm"
version = "4.2.3"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Kubernetes package manager"
license = "Apache-2.0"
homepage = "https://helm.sh/"

[source]
repo = "helm/helm"
url = "https://github.com/helm/helm/archive/refs/tags/v4.2.3.tar.gz"
sha256 = "9ca555fa3777082fd646c95abf4ee17fc31e25ba97bad76da9de1df2332be168"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/helm ./cmd/helm",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/helm | grep -q 'statically linked'; fi",
]
