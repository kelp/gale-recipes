[package]
name = "helm"
version = "4.2.2"
revision = 2
description = "Kubernetes package manager"
license = "Apache-2.0"
homepage = "https://helm.sh/"

[source]
repo = "helm/helm"
url = "https://github.com/helm/helm/archive/refs/tags/v4.2.2.tar.gz"
sha256 = "2208572edb814bf481bf4657a73009e5155c83967ba1f514083b476de95f948f"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/helm ./cmd/helm",
]

[dependencies]
build = ["go"]
