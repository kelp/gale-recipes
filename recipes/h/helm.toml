[package]
name = "helm"
version = "4.2.0"
revision = 2
description = "Kubernetes package manager"
license = "Apache-2.0"
homepage = "https://helm.sh/"

[source]
repo = "helm/helm"
url = "https://github.com/helm/helm/archive/refs/tags/v4.2.0.tar.gz"
sha256 = "98d6b09a7dce667d0638bd293b6ef768cfc6ba51afda42b0fe0be1c7a021ceb7"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/helm ./cmd/helm",
]

[dependencies]
build = ["go"]
