[package]
name = "helm"
version = "4.1.3"
description = "Kubernetes package manager"
license = "Apache-2.0"
homepage = "https://helm.sh/"

[source]
repo = "helm/helm"
url = "https://github.com/helm/helm/archive/refs/tags/v4.1.3.tar.gz"
sha256 = "a336010d2a5bebc0588995cfda20919c47b20c9f8ed3e4ada9241684854bbf9f"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/helm ./cmd/helm",
]

[dependencies]
build = ["go"]
