[package]
name = "htop"
version = "3.5.2"
revision = 3
description = "htop - an interactive process viewer"
license = "GPL-2.0"
homepage = "https://htop.dev/"

[source]
repo = "htop-dev/htop"
url = "https://github.com/htop-dev/htop/releases/download/3.5.2/htop-3.5.2.tar.xz"
sha256 = "225128e697c4a8c8a878fd0078c965ff8bd5fb24913bfc8473b8edbd50f843f8"
released_at = "2026-07-18"

[dependencies]
build = ["ncurses"]

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --disable-static",
  "make -j${JOBS}",
  "make install",
]