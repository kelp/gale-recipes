[package]
name = "htop"
version = "3.5.1"
revision = 2
description = "htop - an interactive process viewer"
license = "GPL-2.0"
homepage = "https://htop.dev/"

[source]
repo = "htop-dev/htop"
url = "https://github.com/htop-dev/htop/releases/download/3.5.1/htop-3.5.1.tar.xz"
sha256 = "526cecd62870aa8d14d2a79a35ea197e4e2b5317d275b567cee0574b2ddb2e9a"
released_at = "2026-04-28"

[dependencies]
build = ["ncurses"]

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --disable-static",
  "make -j${JOBS}",
  "make install",
]