[package]
name = "httpstat"
version = "1.2.1"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "It's like curl -v, with colours"
license = "MIT"
homepage = "https://github.com/davecheney/httpstat"

[source]
repo = "davecheney/httpstat"
url = "https://github.com/davecheney/httpstat/archive/refs/tags/v1.2.1.tar.gz"
sha256 = "be3f191a0b07ef3a38b94c0bb9a821b2fc33ea347525a193a167173a2198191c"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/httpstat .",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/httpstat | grep -q 'statically linked'; fi",
]
