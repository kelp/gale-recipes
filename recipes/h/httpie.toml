[package]
name = "httpie"
version = "3.2.4"
revision = 2
description = "🥧 HTTPie CLI  — modern, user-friendly command-line HTTP client for the API era. JSON support, colors, sessions, downloads, plugins & more."
license = "BSD-3-Clause"
homepage = "https://httpie.io"

[source]
repo = "httpie/cli"
url = "https://github.com/httpie/cli/archive/refs/tags/3.2.4.tar.gz"
sha256 = "b185cd8d81325f97c773582e50f1c5e047c2d8575b53d676469c9daf2a52f341"
released_at = "2025-01-15"

[build]
system = "python"
steps = [
  "${DEP_PYTHON}/bin/python3 -m pip install --prefix=${PREFIX} --no-deps .",
]

[dependencies]
build = ["python"]