[package]
name = "herdr"
version = "0.7.0"
description = "Terminal workspace manager for AI coding agents"
license = "AGPL-3.0-or-later"
homepage = "https://herdr.dev"

[source]
repo = "ogulcancelik/herdr"
url = "https://github.com/ogulcancelik/herdr/archive/refs/tags/v0.7.0.tar.gz"
sha256 = "6c7e7b1eaefc50a63a66fdeae681df994b528511ce5e1aa2ac611f8119231946"
released_at = "2026-06-15"

# build.rs compiles the vendored libghostty-vt with `zig build`
# and statically links it. build.zig.zon sets minimum_zig_version =
# 0.15.2, a floor, so any newer zig is valid.
#
# Build on zig 0.16.0, not zig15 (0.15.2): on the macOS-26 CI runner
# zig 0.15.2 fails to link its own native build runner against the
# system SDK -- every libSystem symbol comes back undefined
# (__availability_version_check, _abort, _malloc_size, ...) and
# build.rs panics "zig build for vendored libghostty-vt failed".
# Setting SDKROOT explicitly did not help (0.15.2 ignores it for the
# native link); 0.16.0 links cleanly. `zig version` is echoed so the
# build log confirms which toolchain ran.
[build]
steps = [
  "zig version && cargo install --path . --root ${PREFIX}",
]

[dependencies]
build = ["rust", "zig"]
