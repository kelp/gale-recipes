[package]
name = "lazygit"
version = "0.61.1"
revision = 2
description = "Simple terminal UI for git commands"
license = "MIT"
homepage = "https://github.com/jesseduffield/lazygit"

[source]
repo = "jesseduffield/lazygit"
url = "https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.61.1.tar.gz"
sha256 = "2a550c9b609c5eb0e1c2640e8114ac05b94c671803f77e08a9dcdbd66372e2c4"

[dependencies]
build = ["go"]

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -ldflags \"-X main.version=0.60.0 -X main.buildSource=gale\" -o ${PREFIX}/bin/lazygit",
]
