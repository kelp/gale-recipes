[package]
name = "libpsl"
version = "0.21.5"
description = "C library for the Public Suffix List"
license = "MIT"
homepage = "https://rockdaboot.github.io/libpsl"

[source]
repo = "rockdaboot/libpsl"
url = "https://github.com/rockdaboot/libpsl/releases/download/0.21.5/libpsl-0.21.5.tar.gz"
sha256 = "1dcc9ceae8b128f3c0b3f654decd0e1e891afc6ff81098f227ef260449dae208"
released_at = "2025-01-15"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --disable-docs --disable-man",
  "make -j${JOBS}",
  "make install",
]

[build.darwin-arm64]
steps = [
  "./configure --prefix=${PREFIX} --disable-docs --disable-man --disable-runtime",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = []