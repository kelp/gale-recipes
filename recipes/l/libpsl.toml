[package]
name = "libpsl"
version = "0.23.1"
revision = 2
description = "C library for the Public Suffix List"
license = "MIT"
homepage = "https://rockdaboot.github.io/libpsl"

[source]
repo = "rockdaboot/libpsl"
url = "https://github.com/rockdaboot/libpsl/releases/download/0.23.1/libpsl-0.23.1.tar.gz"
sha256 = "8fbb03054556498ba9c4cc48fcaa36a4483748c6504a65bdb9ba348f555b0e56"
released_at = "2026-08-01"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --disable-docs --disable-man",
  "make -j${JOBS}",
  "make install",
]

[build.darwin-arm64]
steps = [
  "./configure --prefix=${PREFIX} --disable-docs --disable-man --disable-runtime",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = []