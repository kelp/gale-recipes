[package]
name = "libpsl"
version = "0.23.0"
revision = 2
description = "C library for the Public Suffix List"
license = "MIT"
homepage = "https://rockdaboot.github.io/libpsl"

[source]
repo = "rockdaboot/libpsl"
url = "https://github.com/rockdaboot/libpsl/releases/download/0.23.0/libpsl-0.23.0.tar.gz"
sha256 = "f39b9631b3d369a21259ea4654f8875c0ec6995ce9551c0eb5d423e4c011f911"
released_at = "2026-07-12"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --disable-docs --disable-man --enable-runtime=libidn2",
  "make -j${JOBS}",
  "make install",
]

[build.darwin-arm64]
steps = [
  "./configure --prefix=${PREFIX} --disable-docs --disable-man --disable-runtime",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["libidn2", "libunistring", "pkgconf"]
runtime = ["libidn2", "libunistring"]