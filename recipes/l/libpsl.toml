[package]
name = "libpsl"
version = "0.22.0"
revision = 2
description = "C library for the Public Suffix List"
license = "MIT"
homepage = "https://rockdaboot.github.io/libpsl"

[source]
repo = "rockdaboot/libpsl"
url = "https://github.com/rockdaboot/libpsl/releases/download/0.22.0/libpsl-0.22.0.tar.gz"
sha256 = "c45c3aa17576b99873e05a9b09a44041b065bbfa390e6d474d06fbfaeb9c7722"
released_at = "2026-06-24"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --disable-docs --disable-man",
  "make -j${JOBS}",
  "make install",
]

[build.darwin-arm64]
steps = [
  "./configure --prefix=${PREFIX} --disable-docs --disable-man --disable-runtime",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = []