[package]
name = "libtool"
version = "2.5.4"
description = "GNU generic library support script"
license = "GPL-2.0-or-later"
homepage = "https://www.gnu.org/software/libtool/"

[source]
url = "https://ftpmirror.gnu.org/gnu/libtool/libtool-2.5.4.tar.gz"
sha256 = "da8ebb2ce4dcf46b90098daf962cffa68f4b4f62ea60f798d0ef12929ede6adf"

[build.darwin-arm64]
steps = [
  "./configure --prefix=${PREFIX} --program-prefix=g --enable-ltdl-install",
  "make -j${JOBS}",
  "make install",
]

[build.linux-amd64]
steps = [
  "./configure --prefix=${PREFIX} --enable-ltdl-install",
  "make -j${JOBS}",
  "make install",
]

[build.linux-arm64]
steps = [
  "./configure --prefix=${PREFIX} --enable-ltdl-install",
  "make -j${JOBS}",
  "make install",
]
