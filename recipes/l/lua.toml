[package]
name = "lua"
version = "5.5.0"
revision = 5
description = "Powerful, lightweight programming language"
license = "MIT"
homepage = "https://www.lua.org/"

[source]
url = "https://www.lua.org/ftp/lua-5.5.0.tar.gz"
sha256 = "57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d"

# Upstream's Makefile installs no pkg-config file, so consumers
# that discover lua via pkg-config (tio's meson, etc.) can't find
# it. Homebrew generates one; do the same. gale's install-time
# text-file fixup rewrites the baked build prefix to the user's
# store path, so the .pc relocates correctly.
[build.darwin-arm64]
steps = [
  "make -j${JOBS} PLAT=macosx INSTALL_TOP=${PREFIX} INSTALL_INC=${PREFIX}/include/lua INSTALL_MAN=${PREFIX}/share/man/man1",
  "make install PLAT=macosx INSTALL_TOP=${PREFIX} INSTALL_INC=${PREFIX}/include/lua INSTALL_MAN=${PREFIX}/share/man/man1",
  "mkdir -p ${PREFIX}/lib/pkgconfig",
  "printf 'Name: Lua\\nDescription: An Extensible Extension Language\\nVersion: %s\\nLibs: -L%s/lib -llua -lm\\nCflags: -I%s/include/lua\\n' \"${VERSION}\" \"${PREFIX}\" \"${PREFIX}\" > ${PREFIX}/lib/pkgconfig/lua.pc",
]

[build.linux-amd64]
steps = [
  "make -j${JOBS} PLAT=linux MYCFLAGS=-fPIC INSTALL_TOP=${PREFIX} INSTALL_INC=${PREFIX}/include/lua INSTALL_MAN=${PREFIX}/share/man/man1",
  "make install PLAT=linux MYCFLAGS=-fPIC INSTALL_TOP=${PREFIX} INSTALL_INC=${PREFIX}/include/lua INSTALL_MAN=${PREFIX}/share/man/man1",
  "mkdir -p ${PREFIX}/lib/pkgconfig",
  "printf 'Name: Lua\\nDescription: An Extensible Extension Language\\nVersion: %s\\nLibs: -L%s/lib -llua -lm -ldl\\nCflags: -I%s/include/lua\\n' \"${VERSION}\" \"${PREFIX}\" \"${PREFIX}\" > ${PREFIX}/lib/pkgconfig/lua.pc",
]

[build.linux-arm64]
steps = [
  "make -j${JOBS} PLAT=linux MYCFLAGS=-fPIC INSTALL_TOP=${PREFIX} INSTALL_INC=${PREFIX}/include/lua INSTALL_MAN=${PREFIX}/share/man/man1",
  "make install PLAT=linux MYCFLAGS=-fPIC INSTALL_TOP=${PREFIX} INSTALL_INC=${PREFIX}/include/lua INSTALL_MAN=${PREFIX}/share/man/man1",
  "mkdir -p ${PREFIX}/lib/pkgconfig",
  "printf 'Name: Lua\\nDescription: An Extensible Extension Language\\nVersion: %s\\nLibs: -L%s/lib -llua -lm -ldl\\nCflags: -I%s/include/lua\\n' \"${VERSION}\" \"${PREFIX}\" \"${PREFIX}\" > ${PREFIX}/lib/pkgconfig/lua.pc",
]
