[package]
name = "lua"
version = "5.5.0"
description = "Powerful, lightweight programming language"
license = "MIT"
homepage = "https://www.lua.org/"

[source]
url = "https://www.lua.org/ftp/lua-5.5.0.tar.gz"
sha256 = "57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d"

[build.darwin-arm64]
steps = [
  "make -j${JOBS} PLAT=macosx INSTALL_TOP=${PREFIX} INSTALL_INC=${PREFIX}/include/lua INSTALL_MAN=${PREFIX}/share/man/man1",
  "make install PLAT=macosx INSTALL_TOP=${PREFIX} INSTALL_INC=${PREFIX}/include/lua INSTALL_MAN=${PREFIX}/share/man/man1",
]

[build.linux-amd64]
steps = [
  "make -j${JOBS} PLAT=linux MYCFLAGS=-fPIC INSTALL_TOP=${PREFIX} INSTALL_INC=${PREFIX}/include/lua INSTALL_MAN=${PREFIX}/share/man/man1",
  "make install PLAT=linux MYCFLAGS=-fPIC INSTALL_TOP=${PREFIX} INSTALL_INC=${PREFIX}/include/lua INSTALL_MAN=${PREFIX}/share/man/man1",
]
