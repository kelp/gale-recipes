[package]
name = "libgit2"
version = "1.9.3"
revision = 2
description = "A cross-platform, linkable library implementation of Git that you can use in your application."
license = "GPL-2.0-only with linking exception"
homepage = "https://www.libgit2.org"

[source]
repo = "libgit2/libgit2"
url = "https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.3.tar.gz"
sha256 = "d532172d7ab24d2a25944e2434212d63ee85f3650e97b5f7579e7f201a78ad64"
released_at = "2026-05-04"

[build]
system = "cmake"
steps = [
  "cmake -B build -DCMAKE_INSTALL_PREFIX=${PREFIX} -DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_CLI=OFF -DUSE_SSH=ON",
  "cmake --build build -j${JOBS}",
  "cmake --install build",
]

[dependencies]
build = ["cmake", "libssh2", "openssl", "pkgconf", "zlib"]
runtime = ["libssh2"]