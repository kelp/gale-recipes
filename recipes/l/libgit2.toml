[package]
name = "libgit2"
version = "1.9.2"
description = "A cross-platform, linkable library implementation of Git that you can use in your application."
license = "GPL-2.0-only with linking exception"
homepage = "https://www.libgit2.org"

[source]
repo = "libgit2/libgit2"
url = "https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.2.tar.gz"
sha256 = "6f097c82fc06ece4f40539fb17e9d41baf1a5a2fc26b1b8562d21b89bc355fe6"
released_at = "2025-01-15"

[build]
system = "cmake"
steps = [
  "cmake -B build -DCMAKE_INSTALL_PREFIX=${PREFIX} -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_CLI=OFF -DUSE_SSH=OFF",
  "cmake --build build -j${JOBS}",
  "cmake --install build",
]

[dependencies]
build = ["cmake", "openssl", "zlib"]