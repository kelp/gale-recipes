[package]
name = "lazydocker"
version = "0.25.2"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "The lazier way to manage everything docker"
license = "MIT"
homepage = "https://github.com/jesseduffield/lazydocker"

[source]
repo = "jesseduffield/lazydocker"
url = "https://github.com/jesseduffield/lazydocker/archive/refs/tags/v0.25.2.tar.gz"
sha256 = "405071220e5be9aa061c65d290e0347143b73ae0a3cc01df164f0105de2b53c4"
released_at = "2026-04-19"

[build]
system = "go"
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/lazydocker .",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/lazydocker | grep -q 'statically linked'; fi",
]
