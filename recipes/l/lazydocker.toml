[package]
name = "lazydocker"
version = "0.25.0"
description = "The lazier way to manage everything docker"
license = "MIT"
homepage = "https://github.com/jesseduffield/lazydocker"

[source]
repo = "jesseduffield/lazydocker"
url = "https://github.com/jesseduffield/lazydocker/archive/refs/tags/v0.25.0.tar.gz"
sha256 = "480234dec2dbe989462d177f1aa78debec972893ab5981d48d23d7aec8430a58"
released_at = "2025-01-15"

[build]
system = "go"
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/lazydocker .",
]

[dependencies]
build = ["go"]