[package]
name = "llvm"
version = "22.1.8"
revision = 2
platforms = ["linux-amd64", "linux-arm64"]
description = "LLVM/Clang toolchain with libc++ and lld"
license = "Apache-2.0 WITH LLVM-exception"
homepage = "https://llvm.org"

[source]
repo = "llvm/llvm-project"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz"
sha256 = "922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888"

# LLVM source builds are expensive and require an existing
# compiler toolchain. These build steps install the official
# upstream release bundles used as compiler bootstraps.
#
# Gale's `build.toolchain = "llvm"` support expects the
# installed package to provide toolchain components under the
# standard prefix layout, especially:
# - bin/clang, bin/clang++, bin/ld.lld
# - bin/llvm-ar, bin/llvm-nm, bin/llvm-ranlib
# - include/c++/v1
# - lib/ (including libc++, libc++abi, libunwind, lib/clang)

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.1/LLVM-22.1.1-Linux-X64.tar.xz",
  "echo 'efc4d945744f951df00ec72c5b31da5d5a2eaf1d53cc7c9d0644f93f0f9e817d  /tmp/llvm.tar.xz' | shasum -a 256 -c",
  "rm -rf /tmp/llvm-extract && mkdir -p /tmp/llvm-extract",
  "tar -xJf /tmp/llvm.tar.xz -C /tmp/llvm-extract --strip-components=1",
  "mkdir -p ${PREFIX}",
  "for dir in bin include lib libexec share; do [ -e /tmp/llvm-extract/$dir ] && cp -R /tmp/llvm-extract/$dir ${PREFIX}/; done",
]

[build.linux-arm64]
steps = [
  "curl -sL -o /tmp/llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.1/LLVM-22.1.1-Linux-ARM64.tar.xz",
  "echo 'a807a16a4dd9a288b6ad3d507df4eae47dfdfbccab118170ebd216b85370a065  /tmp/llvm.tar.xz' | shasum -a 256 -c",
  "rm -rf /tmp/llvm-extract && mkdir -p /tmp/llvm-extract",
  "tar -xJf /tmp/llvm.tar.xz -C /tmp/llvm-extract --strip-components=1",
  "mkdir -p ${PREFIX}",
  "for dir in bin include lib libexec share; do [ -e /tmp/llvm-extract/$dir ] && cp -R /tmp/llvm-extract/$dir ${PREFIX}/; done",
]
