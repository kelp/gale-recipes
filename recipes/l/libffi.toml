[package]
name = "libffi"
version = "3.7.1"
revision = 2
description = "Portable Foreign Function Interface library"
license = "MIT"
homepage = "https://sourceware.org/libffi/"

[source]
repo = "libffi/libffi"
url = "https://github.com/libffi/libffi/releases/download/v3.7.1/libffi-3.7.1.tar.gz"
sha256 = "d5e9a6638ddbd2513ddb54518eb67e4bbe6fa707bcc01c10f6212f0a088d819d"
released_at = "2026-07-10"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --disable-docs --disable-multi-os-directory",
  "make -j${JOBS}",
  "make install",
]
