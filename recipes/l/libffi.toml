[package]
name = "libffi"
version = "3.8.0"
revision = 2
description = "Portable Foreign Function Interface library"
license = "MIT"
homepage = "https://sourceware.org/libffi/"

[source]
repo = "libffi/libffi"
url = "https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz"
sha256 = "7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4"
released_at = "2026-08-08"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --disable-docs --disable-multi-os-directory",
  "make -j${JOBS}",
  "make install",
]
