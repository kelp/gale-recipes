[package]
name = "libidn2"
version = "2.3.8"
revision = 2
description = "Internationalized domain names library"
license = "LGPL-3.0-or-later"
homepage = "https://www.gnu.org/software/libidn/"

[source]
repo = "libidn/libidn2"
url = "https://ftp.gnu.org/gnu/libidn/libidn2-2.3.8.tar.gz"
sha256 = "f557911bf6171621e1f72ff35f5b1825bb35b52ed45325dcdee931e5d3c0787a"

[build]
steps = [
  "./configure --prefix=${PREFIX} --with-included-libunistring --disable-doc --disable-gtk-doc",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = []
