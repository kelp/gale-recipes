[package]
name = "libusb"
version = "1.0.29"
description = "Cross-platform user-space USB device access library"
license = "LGPL-2.1-or-later"
homepage = "https://libusb.info/"

[source]
repo = "libusb/libusb"
url = "https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.tar.bz2"
sha256 = "5977fc950f8d1395ccea9bd48c06b3f808fd3c2c961b44b0c2e6e29fc3a70a85"

[build]
steps = [
  "./configure --prefix=${PREFIX} --disable-static --disable-udev",
  "make -j${JOBS}",
  "make install",
]
