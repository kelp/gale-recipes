[package]
name = "libjpeg-turbo"
version = "3.1.4.1"
revision = 2
platforms = ["darwin-amd64", "darwin-arm64"]
description = "SIMD-accelerated JPEG codec library"
license = "IJG AND BSD-3-Clause AND Zlib"
homepage = "https://libjpeg-turbo.org/"

[source]
repo = "libjpeg-turbo/libjpeg-turbo"
url = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.4.1/libjpeg-turbo-3.1.4.1.tar.gz"
sha256 = "ecae8008e2cc9ade2f2c1bb9d5e6d4fb73e7c433866a056bd82980741571a022"

[build]
steps = [
  "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${PREFIX} -DENABLE_STATIC=ON -DENABLE_SHARED=ON -DWITH_JPEG8=ON",
  "cmake --build build -j ${JOBS}",
  "cmake --install build",
  # The CLI tools (cjpeg, djpeg, ...) link the shared lib as
  # @rpath/libjpeg.8.dylib, but libjpeg-turbo's CMake leaves
  # no LC_RPATH on them resolving to ${PREFIX}/lib, so dyld
  # aborts at runtime. The -DCMAKE_INSTALL_RPATH configure
  # flag doesn't stick (upstream clears the tools' install
  # rpath), so add it explicitly post-install. bin/ -> lib/
  # is @loader_path/../lib. Darwin-only recipe.
  "for b in ${PREFIX}/bin/*; do [ -f \"$b\" ] || continue; file \"$b\" | grep -q Mach-O || continue; install_name_tool -add_rpath @loader_path/../lib \"$b\" 2>/dev/null || true; done",
]

[dependencies]
build = ["cmake"]
