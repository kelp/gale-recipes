[package]
name = "wget"
version = "1.24.5"
revision = 2
description = "Internet file retriever"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/wget/"

[source]
repo = "mirror/wget"
url = "https://ftpmirror.gnu.org/gnu/wget/wget-1.24.5.tar.gz"
sha256 = "fa2dc35bab5184ecbc46a9ef83def2aaaa3f4c9f3c97d4bd19dcb07d4da637de"
released_at = "2024-03-10"

[build]
steps = [
  "./configure --prefix=${PREFIX} --with-ssl=openssl --disable-debug",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["pkgconf"]
runtime = ["openssl", "libidn2", "gettext"]
