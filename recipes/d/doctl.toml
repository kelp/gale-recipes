[package]
name = "doctl"
version = "1.162.0"
revision = 2
description = "Command-line tool for DigitalOcean"
license = "Apache-2.0"
homepage = "https://github.com/digitalocean/doctl"

[source]
repo = "digitalocean/doctl"
url = "https://github.com/digitalocean/doctl/archive/refs/tags/v1.162.0.tar.gz"
sha256 = "2061a1a10f0717030997d3c083642ddb951d64d86b9476b88f0948bc4cfc4605"
released_at = "2026-06-16"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/doctl ./cmd/doctl",
]

[dependencies]
build = ["go"]
