[package]
name = "doctl"
version = "1.153.0"
description = "Command-line tool for DigitalOcean"
license = "Apache-2.0"
homepage = "https://github.com/digitalocean/doctl"

[source]
repo = "digitalocean/doctl"
url = "https://github.com/digitalocean/doctl/archive/refs/tags/v1.153.0.tar.gz"
sha256 = "096b9ecb024bf471ef9292eda2e04db211bf2102f4d150fa0ccb8a168d2b7def"
released_at = "2026-03-24"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/doctl ./cmd/doctl",
]

[dependencies]
build = ["go"]
