[package]
name = "doctl"
version = "1.166.0"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Command-line tool for DigitalOcean"
license = "Apache-2.0"
homepage = "https://github.com/digitalocean/doctl"

[source]
repo = "digitalocean/doctl"
url = "https://github.com/digitalocean/doctl/archive/refs/tags/v1.166.0.tar.gz"
sha256 = "6a8c7ea59105f6274be9efeda947c275cd64b0e1f9f3112c9b2d6385d7994007"
released_at = "2026-07-31"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/doctl ./cmd/doctl",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/doctl | grep -q 'statically linked'; fi",
]
