[package]
name = "doctl"
version = "1.163.0"
revision = 2
description = "Command-line tool for DigitalOcean"
license = "Apache-2.0"
homepage = "https://github.com/digitalocean/doctl"

[source]
repo = "digitalocean/doctl"
url = "https://github.com/digitalocean/doctl/archive/refs/tags/v1.163.0.tar.gz"
sha256 = "8cc7acd78114eea8409f86b11843d1298d9b12cc984c277f594802acbb3c972a"
released_at = "2026-06-25"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/doctl ./cmd/doctl",
]

[dependencies]
build = ["go"]
