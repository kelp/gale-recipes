[package]
name = "dive"
version = "0.13.1"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "A tool for exploring each layer in a docker image"
license = "MIT"
homepage = "https://github.com/wagoodman/dive"

[source]
repo = "wagoodman/dive"
url = "https://github.com/wagoodman/dive/archive/refs/tags/v0.13.1.tar.gz"
sha256 = "2a9666e9c3fddd5e2e5bad81dccda520b8102e7cea34e2888f264b4eb0506852"
released_at = "2025-01-15"

[build]
system = "go"
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/dive .",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/dive | grep -q 'statically linked'; fi",
]
