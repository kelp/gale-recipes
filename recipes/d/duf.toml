# Generated from Homebrew formula (BSD-2-Clause)

[package]
name = "duf"
version = "0.9.1"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Disk Usage/Free Utility - a better 'df' alternative"
license = "MIT"
homepage = "https://github.com/muesli/duf"

[source]
repo = "muesli/duf"
url = "https://github.com/muesli/duf/archive/refs/tags/v0.9.1.tar.gz"
sha256 = "1334d8c1a7957d0aceebe651e3af9e1c1e0c6f298f1feb39643dd0bd8ad1e955"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/duf",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/duf | grep -q 'statically linked'; fi",
]
