[package]
name = "docker"
version = "29.3.1"
revision = 2
description = "Docker CLI for container management"
license = "Apache-2.0"
homepage = "https://www.docker.com/"

[source]
repo = "docker/cli"
url = "https://github.com/docker/cli/archive/refs/tags/v29.3.1.tar.gz"
sha256 = "76a1b916e21c3ade3031fb416025fcdf360c4ab006c5b435585322da36e94dac"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "cp vendor.mod go.mod",
  "cp vendor.sum go.sum",
  "go build -mod=vendor -trimpath -o ${PREFIX}/bin/docker ./cmd/docker",
]

[dependencies]
build = ["go"]
