[package]
name = "docker"
version = "29.6.1"
revision = 2
description = "Docker CLI for container management"
license = "Apache-2.0"
homepage = "https://www.docker.com/"

[source]
repo = "docker/cli"
url = "https://github.com/docker/cli/archive/refs/tags/v29.6.1.tar.gz"
sha256 = "74d14dd212b07cd3328989dc6a029dde2ebbe6a878199eaaafad54916f456194"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "cp vendor.mod go.mod",
  "cp vendor.sum go.sum",
  "go build -mod=vendor -trimpath -o ${PREFIX}/bin/docker ./cmd/docker",
]

[dependencies]
build = ["go"]
