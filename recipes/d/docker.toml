[package]
name = "docker"
version = "29.5.3"
revision = 2
description = "Docker CLI for container management"
license = "Apache-2.0"
homepage = "https://www.docker.com/"

[source]
repo = "docker/cli"
url = "https://github.com/docker/cli/archive/refs/tags/v29.5.3.tar.gz"
sha256 = "7608d82f33ce0ebbbed5bf8f6997319375c30a46d325496f3e8974c9a0c8ce6b"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "cp vendor.mod go.mod",
  "cp vendor.sum go.sum",
  "go build -mod=vendor -trimpath -o ${PREFIX}/bin/docker ./cmd/docker",
]

[dependencies]
build = ["go"]
