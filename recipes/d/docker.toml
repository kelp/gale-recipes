[package]
name = "docker"
version = "29.6.2"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Docker CLI for container management"
license = "Apache-2.0"
homepage = "https://www.docker.com/"

[source]
repo = "docker/cli"
url = "https://github.com/docker/cli/archive/refs/tags/v29.6.2.tar.gz"
sha256 = "11aef3484c38d39d291a54a73a4d9dd2bb3c000d9a3fc3862bd03fe899594f2c"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "cp vendor.mod go.mod",
  "cp vendor.sum go.sum",
  "CGO_ENABLED=0 go build -mod=vendor -trimpath -o ${PREFIX}/bin/docker ./cmd/docker",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/docker | grep -q 'statically linked'; fi",
]
