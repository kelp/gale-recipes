[package]
name = "direnv"
version = "2.37.1"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Per-directory environment variables"
license = "MIT"
homepage = "https://direnv.net"

[source]
repo = "direnv/direnv"
url = "https://github.com/direnv/direnv/archive/refs/tags/v2.37.1.tar.gz"
sha256 = "4142fbb661f3218913fac08d327c415e87b3e66bd0953185294ff8f3228ead24"

[dependencies]
build = ["go"]

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/direnv",
]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/direnv | grep -q 'statically linked'; fi",
]
