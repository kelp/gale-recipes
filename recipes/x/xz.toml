[package]
name = "xz"
version = "5.8.3"
revision = 2
description = "General-purpose data compression with high compression ratio"
license = "0BSD AND GPL-2.0-or-later"
homepage = "https://tukaani.org/xz/"

[source]
repo = "tukaani-project/xz"
url = "https://github.com/tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.gz"
sha256 = "3d3a1b973af218114f4f889bbaa2f4c037deaae0c8e815eec381c3d546b974a0"

[build]
steps = [
  "./configure --prefix=${PREFIX} --disable-silent-rules --disable-nls",
  "make -j${JOBS}",
  "make install",
]
