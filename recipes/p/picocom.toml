[package]
name = "picocom"
version = "3.1"
description = "Minimal dumb-terminal emulator for serial ports"
license = "GPL-2.0-or-later"
homepage = "https://github.com/npat-efault/picocom"

[source]
repo = "npat-efault/picocom"
url = "https://github.com/npat-efault/picocom/archive/refs/tags/3.1.tar.gz"
sha256 = "e6761ca932ffc6d09bd6b11ff018bdaf70b287ce518b3282d29e0270e88420bb"

[build]
steps = [
  "make -j${JOBS}",
  "mkdir -p ${PREFIX}/bin ${PREFIX}/share/man/man1",
  "cp picocom ${PREFIX}/bin/",
  "cp picocom.1 ${PREFIX}/share/man/man1/",
]

[dependencies]
build = ["gnumake"]
