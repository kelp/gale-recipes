[package]
name = "python"
version = "3.12.8"
description = "The Python programming language"
license = "Python-2.0"
homepage = "https://www.python.org/"

[source]
repo = "python/cpython"
url = "https://www.python.org/ftp/python/3.12.8/Python-3.12.8.tgz"
sha256 = "5978435c479a376648cb02854df3b892ace9ed7d32b1fead652712bee9d03a45"
released_at = "2025-01-15"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --enable-ipv6 --enable-optimizations --with-lto --with-ensurepip=upgrade --enable-shared --with-openssl=${DEP_OPENSSL} --enable-loadable-sqlite-extensions py_cv_module__tkinter=n/a LDFLAGS_NODIST=\"$LDFLAGS\" CPPFLAGS=\"$CPPFLAGS\"",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["openssl", "zlib", "readline", "sqlite", "xz", "ncurses", "bzip2"]