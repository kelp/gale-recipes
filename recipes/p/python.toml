[package]
name = "python"
version = "3.14.5"
revision = 3
description = "The Python programming language"
license = "Python-2.0"
homepage = "https://www.python.org/"

[source]
repo = "python/cpython"
url = "https://www.python.org/ftp/python/3.14.5/Python-3.14.5.tgz"
sha256 = "9c22bfe9939a6c5418fc74b289a5f1cc41859ae82ac6b163016b5844bd0a86bc"
released_at = "2026-05-10"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --enable-ipv6 --enable-optimizations --with-lto --with-ensurepip=upgrade --with-openssl=${DEP_OPENSSL} --enable-loadable-sqlite-extensions py_cv_module__tkinter=n/a LDFLAGS_NODIST=\"$LDFLAGS\" CPPFLAGS=\"$CPPFLAGS\"",
  "make -j${JOBS}",
  "make install",
  # tkinter is intentionally disabled (no tcl/tk in gale);
  # idle depends on it, so the idle bins can't run.
  "rm -f ${PREFIX}/bin/idle3 ${PREFIX}/bin/idle3.14",
  # PEP 394: provide unversioned `python` for tools with
  # `#!/usr/bin/env python` shebangs. python2 is EOL.
  "ln -sf python3 ${PREFIX}/bin/python",
]

# On Linux, --enable-shared is needed so that consumers
# linking against libpython3.14 (e.g. postgresql's plpython3)
# can do so from a shared object. Without it, libpython is
# a static archive without -fPIC and fails shared linking.
[build.linux-amd64]
steps = [
  "./configure --prefix=${PREFIX} --enable-shared --enable-ipv6 --enable-optimizations --with-lto --with-ensurepip=upgrade --with-openssl=${DEP_OPENSSL} --enable-loadable-sqlite-extensions py_cv_module__tkinter=n/a LDFLAGS_NODIST=\"$LDFLAGS\" CPPFLAGS=\"$CPPFLAGS\"",
  "make -j${JOBS}",
  "make install",
  # tkinter is intentionally disabled (no tcl/tk in gale);
  # idle depends on it, so the idle bins can't run.
  "rm -f ${PREFIX}/bin/idle3 ${PREFIX}/bin/idle3.14",
  # PEP 394: provide unversioned `python` for tools with
  # `#!/usr/bin/env python` shebangs. python2 is EOL.
  "ln -sf python3 ${PREFIX}/bin/python",
]

[build.linux-arm64]
steps = [
  "./configure --prefix=${PREFIX} --enable-shared --enable-ipv6 --enable-optimizations --with-lto --with-ensurepip=upgrade --with-openssl=${DEP_OPENSSL} --enable-loadable-sqlite-extensions py_cv_module__tkinter=n/a LDFLAGS_NODIST=\"$LDFLAGS\" CPPFLAGS=\"$CPPFLAGS\"",
  "make -j${JOBS}",
  "make install",
  # tkinter is intentionally disabled (no tcl/tk in gale);
  # idle depends on it, so the idle bins can't run.
  "rm -f ${PREFIX}/bin/idle3 ${PREFIX}/bin/idle3.14",
  # PEP 394: provide unversioned `python` for tools with
  # `#!/usr/bin/env python` shebangs. python2 is EOL.
  "ln -sf python3 ${PREFIX}/bin/python",
]

[dependencies]
build = ["bzip2", "libffi", "ncurses", "openssl", "readline", "sqlite", "xz", "zlib"]
# python's extension modules (_ssl, _hashlib, _sqlite3,
# _lzma, _ctypes, _bz2, readline, zlib, _curses) dlopen
# these libs at runtime via rpath into the gale store.
runtime = ["bzip2", "libffi", "ncurses", "openssl", "readline", "sqlite", "xz", "zlib"]
