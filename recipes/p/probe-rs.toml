[package]
name = "probe-rs"
version = "0.32.0"
description = "Rust-based Cortex-M flasher and RTT debugger (probe-rs, cargo-flash, cargo-embed)"
license = "MIT OR Apache-2.0"
homepage = "https://probe.rs"

# probe-rs publishes prebuilt static binaries per release.
# Building from source needs cargo + a working LLVM, so
# binary install is the sensible path.

[source]
repo = "probe-rs/probe-rs"
url = "https://github.com/probe-rs/probe-rs/releases/download/v0.32.0/probe-rs-tools-aarch64-apple-darwin.tar.xz"
sha256 = "c39631679b83d0c94dc442d05cc4ca974a87c02907a6ddbfce46746ed503152c"

[build.darwin-arm64]
steps = [
  "curl -fsSL -o /tmp/probe-rs.tar.xz https://github.com/probe-rs/probe-rs/releases/download/v${VERSION}/probe-rs-tools-aarch64-apple-darwin.tar.xz",
  "echo 'ade07f1172a5cc17f8d465bc3d2651e7d06212ef79d150d5b10c7a867a192151  /tmp/probe-rs.tar.xz' | shasum -a 256 -c",
  "mkdir -p /tmp/probe-rs-extract && tar -xJf /tmp/probe-rs.tar.xz -C /tmp/probe-rs-extract --strip-components=1",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/probe-rs-extract/probe-rs ${PREFIX}/bin/",
  "cp /tmp/probe-rs-extract/cargo-flash ${PREFIX}/bin/",
  "cp /tmp/probe-rs-extract/cargo-embed ${PREFIX}/bin/",
]

[build.linux-amd64]
steps = [
  "curl -fsSL -o /tmp/probe-rs.tar.xz https://github.com/probe-rs/probe-rs/releases/download/v${VERSION}/probe-rs-tools-x86_64-unknown-linux-gnu.tar.xz",
  "echo '25e6c6792914994cd0b7a6d2f90f28c17ac22a45af8f4424e9a0f44a60ee85f2  /tmp/probe-rs.tar.xz' | sha256sum -c",
  "mkdir -p /tmp/probe-rs-extract && tar -xJf /tmp/probe-rs.tar.xz -C /tmp/probe-rs-extract --strip-components=1",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/probe-rs-extract/probe-rs ${PREFIX}/bin/",
  "cp /tmp/probe-rs-extract/cargo-flash ${PREFIX}/bin/",
  "cp /tmp/probe-rs-extract/cargo-embed ${PREFIX}/bin/",
]

[build.linux-arm64]
steps = [
  "curl -fsSL -o /tmp/probe-rs.tar.xz https://github.com/probe-rs/probe-rs/releases/download/v${VERSION}/probe-rs-tools-aarch64-unknown-linux-gnu.tar.xz",
  "echo '80e4235c3262bf42e93a024124af37d3ddcf05b16bbc3b5b57eff8623061e385  /tmp/probe-rs.tar.xz' | sha256sum -c",
  "mkdir -p /tmp/probe-rs-extract && tar -xJf /tmp/probe-rs.tar.xz -C /tmp/probe-rs-extract --strip-components=1",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/probe-rs-extract/probe-rs ${PREFIX}/bin/",
  "cp /tmp/probe-rs-extract/cargo-flash ${PREFIX}/bin/",
  "cp /tmp/probe-rs-extract/cargo-embed ${PREFIX}/bin/",
]
