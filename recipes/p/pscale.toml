[package]
name = "pscale"
version = "0.307.0"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "CLI for PlanetScale Database"
license = "Apache-2.0"
homepage = "https://www.planetscale.com/"

[source]
repo = "planetscale/cli"
url = "https://github.com/planetscale/cli/archive/refs/tags/v0.307.0.tar.gz"
sha256 = "2d3563c455dbe021b3854ccea47cbca9e156ddd045082faee91d1bb637dbea77"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/pscale ./cmd/pscale",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/pscale | grep -q 'statically linked'; fi",
]
