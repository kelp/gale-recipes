[package]
name = "pscale"
version = "0.283.0"
revision = 2
description = "CLI for PlanetScale Database"
license = "Apache-2.0"
homepage = "https://www.planetscale.com/"

[source]
repo = "planetscale/cli"
url = "https://github.com/planetscale/cli/archive/refs/tags/v0.283.0.tar.gz"
sha256 = "734a407ab65e52bacc1b1bb9c46a0b429ce65463d031acc28ee87c695f1f20db"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/pscale ./cmd/pscale",
]

[dependencies]
build = ["go"]
