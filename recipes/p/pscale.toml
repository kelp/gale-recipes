[package]
name = "pscale"
version = "0.291.0"
revision = 2
description = "CLI for PlanetScale Database"
license = "Apache-2.0"
homepage = "https://www.planetscale.com/"

[source]
repo = "planetscale/cli"
url = "https://github.com/planetscale/cli/archive/refs/tags/v0.291.0.tar.gz"
sha256 = "3973805b0e54062ad83f52dca9316e014b2fb034ba7124fc69871577aad557b5"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/pscale ./cmd/pscale",
]

[dependencies]
build = ["go"]
