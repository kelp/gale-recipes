[package]
name = "pigz"
version = "2.8"
description = "Parallel implementation of gzip"
license = "Zlib"
homepage = "https://zlib.net/pigz/"

[source]
url = "https://zlib.net/pigz/pigz-2.8.tar.gz"
sha256 = "eb872b4f0e1f0ebe59c9f7bd8c506c4204893ba6a8492de31df416f0d5170fd0"

[build]
steps = [
  "make -j${JOBS} CC=cc",
  "mkdir -p ${PREFIX}/bin ${PREFIX}/share/man/man1",
  "cp pigz ${PREFIX}/bin/pigz",
  "ln -s pigz ${PREFIX}/bin/unpigz",
  "cp pigz.1 ${PREFIX}/share/man/man1/pigz.1",
]
