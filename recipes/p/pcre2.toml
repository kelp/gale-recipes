[package]
name = "pcre2"
version = "10.47"
revision = 2
description = "Perl compatible regular expressions library with a new API"
license = "BSD-3-Clause"
homepage = "https://www.pcre.org/"

[source]
repo = "PCRE2Project/pcre2"
url = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.47/pcre2-10.47.tar.bz2"
sha256 = "47fe8c99461250d42f89e6e8fdaeba9da057855d06eb7fc08d9ca03fd08d7bc7"

[build]
steps = [
  "./configure --prefix=${PREFIX} --enable-pcre2-16 --enable-pcre2-32 --enable-jit",
  "make -j${JOBS}",
  "make install",
]
