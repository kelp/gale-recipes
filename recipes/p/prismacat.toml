[package]
name = "prismacat"
version = "0.2.0"
revision = 1
description = "Themeable truecolor cat for terminal gradients"
license = "MIT"
homepage = "https://github.com/mattrobenolt/prismacat"

[source]
repo = "mattrobenolt/prismacat"
url = "https://github.com/mattrobenolt/prismacat/archive/refs/tags/v0.2.0.tar.gz"
sha256 = "ebc9406ccd108643d19fb1b19f817e287e9969b602eff98219a56fee9f070bb1"
released_at = "2026-05-23"

[build]
system = "zig"
steps = [
  "zig build -Doptimize=ReleaseSafe -Dcpu=baseline --prefix ${PREFIX}",
]

[dependencies]
# build.zig.zon pins minimum_zig_version = 0.16.0
# fetches iTerm2-Color-Schemes as a git+ dep, so git must be on PATH
build = ["zig", "git"]
