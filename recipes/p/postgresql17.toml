[package]
name = "postgresql17"
version = "17.10"
revision = 1
description = "Advanced open source relational database (17.x series)"
license = "PostgreSQL"
homepage = "https://www.postgresql.org/"

[source]
repo = "postgres/postgres"
url = "https://github.com/postgres/postgres/archive/refs/tags/REL_17_10.tar.gz"
sha256 = "bdff4351ed3f5e64295bb11e051fb7a219d6a6a5365a306a81b44ed282ec8bc1"
released_at = "2026-05-14"

[build]
system = "meson"
steps = [
  "meson setup build --prefix=${PREFIX} --buildtype=release -Dssl=openssl -Dzlib=enabled -Dreadline=enabled",
  "meson compile -C build",
  "meson install -C build",
  # The extension modules and pgxs test binaries under
  # lib/postgresql/ link libpq as @rpath/libpq.5.dylib but
  # carry no LC_RPATH resolving to ${PREFIX}/lib, so dyld
  # aborts and gale's install check rejects them. gale's
  # auto-rpath only covers declared deps, not a package's own
  # libpq, so add it here. The offset to ${PREFIX}/lib varies
  # by file depth (lib/postgresql/x.dylib vs the deep pgxs
  # tree), so compute @loader_path/../..(n)../lib per file.
  # Mach-O-only via file(1), so this is a no-op on Linux.
  "find ${PREFIX}/lib/postgresql -type f | while read -r f; do file \"$f\" | grep -q Mach-O || continue; rel=${f#${PREFIX}/}; dir=${rel%/*}; ups=\"\"; IFS=/; for c in $dir; do ups=\"../$ups\"; done; unset IFS; install_name_tool -add_rpath \"@loader_path/${ups}lib\" \"$f\" 2>/dev/null || true; done",
]

[dependencies]
build = ["bison", "flex", "meson", "ninja", "pkgconf", "openssl", "zlib", "readline", "gettext"]
runtime = ["openssl", "zlib", "readline", "gettext"]
