[package]
name = "pnpm"
version = "10.33.0"
description = "Fast, disk space efficient package manager"
license = "MIT"
homepage = "https://pnpm.io"

[source]
repo = "pnpm/pnpm"
url = "https://github.com/pnpm/pnpm/archive/refs/tags/v10.33.0.tar.gz"
sha256 = "7c24603f765e48dc20355ac9c3f2d262630f54c0fe86b6f265306c3bf7fbc81a"
released_at = "2025-01-17"

# pnpm requires pnpm to build from source (circular
# dependency). Use prebuilt standalone binaries from
# GitHub releases.

[build.darwin-arm64]
steps = [
  "curl -sL -o /tmp/pnpm https://github.com/pnpm/pnpm/releases/download/v${VERSION}/pnpm-macos-arm64",
  "echo 'ed8a1f140f4de457b01ebe0be3ae28e9a7e28863315dcd53d22ff1e5a32d63ae  /tmp/pnpm' | shasum -a 256 -c",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/pnpm ${PREFIX}/bin/pnpm",
  "chmod +x ${PREFIX}/bin/pnpm",
]

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/pnpm https://github.com/pnpm/pnpm/releases/download/v${VERSION}/pnpm-linux-x64",
  "echo '8d4e8f7d778e8ac482022e2577011706a872542f6f6f233e795a4d9f978ea8b5  /tmp/pnpm' | shasum -a 256 -c",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/pnpm ${PREFIX}/bin/pnpm",
  "chmod +x ${PREFIX}/bin/pnpm",
]