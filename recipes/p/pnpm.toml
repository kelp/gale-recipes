[package]
name = "pnpm"
version = "11.9.0"
description = "Fast, disk space efficient package manager"
license = "MIT"
homepage = "https://pnpm.io"

[source]
repo = "pnpm/pnpm"
url = "https://github.com/pnpm/pnpm/archive/refs/tags/v11.9.0.tar.gz"
sha256 = "8a04f3076e390427d59e2a306443c6a6fa22de98468d3de567c583f927595c0f"
released_at = "2026-06-23"

# pnpm requires pnpm to build from source (circular
# dependency). Use prebuilt standalone binaries from
# GitHub releases. v11+ ships a node-SEA wrapper that
# resolves `./dist/pnpm.mjs` relative to its own
# location, so the dist/ directory must sit next to the
# binary.

[build.darwin-arm64]
steps = [
  "curl -sL -o /tmp/pnpm.tar.gz https://github.com/pnpm/pnpm/releases/download/v${VERSION}/pnpm-darwin-arm64.tar.gz",
  "echo 'ca6f98a8911ec975509464026205e2b54aed74cecd36c5ae9932e5997bd7de2a  /tmp/pnpm.tar.gz' | shasum -a 256 -c",
  "mkdir -p ${PREFIX}/bin",
  "tar xzf /tmp/pnpm.tar.gz -C ${PREFIX}/bin",
  "chmod +x ${PREFIX}/bin/pnpm",
  "rm /tmp/pnpm.tar.gz",
]

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/pnpm.tar.gz https://github.com/pnpm/pnpm/releases/download/v${VERSION}/pnpm-linux-x64.tar.gz",
  "echo '8d987d82585453bcf260ea5d0bae346d298f1a5e71bcde8d99976521408ad895  /tmp/pnpm.tar.gz' | shasum -a 256 -c",
  "mkdir -p ${PREFIX}/bin",
  "tar xzf /tmp/pnpm.tar.gz -C ${PREFIX}/bin",
  "chmod +x ${PREFIX}/bin/pnpm",
  "rm /tmp/pnpm.tar.gz",
]

[build.linux-arm64]
steps = [
  "curl -sL -o /tmp/pnpm.tar.gz https://github.com/pnpm/pnpm/releases/download/v${VERSION}/pnpm-linux-arm64.tar.gz",
  "echo '7981d0109fffdf8f15b838243240c8c9f9114dd4b7111d4227c1453522d75b61  /tmp/pnpm.tar.gz' | shasum -a 256 -c",
  "mkdir -p ${PREFIX}/bin",
  "tar xzf /tmp/pnpm.tar.gz -C ${PREFIX}/bin",
  "chmod +x ${PREFIX}/bin/pnpm",
  "rm /tmp/pnpm.tar.gz",
]
