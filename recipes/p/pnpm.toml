[package]
name = "pnpm"
version = "11.1.3"
description = "Fast, disk space efficient package manager"
license = "MIT"
homepage = "https://pnpm.io"

[source]
repo = "pnpm/pnpm"
url = "https://github.com/pnpm/pnpm/archive/refs/tags/v11.1.3.tar.gz"
sha256 = "2ddb1e9ab4eceb3a87cd0aeac8fd637350ee57181d160a47d2b77445b54e8243"
released_at = "2026-05-18"

# pnpm requires pnpm to build from source (circular
# dependency). Use prebuilt standalone binaries from
# GitHub releases. v11+ ships a node-SEA wrapper that
# resolves `./dist/pnpm.mjs` relative to its own
# location, so the dist/ directory must sit next to the
# binary.

[build.darwin-arm64]
steps = [
  "curl -sL -o /tmp/pnpm.tar.gz https://github.com/pnpm/pnpm/releases/download/v${VERSION}/pnpm-darwin-arm64.tar.gz",
  "echo 'c258310926cfaaa59b50296bc0defca66a466799eb045d4f76fe3fc3c5e6565d  /tmp/pnpm.tar.gz' | shasum -a 256 -c",
  "mkdir -p ${PREFIX}/bin",
  "tar xzf /tmp/pnpm.tar.gz -C ${PREFIX}/bin",
  "chmod +x ${PREFIX}/bin/pnpm",
  "rm /tmp/pnpm.tar.gz",
]

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/pnpm.tar.gz https://github.com/pnpm/pnpm/releases/download/v${VERSION}/pnpm-linux-x64.tar.gz",
  "echo '8e5685c22bc05e8092adb056bb3d848c3d7926a2c909ed028052098d59db9e6e  /tmp/pnpm.tar.gz' | shasum -a 256 -c",
  "mkdir -p ${PREFIX}/bin",
  "tar xzf /tmp/pnpm.tar.gz -C ${PREFIX}/bin",
  "chmod +x ${PREFIX}/bin/pnpm",
  "rm /tmp/pnpm.tar.gz",
]

[build.linux-arm64]
steps = [
  "curl -sL -o /tmp/pnpm.tar.gz https://github.com/pnpm/pnpm/releases/download/v${VERSION}/pnpm-linux-arm64.tar.gz",
  "echo '35676a3dacc7e325dd6ac90db35fd425f17748ea8095c2ea6d47c2375a974fcd  /tmp/pnpm.tar.gz' | shasum -a 256 -c",
  "mkdir -p ${PREFIX}/bin",
  "tar xzf /tmp/pnpm.tar.gz -C ${PREFIX}/bin",
  "chmod +x ${PREFIX}/bin/pnpm",
  "rm /tmp/pnpm.tar.gz",
]
