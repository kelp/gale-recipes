# NOTE: postgresql requires flex. There is no flex recipe in gale-recipes yet.
# Once a flex recipe is added, this will build.
[package]
name = "postgresql"
version = "17.2"
revision = 2
description = "Advanced open source relational database"
license = "PostgreSQL"
homepage = "https://www.postgresql.org/"

[source]
repo = "postgres/postgres"
url = "https://github.com/postgres/postgres/archive/refs/tags/REL_17_2.tar.gz"
sha256 = "dea967b2c9fd112c27478354e3fcf8d5a5f00acc7cc6d8d185c3fae70b6eb67a"
released_at = "2025-01-15"

[build]
system = "meson"
steps = [
  "meson setup build --prefix=${PREFIX} --buildtype=release -Dssl=openssl -Dzlib=enabled -Dreadline=enabled",
  "meson compile -C build",
  "meson install -C build",
]

[dependencies]
build = ["bison", "flex", "meson", "ninja", "pkgconf", "openssl", "zlib", "readline"]
runtime = ["openssl", "zlib", "readline"]