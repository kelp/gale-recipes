[package]
name = "patchelf"
version = "0.19.0"
revision = 2
description = "Modify ELF executables and libraries"
license = "GPL-3.0"
homepage = "https://github.com/NixOS/patchelf"

[source]
repo = "NixOS/patchelf"
url = "https://github.com/NixOS/patchelf/releases/download/0.19.0/patchelf-0.19.0.tar.gz"
sha256 = "4782e58d7dd5deae3f8d215f86f94fda0e3d072b583f5ad443846f3381fb472a"

[build]
steps = [
  "./configure --prefix=${PREFIX}",
  "make -j${JOBS}",
  "make install",
]
