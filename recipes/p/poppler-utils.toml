[package]
name = "poppler-utils"
version = "26.04.0"
revision = 2
platforms = ["darwin-amd64", "darwin-arm64"]
description = "PDF rendering library and command-line utilities (pdftotext, pdftoppm, pdfinfo, pdfimages, pdftocairo, etc.)"
license = "GPL-2.0-only"
homepage = "https://poppler.freedesktop.org/"

[source]
url = "https://poppler.freedesktop.org/poppler-26.04.0.tar.xz"
sha256 = "b0955163114af96bc0106f68cb24daf973a629462453d8b82775f81b0d4e0693"

# poppler's upstream "poppler" source ships the library plus
# the CLI utilities in a single tree. This recipe tracks
# Debian's poppler-utils split: build ENABLE_UTILS=ON and
# disable the Qt5/Qt6/CPP/GLib wrappers that gale does not
# need for a CLI-only install. Keep all image/color deps —
# pdftoppm, pdfimages, pdftocairo, and pdftohtml rely on
# them for full functionality.
#
# Disabled intentionally:
#   - ENABLE_CPP/GLIB/QT5/QT6: language bindings, not utils
#   - ENABLE_GOBJECT_INTROSPECTION: only useful with GLib
#   - ENABLE_NSS3/GPGME: digital-signature verification;
#     the CLI utils themselves don't expose it
#   - ENABLE_LIBCURL: utils read local files, not URLs
#   - ENABLE_BOOST: Splash backend perf optimization only
#   - BUILD_*_TESTS: test binaries

[build]
steps = [
  "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${PREFIX} -DENABLE_UTILS=ON -DENABLE_CPP=OFF -DENABLE_GLIB=OFF -DENABLE_QT5=OFF -DENABLE_QT6=OFF -DENABLE_GOBJECT_INTROSPECTION=OFF -DENABLE_NSS3=OFF -DENABLE_GPGME=OFF -DENABLE_LIBCURL=OFF -DENABLE_BOOST=OFF -DBUILD_GTK_TESTS=OFF -DBUILD_QT5_TESTS=OFF -DBUILD_QT6_TESTS=OFF -DBUILD_CPP_TESTS=OFF -DBUILD_MANUAL_TESTS=OFF -DBUILD_SHARED_LIBS=OFF",
  "cmake --build build -j ${JOBS}",
  "cmake --install build",
]

[dependencies]
build = ["cmake", "pkgconf"]
# freetype + fontconfig are REQUIRED by CMakeLists.
# zlib is REQUIRED. cairo, libjpeg-turbo, libpng, libtiff,
# openjpeg, lcms2 are technically optional but needed for
# the utils to produce images / render text correctly.
runtime = [
  "cairo",
  "fontconfig",
  "freetype",
  "lcms2",
  "libjpeg-turbo",
  "libpng",
  "libtiff",
  "openjpeg",
  "zlib",
]

[smoke]
commands = [
  "${PREFIX}/bin/pdfinfo -v",
  "${PREFIX}/bin/pdftotext -v",
  "${PREFIX}/bin/pdftoppm -v",
]
