[package]
name = "yt-dlp"
version = "2026.06.09"
revision = 2
description = "A feature-rich command-line audio/video downloader"
license = "Unlicense"
homepage = "https://github.com/yt-dlp/yt-dlp"

[source]
repo = "yt-dlp/yt-dlp"
url = "https://github.com/yt-dlp/yt-dlp/archive/refs/tags/2026.06.09.tar.gz"
sha256 = "6add707714c1d9a960cb6f4de1dcbd9fbf857f1bc488d26b43f0701246a06f38"
released_at = "2026-06-09"

[dependencies]
build = ["python"]

[build]
system = "python"
steps = [
  "${DEP_PYTHON}/bin/python3 -m pip install --prefix=${PREFIX} --no-deps .",
]