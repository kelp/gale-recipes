# Generated from Homebrew formula (BSD-2-Clause)

[package]
name = "yq"
version = "4.53.2"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Process YAML, JSON, XML, CSV and properties documents from the CLI"
license = "MIT"
homepage = "https://github.com/mikefarah/yq"

[source]
repo = "mikefarah/yq"
url = "https://github.com/mikefarah/yq/archive/refs/tags/v4.53.2.tar.gz"
sha256 = "1bc19bb8b1029148afa3465a9383f6dcccb1ecce28a0af1d81f07c93396ce37d"
released_at = "2026-04-17"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/yq",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/yq | grep -q 'statically linked'; fi",
]
