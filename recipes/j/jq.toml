[package]
name = "jq"
version = "1.8.2"
revision = 5
description = "Lightweight and flexible command-line JSON processor"
license = "MIT"
homepage = "https://jqlang.github.io/jq"

[source]
repo = "jqlang/jq"
url = "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-1.8.2.tar.gz"
sha256 = "71b8d6e8f5fe81f6c6d0d110e3892251f6ce76ed095abd315e26e6e1193af3af"
released_at = "2026-06-20"

[build]
# --with-oniguruma=builtin alone still builds oniguruma as a
# dylib that jq links against. --disable-shared forces the
# builtin oniguruma (and libjq) to be built static-only, so
# the jq binary has no @rpath/libonig.5.dylib dep and nothing
# collides with the standalone oniguruma package in the farm.
steps = [
  "./configure --prefix=${PREFIX} --with-oniguruma=builtin --disable-shared --disable-docs --disable-maintainer-mode",
  "make -j${JOBS}",
  "make install",
  # --disable-shared still leaves the static libonig.a/.la and
  # oniguruma.pc in place; drop them so they don't collide
  # with the standalone oniguruma package.
  "rm -f ${PREFIX}/lib/libonig* ${PREFIX}/lib/pkgconfig/oniguruma.pc",
]

[dependencies]
build = []

# The test() filter goes through the builtin oniguruma.
# This catches the class of bug where jq is linked against
# an @rpath/libonig.5.dylib that isn't actually present at
# runtime — revision 2-3 shipped a binary that dyld aborted
# on, because the recipe deleted the dylib it still loaded.
[smoke]
commands = [
  "${PREFIX}/bin/jq --version",
  "echo '\"hello world\"' | ${PREFIX}/bin/jq -e 'test(\"hell.\")'",
  "echo '{\"xs\":[1,2,3]}' | ${PREFIX}/bin/jq '.xs | add'",
]
