[package]
name = "rsync"
version = "3.4.4"
revision = 2
description = "Utility that provides fast incremental file transfer"
license = "GPL-3.0-or-later"
homepage = "https://rsync.samba.org/"

[source]
repo = "RsyncProject/rsync"
url = "https://download.samba.org/pub/rsync/src/rsync-3.4.4.tar.gz"
sha256 = "bd88cf82fa653da32314fb229136407c5c90f80d1758d8f4b091767877d8fa96"
released_at = "2026-06-08"

[build]
steps = [
  "./configure --prefix=${PREFIX} --disable-lz4 --disable-xxhash",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["pkgconf"]
runtime = ["openssl", "zstd"]
