[package]
name = "rsync"
version = "3.4.1"
revision = 2
description = "Utility that provides fast incremental file transfer"
license = "GPL-3.0-or-later"
homepage = "https://rsync.samba.org/"

[source]
repo = "RsyncProject/rsync"
url = "https://rsync.samba.org/ftp/rsync/rsync-3.4.1.tar.gz"
sha256 = "2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52"
released_at = "2025-01-15"

[build]
steps = [
  "./configure --prefix=${PREFIX} --disable-lz4 --disable-xxhash",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["pkgconf"]
runtime = ["openssl", "zstd"]
