[package]
name = "rsync"
version = "3.4.2"
revision = 2
description = "Utility that provides fast incremental file transfer"
license = "GPL-3.0-or-later"
homepage = "https://rsync.samba.org/"

[source]
repo = "RsyncProject/rsync"
url = "https://download.samba.org/pub/rsync/src/rsync-3.4.2.tar.gz"
sha256 = "ff10aa2c151cd4b2dbbe6135126dbc854046113d2dfb49572a348233267eb315"
released_at = "2026-04-28"

[build]
steps = [
  "./configure --prefix=${PREFIX} --disable-lz4 --disable-xxhash",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["pkgconf"]
runtime = ["openssl", "zstd"]
