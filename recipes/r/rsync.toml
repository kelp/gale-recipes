[package]
name = "rsync"
version = "3.4.3"
revision = 2
description = "Utility that provides fast incremental file transfer"
license = "GPL-3.0-or-later"
homepage = "https://rsync.samba.org/"

[source]
repo = "RsyncProject/rsync"
url = "https://download.samba.org/pub/rsync/src/rsync-3.4.3.tar.gz"
sha256 = "c72e63ca3021cbc80ba86ec30102773f4c5631fbc492b52e773b3958f82a53d3"
released_at = "2026-05-20"

[build]
steps = [
  "./configure --prefix=${PREFIX} --disable-lz4 --disable-xxhash",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["pkgconf"]
runtime = ["openssl", "zstd"]
