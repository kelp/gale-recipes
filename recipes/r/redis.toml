[package]
name = "redis"
version = "8.6.3"
revision = 2
description = "Persistent key-value database, with built-in net interface"
license = "AGPL-3.0-only"
homepage = "https://redis.io/"

[source]
repo = "redis/redis"
url = "https://download.redis.io/releases/redis-8.6.3.tar.gz"
sha256 = "9f54d4458c52be5472cdd1347d737f1d488b520fc3d0911cba47302de8d836e2"
released_at = "2026-05-05"

[build]
steps = [
  "make -C src -j${JOBS} BUILD_TLS=yes redis-server redis-cli redis-benchmark redis-check-rdb redis-check-aof",
  "install -d ${PREFIX}/bin",
  "install src/redis-server ${PREFIX}/bin/redis-server",
  "install src/redis-cli ${PREFIX}/bin/redis-cli",
  "install src/redis-benchmark ${PREFIX}/bin/redis-benchmark",
  "ln -sf redis-server ${PREFIX}/bin/redis-check-rdb",
  "ln -sf redis-server ${PREFIX}/bin/redis-check-aof",
  "ln -sf redis-server ${PREFIX}/bin/redis-sentinel",
]

[dependencies]
build = ["gnumake"]
runtime = ["openssl"]
