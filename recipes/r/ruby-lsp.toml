[package]
name = "ruby-lsp"
version = "0.26.10"
revision = 2
description = "An opinionated language server for Ruby"
license = "MIT"
homepage = "https://shopify.github.io/ruby-lsp/"

[source]
repo = "Shopify/ruby-lsp"
url = "https://github.com/Shopify/ruby-lsp/archive/refs/tags/v0.26.10.tar.gz"
sha256 = "32225c7c1ede0862b4ccbb6fdfff0d79ef16e972d4d7b02e54e8aab6f94351dc"
released_at = "2026-07-07"

[build]
system = "ruby"
steps = [
  "gem build *.gemspec --force",
  "gem install --install-dir ${PREFIX}/lib/ruby/gems --bindir ${PREFIX}/bin --ignore-dependencies --force *.gem",
]

[dependencies]
build = ["ruby"]
