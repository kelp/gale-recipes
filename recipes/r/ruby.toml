[package]
name = "ruby"
version = "4.0.5"
revision = 1
description = "Powerful, clean, object-oriented scripting language"
license = "Ruby"
homepage = "https://www.ruby-lang.org/"

[source]
repo = "ruby/ruby"
url = "https://cache.ruby-lang.org/pub/ruby/4.0/ruby-4.0.5.tar.gz"
sha256 = "7d6149079a63f8ae1d326c9fa65c6019ba2dc3155eae7b39159817911c88958e"

# --enable-load-relative makes Ruby resolve its own
# library paths relative to the binary, which is required
# for gale's relocatable installs — without it `gem`
# bakes in the build-time prefix and fails to find
# rubygems/gem_runner at runtime. --enable-shared keeps
# parity with the darwin build.
[build]
steps = [
  "./configure --prefix=${PREFIX} --enable-shared --enable-load-relative --with-openssl-dir=$(pkg-config --variable=prefix openssl) --disable-install-doc --with-baseruby=no",
  "make -j${JOBS}",
  "make install",
]

# darwin override: ruby's ./configure runs a "whether LDFLAGS
# is valid" try_link and Apple's ld rejects the LDFLAGS gale
# injects. gale builds the LDFLAGS as one -L/-Wl,-rpath pair per
# dep (several deps duplicated) plus the farm rpath and a trailing
# `-Wl,-S -Wl,-headerpad_max_install_names`. We sanitize $LDFLAGS
# before configure: split into tokens, drop `-Wl,-S` (strip during
# link, the suspect flag) and empties, then dedupe preserving order.
# The deduped/filtered value is passed inline so make and the build
# proper still get the dep search paths and rpaths they need.
[build.darwin-arm64]
steps = [
  "LDFLAGS=\"$(printf '%s\\n' $LDFLAGS | awk '$0!=\"-Wl,-S\" && $0!=\"\" && !seen[$0]++' | tr '\\n' ' ')\" ./configure --prefix=${PREFIX} --enable-shared --enable-load-relative --with-openssl-dir=$(pkg-config --variable=prefix openssl) --disable-install-doc --with-baseruby=no",
  "make -j${JOBS}",
  "make install",
]

[build.linux-amd64]
steps = [
  "./configure --prefix=${PREFIX} --enable-shared --enable-load-relative --with-openssl-dir=$(pkg-config --variable=prefix openssl) --disable-install-doc --with-baseruby=no",
  "make -j${JOBS}",
  "make install",
]

[build.linux-arm64]
steps = [
  "./configure --prefix=${PREFIX} --enable-shared --enable-load-relative --with-openssl-dir=$(pkg-config --variable=prefix openssl) --disable-install-doc --with-baseruby=no",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["pkgconf", "libffi", "openssl", "libyaml", "zlib", "readline", "ncurses"]
runtime = ["libffi", "openssl", "libyaml"]
