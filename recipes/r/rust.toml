[package]
name = "rust"
version = "1.94.1"
description = "Systems programming language focused on safety and performance"
license = "MIT OR Apache-2.0"
homepage = "https://www.rust-lang.org"

[source]
url = "https://static.rust-lang.org/dist/rustc-1.94.1-src.tar.gz"
sha256 = "4c142a625f12e3cdf716c68ae19f4f60d98ad1482627b08579b15838e95ad514"

# Rust bootstraps itself: download a previous stable
# release, use its rustc + cargo to compile the source
# tree, then install the result.

[build.darwin-arm64]
steps = [
  "curl -sL -o /tmp/rust-bootstrap.tar.gz https://static.rust-lang.org/dist/rust-1.93.0-aarch64-apple-darwin.tar.gz",
  "echo 'e33cf237cfff8af75581fedece9f3c348e976bb8246078786f1888c3b251d380  /tmp/rust-bootstrap.tar.gz' | shasum -a 256 -c",
  "mkdir -p /tmp/rust-bootstrap-extract && tar -xzf /tmp/rust-bootstrap.tar.gz -C /tmp/rust-bootstrap-extract --strip-components=1",
  "cd /tmp/rust-bootstrap-extract && sh install.sh --prefix=/tmp/rust-bootstrap",
  "./configure --prefix=${PREFIX} --release-channel=stable --enable-cargo-native-static --enable-profiler --set build.cargo=/tmp/rust-bootstrap/bin/cargo --set build.rustc=/tmp/rust-bootstrap/bin/rustc --set llvm.download-ci-llvm=true --set install.sysconfdir=etc --set rust.lto=thin --set rust.codegen-units=1 --set rust.jemalloc=true",
  "python3 x.py build -j${JOBS}",
  "python3 x.py install",
]

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/rust-bootstrap.tar.gz https://static.rust-lang.org/dist/rust-1.93.0-x86_64-unknown-linux-gnu.tar.gz",
  "echo 'ca55df589f7cd68eec883086c5ff63ece04a1820e6d23e514fbb412cc8bf77a4  /tmp/rust-bootstrap.tar.gz' | shasum -a 256 -c",
  "mkdir -p /tmp/rust-bootstrap-extract && tar -xzf /tmp/rust-bootstrap.tar.gz -C /tmp/rust-bootstrap-extract --strip-components=1",
  "cd /tmp/rust-bootstrap-extract && sh install.sh --prefix=/tmp/rust-bootstrap",
  "./configure --prefix=${PREFIX} --release-channel=stable --enable-cargo-native-static --enable-profiler --set build.cargo=/tmp/rust-bootstrap/bin/cargo --set build.rustc=/tmp/rust-bootstrap/bin/rustc --set llvm.download-ci-llvm=true --set install.sysconfdir=etc --set rust.lto=thin --set rust.codegen-units=1 --set rust.jemalloc=true",
  "python3 x.py build -j${JOBS}",
  "python3 x.py install",
]

[binary.darwin-arm64]
url = "https://ghcr.io/v2/kelp/gale-recipes/rust/blobs/sha256:27b0ba89f3a1a9df2c7f9e020c3deef3c58a3cb9d595a859386f3e449eea72e8"
sha256 = "27b0ba89f3a1a9df2c7f9e020c3deef3c58a3cb9d595a859386f3e449eea72e8"

[binary.linux-amd64]
url = "https://ghcr.io/v2/kelp/gale-recipes/rust/blobs/sha256:334a26fc24ccadc9e22b10624feaf16bf154d73ebe4e739d5a8eda2a59bd74a9"
