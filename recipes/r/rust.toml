[package]
name = "rust"
version = "1.97.1"
revision = 1
description = "Systems programming language focused on safety and performance"
license = "MIT OR Apache-2.0"
homepage = "https://www.rust-lang.org"

[source]
repo = "rust-lang/rust"
url = "https://static.rust-lang.org/dist/rustc-1.97.1-src.tar.gz"
sha256 = "622c2b429c53cbfdc0dd3a51d03554e91cd63ebec1912c1f5709640cdfef1a9d"

# Rust bootstraps itself: download a previous stable
# release, use its rustc + cargo to compile the source
# tree, then install the result.

[build.darwin-arm64]
steps = [
  "curl -sL -o /tmp/rust-bootstrap.tar.gz https://static.rust-lang.org/dist/rust-1.95.0-aarch64-apple-darwin.tar.gz",
  "echo 'ec23ad2e0e15a7397d2c3c232356149cc871b7df7f47e25c2acb1070157f5398  /tmp/rust-bootstrap.tar.gz' | shasum -a 256 -c",
  "mkdir -p /tmp/rust-bootstrap-extract && tar -xzf /tmp/rust-bootstrap.tar.gz -C /tmp/rust-bootstrap-extract --strip-components=1",
  "cd /tmp/rust-bootstrap-extract && sh install.sh --prefix=/tmp/rust-bootstrap",
  "./configure --prefix=${PREFIX} --release-channel=stable --enable-cargo-native-static --enable-profiler --set build.cargo=/tmp/rust-bootstrap/bin/cargo --set build.rustc=/tmp/rust-bootstrap/bin/rustc --set llvm.download-ci-llvm=true --set install.sysconfdir=etc --release-description=gale --set rust.lto=thin --set rust.codegen-units=1 --set rust.jemalloc=true",
  "python3 x.py build -j${JOBS}",
  "python3 x.py install",
]

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/rust-bootstrap.tar.gz https://static.rust-lang.org/dist/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz",
  "echo 'a47ac940abd12399d59ad15c877e7113fa35f2b9ec7e6a8a045d4fd8b9741dea  /tmp/rust-bootstrap.tar.gz' | shasum -a 256 -c",
  "mkdir -p /tmp/rust-bootstrap-extract && tar -xzf /tmp/rust-bootstrap.tar.gz -C /tmp/rust-bootstrap-extract --strip-components=1",
  "cd /tmp/rust-bootstrap-extract && sh install.sh --prefix=/tmp/rust-bootstrap",
  "./configure --prefix=${PREFIX} --release-channel=stable --enable-cargo-native-static --enable-profiler --set build.cargo=/tmp/rust-bootstrap/bin/cargo --set build.rustc=/tmp/rust-bootstrap/bin/rustc --set llvm.download-ci-llvm=true --set install.sysconfdir=etc --release-description=gale --set rust.lto=thin --set rust.codegen-units=1 --set rust.jemalloc=true",
  "python3 x.py build -j${JOBS}",
  "python3 x.py install",
]

[build.linux-arm64]
steps = [
  "curl -sL -o /tmp/rust-bootstrap.tar.gz https://static.rust-lang.org/dist/rust-1.95.0-aarch64-unknown-linux-gnu.tar.gz",
  "echo '3b9385d3144ac57616befa0ccbac524f857ba1b4ab074226e73a24d43568a98e  /tmp/rust-bootstrap.tar.gz' | shasum -a 256 -c",
  "mkdir -p /tmp/rust-bootstrap-extract && tar -xzf /tmp/rust-bootstrap.tar.gz -C /tmp/rust-bootstrap-extract --strip-components=1",
  "cd /tmp/rust-bootstrap-extract && sh install.sh --prefix=/tmp/rust-bootstrap",
  "./configure --prefix=${PREFIX} --release-channel=stable --enable-cargo-native-static --enable-profiler --set build.cargo=/tmp/rust-bootstrap/bin/cargo --set build.rustc=/tmp/rust-bootstrap/bin/rustc --set llvm.download-ci-llvm=true --set install.sysconfdir=etc --release-description=gale --set rust.lto=thin --set rust.codegen-units=1 --set rust.jemalloc=true",
  "python3 x.py build -j${JOBS}",
  "python3 x.py install",
]
