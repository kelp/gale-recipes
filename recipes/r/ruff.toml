[package]
name = "ruff"
version = "0.15.20"
revision = 2
description = "Extremely fast Python linter and code formatter, written in Rust"
license = "MIT"
homepage = "https://docs.astral.sh/ruff/"

[source]
repo = "astral-sh/ruff"
url = "https://github.com/astral-sh/ruff/archive/refs/tags/0.15.20.tar.gz"
sha256 = "3d2d9283f8221d04f1debf1ac32ec900bba08aec5609266ac93b8b8464073d16"
released_at = "2026-06-25"

# Ruff is a cargo workspace; the CLI binary lives at
# crates/ruff. cargo install needs the explicit path so it
# picks the right bin from the workspace.
[build]
steps = [
  "cargo install --path crates/ruff --root ${PREFIX}",
]

[dependencies]
build = ["rust"]

[smoke]
commands = [
  "${PREFIX}/bin/ruff --version",
]
