[package]
name = "readline"
version = "8.2"
revision = 3
description = "Library for editing command lines as they are typed in"
license = "GPL-3.0"
homepage = "https://tiswww.case.edu/php/chet/readline/rltop.html"

[source]
repo = "readline/readline"
url = "https://ftp.gnu.org/gnu/readline/readline-8.2.tar.gz"
sha256 = "3feb7171f16a84ee82ca18a36d7b9be109a52c04f492a053331d7d1095007c35"
released_at = "2025-01-15"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --disable-static --with-curses",
  "make -j${JOBS} SHLIB_LIBS='-lncursesw'",
  "make install",
]

[dependencies]
build = ["ncurses"]
runtime = ["ncurses"]