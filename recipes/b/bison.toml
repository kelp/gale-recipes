[package]
name = "bison"
version = "3.8.2"
revision = 2
description = "Parser generator"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/bison/"

[source]
url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.gz"
sha256 = "06c9e13bdf7eb24d4ceb6b59205a4f67c2c7e7213119644430fe82fbd14a0abb"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX}",
  "make -j${JOBS}",
  "make install",
  "mv ${PREFIX}/bin/bison ${PREFIX}/bin/.bison.bin",
  "printf '#!/bin/sh\\ndir=$(cd \"$(dirname \"$0\")/..\" && pwd)\\nexport BISON_PKGDATADIR=\"$dir/share/bison\"\\nexec \"$dir/bin/.bison.bin\" \"$@\"\\n' > ${PREFIX}/bin/bison && chmod +x ${PREFIX}/bin/bison",
]
