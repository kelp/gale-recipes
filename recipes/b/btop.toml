# Generated from Homebrew formula (BSD-2-Clause)

[package]
name = "btop"
version = "1.4.6"
description = "Resource monitor. C++ version and continuation of bashtop and bpytop"
license = "Apache-2.0"
homepage = "https://github.com/aristocratos/btop"

[source]
repo = "aristocratos/btop"
url = "https://github.com/aristocratos/btop/archive/refs/tags/v1.4.6.tar.gz"
sha256 = "4beb90172c6acaac08c1b4a5112fb616772e214a7ef992bcbd461453295a58be"

[build]
steps = [
  "cmake -B builddir -DCMAKE_INSTALL_PREFIX=${PREFIX} -DCMAKE_BUILD_TYPE=Release",
  "cmake --build builddir -j ${JOBS}",
  "cmake --install builddir",
]

[build.linux-amd64]
toolchain = "llvm"

[build.linux-amd64.env]
LD_LIBRARY_PATH = "${DEP_LLVM}/lib"

[build.linux-arm64]
toolchain = "llvm"

[build.linux-arm64.env]
LD_LIBRARY_PATH = "${DEP_LLVM}/lib"

[dependencies]
build = ["cmake"]

[dependencies.linux-amd64]
build = ["cmake", "llvm"]

[dependencies.linux-arm64]
build = ["cmake", "llvm"]
