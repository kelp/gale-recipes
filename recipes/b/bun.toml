[package]
name = "bun"
version = "1.3.14"
revision = 1
description = "Fast JavaScript runtime, package manager, bundler"
license = "MIT"
homepage = "https://bun.sh"

[source]
repo = "oven-sh/bun"
url = "https://github.com/oven-sh/bun/archive/refs/tags/bun-v1.3.14.tar.gz"
sha256 = "112a5915992807f04b183854d360c2bf87ac7c1587fb5da3c560bdbb75b8c92e"

# Bun distributes prebuilt binaries. Building from source
# requires LLVM 21, patched Zig, and an existing bun binary.

[build.darwin-arm64]
steps = [
  "curl -sL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-darwin-aarch64.zip",
  "echo 'd8b96221828ad6f97ac7ac0ab7e95872341af763001e8803e8267652c2652620  /tmp/bun.zip' | shasum -a 256 -c",
  "unzip -o /tmp/bun.zip -d /tmp/bun-extract",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/bun-extract/bun-darwin-aarch64/bun ${PREFIX}/bin/",
]

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip",
  "echo '951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  /tmp/bun.zip' | shasum -a 256 -c",
  "unzip -o /tmp/bun.zip -d /tmp/bun-extract",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/bun-extract/bun-linux-x64/bun ${PREFIX}/bin/",
]

[build.linux-arm64]
steps = [
  "curl -sL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-aarch64.zip",
  "echo 'a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b  /tmp/bun.zip' | shasum -a 256 -c",
  "unzip -o /tmp/bun.zip -d /tmp/bun-extract",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/bun-extract/bun-linux-aarch64/bun ${PREFIX}/bin/",
]
