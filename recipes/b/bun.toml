[package]
name = "bun"
version = "1.3.11"
description = "Fast JavaScript runtime, package manager, bundler"
license = "MIT"
homepage = "https://bun.sh"

[source]
repo = "oven-sh/bun"
url = "https://github.com/oven-sh/bun/archive/refs/tags/bun-v1.3.11.tar.gz"
sha256 = "5dbe65a63f1225b18717159d7c4bedb6983fbc684a7b5848d3af801279f8ec6a"

# Bun distributes prebuilt binaries. Building from source
# requires LLVM 21, patched Zig, and an existing bun binary.

[build.darwin-arm64]
steps = [
  "curl -sL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.11/bun-darwin-aarch64.zip",
  "echo '6f5a3467ed9caec4795bf78cd476507d9f870c7d57b86c945fcb338126772ffc  /tmp/bun.zip' | shasum -a 256 -c",
  "unzip -o /tmp/bun.zip -d /tmp/bun-extract",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/bun-extract/bun-darwin-aarch64/bun ${PREFIX}/bin/",
]

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.11/bun-linux-x64.zip",
  "echo '8611ba935af886f05a6f38740a15160326c15e5d5d07adef966130b4493607ed  /tmp/bun.zip' | shasum -a 256 -c",
  "unzip -o /tmp/bun.zip -d /tmp/bun-extract",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/bun-extract/bun-linux-x64/bun ${PREFIX}/bin/",
]

[build.linux-arm64]
steps = [
  "curl -sL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.11/bun-linux-aarch64.zip",
  "echo 'd13944da12a53ecc74bf6a720bd1d04c4555c038dfe422365356a7be47691fdf  /tmp/bun.zip' | shasum -a 256 -c",
  "unzip -o /tmp/bun.zip -d /tmp/bun-extract",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/bun-extract/bun-linux-aarch64/bun ${PREFIX}/bin/",
]
