[package]
name = "bat"
version = "0.26.1"
revision = 4
description = "Clone of cat(1) with syntax highlighting and Git integration"
license = "Apache-2.0"
homepage = "https://github.com/sharkdp/bat"

[source]
repo = "sharkdp/bat"
url = "https://github.com/sharkdp/bat/archive/refs/tags/v0.26.1.tar.gz"
sha256 = "4474de87e084953eefc1120cf905a79f72bbbf85091e30cf37c9214eafcaa9c9"
released_at = "2025-12-02"

[build]
steps = [
  "cargo install --path . --root ${PREFIX}",
]

# libgit2 is vendored statically by libgit2-sys: with no farm
# libgit2 on PKG_CONFIG_PATH the crate builds its bundled copy,
# so the binary is self-contained (no @rpath/libgit2.dylib that
# dyld-aborts on darwin when run outside the install farm). See #92.
[dependencies]
build = ["pkgconf", "rust"]
runtime = ["oniguruma"]
