[package]
name = "expat"
version = "2.7.5"
description = "XML parser library written in C"
license = "MIT"
homepage = "https://libexpat.github.io/"

[source]
repo = "libexpat/libexpat"
url = "https://github.com/libexpat/libexpat/releases/download/R_2_7_5/expat-2.7.5.tar.gz"
sha256 = "9931f9860d18e6cf72d183eb8f309bfb96196c00e1d40caa978e95bc9aa978b6"

# Use autotools rather than cmake so we get both shared and
# static libraries. cmake builds shared only by default for
# this version and ignores EXPAT_BUILD_STATIC.
[build]
steps = [
  "./configure --prefix=${PREFIX} --disable-silent-rules",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = []
