[package]
name = "tio"
version = "3.9"
revision = 2
description = "Simple serial device I/O tool"
license = "GPL-2.0-or-later"
homepage = "https://tio.github.io"

[source]
repo = "tio/tio"
url = "https://github.com/tio/tio/releases/download/v3.9/tio-3.9.tar.xz"
sha256 = "06fe0c22e3e75274643c017928fbc85e86589bc1acd515d92f98eecd4bbab11b"
released_at = "2025-04-13"

[build]
steps = [
  "meson setup build --prefix=${PREFIX} --buildtype=release",
  "meson compile -C build -j ${JOBS}",
  "meson install -C build",
]

[dependencies]
build = ["meson", "ninja", "pkgconf"]
runtime = ["glib", "lua"]
