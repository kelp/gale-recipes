[package]
name = "tmux"
version = "3.6a"
revision = 3
description = "Terminal multiplexer"
license = "ISC"
homepage = "https://tmux.github.io/"

[source]
repo = "tmux/tmux"
url = "https://github.com/tmux/tmux/releases/download/3.6a/tmux-3.6a.tar.gz"
sha256 = "b6d8d9c76585db8ef5fa00d4931902fa4b8cbe8166f528f44fc403961a3f3759"

[build]
steps = [
  "./configure --prefix=${PREFIX} --disable-utf8proc",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["bison", "libevent", "ncurses", "pkgconf"]
runtime = ["libevent"]
