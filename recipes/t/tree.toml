[package]
name = "tree"
version = "2.3.2"
description = "Display directories as trees (with optional color/HTML output)"
license = "GPL-2.0-or-later"
homepage = "https://oldmanprogrammer.net/source.php?dir=projects/tree"

[source]
repo = "Old-Man-Programmer/tree"
url = "https://github.com/Old-Man-Programmer/tree/archive/refs/tags/2.3.2.tar.gz"
sha256 = "22cf32e84e3eb508d97a9e991c2c3cc006b9dcf4afed201d96311c5c57d08fcf"
released_at = "2026-03-16"

[dependencies]
build = ["gnumake"]

[build]
steps = [
  "make -j${JOBS}",
  "make install PREFIX=${PREFIX} MANDIR=${PREFIX}/share/man",
]
