[package]
name = "traceroute"
version = "2.1.6"
revision = 3
description = "Traces the route taken by packets over an IP network"
license = "GPL-2.0-only"
homepage = "https://traceroute.sourceforge.net/"
platforms = ["linux-amd64", "linux-arm64"]

[source]
url = "https://sourceforge.net/projects/traceroute/files/traceroute/traceroute-2.1.6/traceroute-2.1.6.tar.gz/download"
sha256 = "9ccef9cdb9d7a98ff7fbf93f79ebd0e48881664b525c4b232a0fcec7dcb9db5e"

[dependencies]
build = ["gnumake"]

# Upstream's Make.rules puts system link flags like -lm
# into LIBDEPS (prerequisites for the traceroute target),
# so modern make errors with "No rule to make target '-lm'".
# Filter -l* entries out of LIBDEPS before building — the
# actual link line still uses $(LIBS), so nothing is lost.
[build.linux-amd64]
steps = [
  "sed -i 's|LIBDEPS = $(filter-out -L%,$(LIBS))|LIBDEPS = $(filter-out -L% -l%,$(LIBS))|' Make.rules",
  "make -j${JOBS}",
  "make prefix=${PREFIX} install",
]

[build.linux-arm64]
steps = [
  "sed -i 's|LIBDEPS = $(filter-out -L%,$(LIBS))|LIBDEPS = $(filter-out -L% -l%,$(LIBS))|' Make.rules",
  "make -j${JOBS}",
  "make prefix=${PREFIX} install",
]
