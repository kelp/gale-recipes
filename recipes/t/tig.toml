[package]
name = "tig"
version = "2.6.0"
description = "Text interface for Git repositories"
license = "GPL-2.0-or-later"
homepage = "https://jonas.github.io/tig/"

[source]
repo = "jonas/tig"
url = "https://github.com/jonas/tig/releases/download/tig-2.6.0/tig-2.6.0.tar.gz"
sha256 = "99d4a0fdd3d93547ebacfe511195cb92e4f75b91644c06293c067f401addeb3e"

[build]
steps = [
  "./configure --prefix=${PREFIX} --without-pcre",
  "make -j${JOBS}",
  "make install",
  "make install-doc-man",
]
