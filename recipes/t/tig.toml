[package]
name = "tig"
version = "2.6.1"
revision = 2
description = "Text interface for Git repositories"
license = "GPL-2.0-or-later"
homepage = "https://jonas.github.io/tig/"

[source]
repo = "jonas/tig"
url = "https://github.com/jonas/tig/releases/download/tig-2.6.1/tig-2.6.1.tar.gz"
sha256 = "5adeabdcd93aa0423d618da8b878b53482bef6e0e9e1fe224acc0f18031fe91e"

[dependencies]
build = ["ncurses", "pkgconf"]

[build]
steps = [
  "./configure --prefix=${PREFIX} --without-pcre",
  "make -j${JOBS}",
  "make install",
  "make install-doc-man",
]
