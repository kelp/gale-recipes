[package]
name = "tmuxinator"
version = "3.4.0"
revision = 2
description = "Manage complex tmux sessions easily"
license = "MIT"
homepage = "https://github.com/tmuxinator/tmuxinator"

[source]
repo = "tmuxinator/tmuxinator"
url = "https://github.com/tmuxinator/tmuxinator/archive/refs/tags/v3.4.0.tar.gz"
sha256 = "ea043d727660d4a10e0e851c0f44128849ac420b9fba477dad2a436b6f568173"
released_at = "2026-05-23"

[build]
system = "ruby"
steps = [
  "gem build *.gemspec --force",
  "gem install --install-dir ${PREFIX}/lib/ruby/gems --bindir ${PREFIX}/bin --ignore-dependencies --force *.gem",
]

[dependencies]
build = ["ruby"]