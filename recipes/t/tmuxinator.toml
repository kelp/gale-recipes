[package]
name = "tmuxinator"
version = "3.4.1"
revision = 2
description = "Manage complex tmux sessions easily"
license = "MIT"
homepage = "https://github.com/tmuxinator/tmuxinator"

[source]
repo = "tmuxinator/tmuxinator"
url = "https://github.com/tmuxinator/tmuxinator/archive/refs/tags/v3.4.1.tar.gz"
sha256 = "090589171e15f92d00b544c4f7fd23cf042468d813204e25951ebf45f6057548"
released_at = "2026-07-03"

[build]
system = "ruby"
steps = [
  "gem build *.gemspec --force",
  "gem install --install-dir ${PREFIX}/lib/ruby/gems --bindir ${PREFIX}/bin --ignore-dependencies --force *.gem",
]

[dependencies]
build = ["ruby"]