[package]
name = "tmuxinator"
version = "3.3.8"
description = "Manage complex tmux sessions easily"
license = "MIT"
homepage = "https://github.com/tmuxinator/tmuxinator"

[source]
repo = "tmuxinator/tmuxinator"
url = "https://github.com/tmuxinator/tmuxinator/archive/refs/tags/v3.3.8.tar.gz"
sha256 = "1d2b8b888fb5dbc3ddae5d48a47c8a2287ef533b68475132c63e006f4a60eef1"
released_at = "2025-01-15"

[build]
system = "ruby"
steps = [
  "gem build *.gemspec --force",
  "gem install --install-dir ${PREFIX}/lib/ruby/gems --bindir ${PREFIX}/bin --ignore-dependencies --force *.gem",
]

[dependencies]
build = ["ruby"]