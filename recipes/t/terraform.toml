[package]
name = "terraform"
version = "1.15.6"
revision = 2
description = "Tool to build, change, and version infrastructure"
license = "MPL-2.0"
homepage = "https://www.terraform.io/"

[source]
repo = "hashicorp/terraform"
url = "https://github.com/hashicorp/terraform/archive/refs/tags/v1.15.6.tar.gz"
sha256 = "2020be1f7f90fde9ec226edabc76414f9a19f72b16f38e00dfa12af4c78c7ba8"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/terraform",
]

[dependencies]
build = ["go"]
