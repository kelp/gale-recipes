[package]
name = "terraform"
version = "1.15.5"
revision = 2
description = "Tool to build, change, and version infrastructure"
license = "MPL-2.0"
homepage = "https://www.terraform.io/"

[source]
repo = "hashicorp/terraform"
url = "https://github.com/hashicorp/terraform/archive/refs/tags/v1.15.5.tar.gz"
sha256 = "9a2e3fc546bac5f970c90810ea963a3066f8ab8b139b0e366943977196e4a701"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/terraform",
]

[dependencies]
build = ["go"]
