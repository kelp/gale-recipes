[package]
name = "terraform"
version = "1.15.8"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Tool to build, change, and version infrastructure"
license = "MPL-2.0"
homepage = "https://www.terraform.io/"

[source]
repo = "hashicorp/terraform"
url = "https://github.com/hashicorp/terraform/archive/refs/tags/v1.15.8.tar.gz"
sha256 = "7dcc43701dc10c2dfdd3704eb5c910337c858e2565417a7fe15430508938c2c0"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/terraform",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/terraform | grep -q 'statically linked'; fi",
]
