[package]
name = "cocoapods"
version = "1.17.0"
revision = 3
description = "The Cocoa Dependency Manager."
license = "MIT"
homepage = "https://cocoapods.org/"

[source]
repo = "CocoaPods/CocoaPods"
url = "https://github.com/CocoaPods/CocoaPods/archive/refs/tags/1.17.0.tar.gz"
sha256 = "1a3e63e815e61ad7661326d6e6ba2593328a596ceb94953d4388e3fe01e27f90"
released_at = "2026-07-06"

[dependencies]
build = ["ruby"]

[build]
system = "ruby"
steps = [
  "gem build *.gemspec --force",
  "gem install --install-dir ${PREFIX}/lib/ruby/gems --bindir ${PREFIX}/bin --ignore-dependencies --force *.gem",
]