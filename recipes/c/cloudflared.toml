[package]
name = "cloudflared"
version = "2026.6.1"
revision = 2
description = "Cloudflare Tunnel client"
license = "Apache-2.0"
homepage = "https://github.com/cloudflare/cloudflared"

[source]
repo = "cloudflare/cloudflared"
url = "https://github.com/cloudflare/cloudflared/archive/refs/tags/2026.6.1.tar.gz"
sha256 = "c3619a29cc529a5bc43ba99e1b298483ac0b8d8c412f69575c089a6bd4a7867d"
released_at = "2026-06-18"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -mod=vendor -ldflags \"-X main.Version=${VERSION}\" -o ${PREFIX}/bin/cloudflared ./cmd/cloudflared",
]

[dependencies]
build = ["go"]
