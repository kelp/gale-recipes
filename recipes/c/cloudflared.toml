[package]
name = "cloudflared"
version = "2026.5.2"
revision = 2
description = "Cloudflare Tunnel client"
license = "Apache-2.0"
homepage = "https://github.com/cloudflare/cloudflared"

[source]
repo = "cloudflare/cloudflared"
url = "https://github.com/cloudflare/cloudflared/archive/refs/tags/2026.5.2.tar.gz"
sha256 = "84a439b101b7fda1f5312640d5c2fe0cc37ae43e553e1ab2c71e3d0d9ce54b25"
released_at = "2026-05-27"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -mod=vendor -ldflags \"-X main.Version=${VERSION}\" -o ${PREFIX}/bin/cloudflared ./cmd/cloudflared",
]

[dependencies]
build = ["go"]
