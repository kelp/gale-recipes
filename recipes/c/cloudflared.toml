[package]
name = "cloudflared"
version = "2026.7.2"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Cloudflare Tunnel client"
license = "Apache-2.0"
homepage = "https://github.com/cloudflare/cloudflared"

[source]
repo = "cloudflare/cloudflared"
url = "https://github.com/cloudflare/cloudflared/archive/refs/tags/2026.7.2.tar.gz"
sha256 = "7c437dcf6c2b2efb25b93eaca4724f9be582d48fa97e020a11a177b36d14d606"
released_at = "2026-07-15"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -mod=vendor -ldflags \"-X main.Version=${VERSION}\" -o ${PREFIX}/bin/cloudflared ./cmd/cloudflared",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/cloudflared | grep -q 'statically linked'; fi",
]
