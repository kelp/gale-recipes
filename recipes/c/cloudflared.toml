[package]
name = "cloudflared"
version = "2026.6.0"
revision = 2
description = "Cloudflare Tunnel client"
license = "Apache-2.0"
homepage = "https://github.com/cloudflare/cloudflared"

[source]
repo = "cloudflare/cloudflared"
url = "https://github.com/cloudflare/cloudflared/archive/refs/tags/2026.6.0.tar.gz"
sha256 = "e79d48a3da4ab5ef9dd46c18730fc31e67c17934394ea7f1cbcf6f2c57e4d97f"
released_at = "2026-06-09"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -mod=vendor -ldflags \"-X main.Version=${VERSION}\" -o ${PREFIX}/bin/cloudflared ./cmd/cloudflared",
]

[dependencies]
build = ["go"]
