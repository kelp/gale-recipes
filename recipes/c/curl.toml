[package]
name = "curl"
version = "8.19.0"
description = "Get a file from an HTTP, HTTPS or FTP server"
license = "curl"
homepage = "https://curl.se"

[source]
repo = "curl/curl"
url = "https://curl.se/download/curl-8.19.0.tar.bz2"
sha256 = "eba3230c1b659211a7afa0fbf475978cbf99c412e4d72d9aa92d020c460742d4"
released_at = "2026-03-11"

[build]
steps = [
  "./configure --prefix=${PREFIX} --with-openssl --with-zstd --with-libidn2 --without-libpsl --without-libssh2 --without-nghttp2 --without-nghttp3 --without-ngtcp2 --without-brotli --without-ca-bundle --without-ca-path --with-ca-fallback --with-default-ssl-backend=openssl --disable-silent-rules",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["pkgconf"]
runtime = ["openssl", "zstd", "libidn2"]
