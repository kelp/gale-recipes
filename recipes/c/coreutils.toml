[package]
name = "coreutils"
version = "9.11"
revision = 3
description = "GNU File, Shell, and Text utilities"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/coreutils/"

[source]
repo = "coreutils/coreutils"
url = "https://ftpmirror.gnu.org/gnu/coreutils/coreutils-9.11.tar.xz"
sha256 = "394024eda0a5955217ceda9cd1201e65dc8fa3aa29c2951135a49521d57c3cc3"
released_at = "2026-04-20"

[build.darwin-arm64]
steps = [
  "./configure --prefix=${PREFIX} --program-prefix=g --with-gmp",
  "make -j${JOBS}",
  "make install",
]

[build.linux-amd64]
steps = [
  "./configure --prefix=${PREFIX} --with-gmp --without-selinux",
  "make -j${JOBS}",
  "make install",
]

[build.linux-arm64]
steps = [
  "./configure --prefix=${PREFIX} --with-gmp --without-selinux",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
runtime = ["gmp"]
