[package]
name = "ccache"
version = "4.13.6"
revision = 2
description = "Compiler cache for fast recompilation of C/C++ code"
license = "GPL-3.0-or-later"
homepage = "https://ccache.dev/"

[source]
repo = "ccache/ccache"
url = "https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6.tar.xz"
sha256 = "a7de667ca08cf67c3c8af9f213f6aa701a1188a2b3163fb74483858ce5e79fbb"

[build]
steps = [
  "cmake -S . -B build -DCMAKE_INSTALL_PREFIX=${PREFIX} -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=OFF -DREDIS_STORAGE_BACKEND=OFF",
  "cmake --build build -j ${JOBS}",
  "cmake --install build",
]

[dependencies]
build = ["cmake"]
