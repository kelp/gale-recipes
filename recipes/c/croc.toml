[package]
name = "croc"
version = "10.4.4"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Easily and securely send things from one computer to another :crocodile: :package:"
license = "MIT"
homepage = "https://schollz.com/software/croc6"

[source]
repo = "schollz/croc"
url = "https://github.com/schollz/croc/archive/refs/tags/v10.4.4.tar.gz"
sha256 = "33e9160829705942178a017ce055196c4a66c9ef5cdfe8029e840be835e756d4"
released_at = "2026-05-20"

[build]
system = "go"
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/croc .",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/croc | grep -q 'statically linked'; fi",
]
