# Generated from Homebrew formula (BSD-2-Clause)

[package]
name = "chezmoi"
version = "2.70.4"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Manage your dotfiles across multiple diverse machines, securely"
license = "MIT"
homepage = "https://chezmoi.io/"

[source]
repo = "twpayne/chezmoi"
url = "https://github.com/twpayne/chezmoi/releases/download/v2.70.4/chezmoi-2.70.4.tar.gz"
sha256 = "a70137b51f83a894d113b64d67095ca8d5609cbe783b9ea9fb72fb77b80bff4b"
released_at = "2026-05-19"

[dependencies]
build = ["go"]

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -ldflags \"-s -w -X main.version=v2.70.0 -X main.builtBy=gale\" -o ${PREFIX}/bin/chezmoi .",
]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/chezmoi | grep -q 'statically linked'; fi",
]
