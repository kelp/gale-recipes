[package]
name = "cmake"
version = "4.3.3"
revision = 2
description = "Cross-platform build system generator"
license = "BSD-3-Clause"
homepage = "https://cmake.org"

[source]
repo = "Kitware/CMake"
url = "https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3.tar.gz"
sha256 = "cba4bb7a44edf2877bb6f059932896383babe435b3a8c3b5df48b4aa41c9bb85"

[build]
steps = [
  "./bootstrap --prefix=${PREFIX} --parallel=${JOBS} -- -DCMAKE_USE_OPENSSL=ON",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["openssl"]
runtime = ["openssl"]
