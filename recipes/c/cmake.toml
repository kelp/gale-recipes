[package]
name = "cmake"
version = "4.3.2"
revision = 2
description = "Cross-platform build system generator"
license = "BSD-3-Clause"
homepage = "https://cmake.org"

[source]
repo = "Kitware/CMake"
url = "https://github.com/Kitware/CMake/releases/download/v4.3.2/cmake-4.3.2.tar.gz"
sha256 = "b0231eb39b3c3cabdc568c619df78208a7bd95ea10c9b2236d61218bac1b367d"

[build]
steps = [
  "./bootstrap --prefix=${PREFIX} --parallel=${JOBS} -- -DCMAKE_USE_OPENSSL=ON",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["openssl"]
runtime = ["openssl"]
