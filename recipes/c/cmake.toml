[package]
name = "cmake"
version = "4.4.2"
revision = 2
description = "Cross-platform build system generator"
license = "BSD-3-Clause"
homepage = "https://cmake.org"

[source]
repo = "Kitware/CMake"
url = "https://github.com/Kitware/CMake/releases/download/v4.4.2/cmake-4.4.2.tar.gz"
sha256 = "1db9e61e60b6e0874c86386340b910382f3c5e75b9fbfb44d122063129a2789d"

[build]
steps = [
  "./bootstrap --prefix=${PREFIX} --parallel=${JOBS} -- -DCMAKE_USE_OPENSSL=ON",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["openssl"]
runtime = ["openssl"]
