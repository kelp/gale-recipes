[package]
name = "cmake"
version = "4.3.1"
description = "Cross-platform build system generator"
license = "BSD-3-Clause"
homepage = "https://cmake.org"

[source]
repo = "Kitware/CMake"
url = "https://github.com/Kitware/CMake/releases/download/v4.3.1/cmake-4.3.1.tar.gz"
sha256 = "0798f4be7a1a406a419ac32db90c2956936fecbf50db3057d7af47d69a2d7edb"

[build]
steps = [
  "./bootstrap --prefix=${PREFIX} --parallel=${JOBS} -- -DCMAKE_USE_OPENSSL=ON",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = ["openssl"]
runtime = ["openssl"]
