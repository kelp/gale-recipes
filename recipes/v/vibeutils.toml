[package]
name = "vibeutils"
version = "0.10.0"
revision = 1
description = "Modern Unix coreutils in Zig — git-aware ls, colored output, Nerd Font icons"
license = "MIT"
homepage = "https://github.com/kelp/vibeutils"

[source]
repo = "kelp/vibeutils"
url = "https://github.com/kelp/vibeutils/archive/refs/tags/v0.10.0.tar.gz"
sha256 = "d62566f71772dfdca568c525ccff729aa857085410200e2025a2c1469ef95e80"

[build]
# -Dcpu=baseline targets the LLVM x86_64 / aarch64 baseline so the
# binary runs on any chip in the architecture family. The default
# (native) targets the build host's CPU and SIGILLs on machines
# missing instructions the CI runner happens to support.
steps = [
  "zig build -Doptimize=ReleaseSafe -Dstrip=true -Dcpu=baseline --prefix ${PREFIX}",
]

[dependencies]
# vibeutils' build.zig.zon now pins minimum_zig_version = 0.16.0.
build = ["zig"]
runtime = ["mandoc"]
