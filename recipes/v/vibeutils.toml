[package]
name = "vibeutils"
version = "0.8.2"
description = "Modern Unix coreutils in Zig — git-aware ls, colored output, Nerd Font icons"
license = "MIT"
homepage = "https://github.com/kelp/vibeutils"

[source]
repo = "kelp/vibeutils"
url = "https://github.com/kelp/vibeutils/archive/refs/tags/v0.8.2.tar.gz"
sha256 = "017c06526052b455613eb49abbd6224eb6810045b9f02fcf71365018d50173d8"

[build]
steps = [
  "zig build -Doptimize=ReleaseSafe -Dstrip=true --prefix ${PREFIX}",
]

[dependencies]
build = ["zig"]
