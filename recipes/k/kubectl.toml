[package]
name = "kubectl"
version = "1.35.3"
description = "Kubernetes command-line interface"
license = "Apache-2.0"
homepage = "https://kubernetes.io/docs/reference/kubectl/"

[source]
repo = "kubernetes/kubernetes"
url = "https://github.com/kubernetes/kubernetes/archive/refs/tags/v1.35.3.tar.gz"
sha256 = "4374809bf135137568135384209f160acdab7372f2608fa60ca3513782db4f03"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/kubectl ./cmd/kubectl",
]

[dependencies]
build = ["go"]
