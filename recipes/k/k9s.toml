[package]
name = "k9s"
version = "0.51.0"
revision = 2
description = "Kubernetes CLI To Manage Your Clusters In Style!"
license = "Apache-2.0"
homepage = "https://k9scli.io/"

[source]
repo = "derailed/k9s"
url = "https://github.com/derailed/k9s/archive/refs/tags/v0.51.0.tar.gz"
sha256 = "e2c3851c909b87f9cfafa262e426f4a89023ca4e745cba5cab6d0153f76e7dcd"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/k9s",
]

[dependencies]
build = ["go"]
