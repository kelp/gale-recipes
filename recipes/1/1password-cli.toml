[package]
name = "1password-cli"
version = "2.33.1"
description = "Command-line interface for 1Password"
license = "Proprietary"
homepage = "https://developer.1password.com/docs/cli"

[source]
url = "https://cache.agilebits.com/dist/1P/op2/pkg/v2.33.1/op_darwin_arm64_v2.33.1.zip"
sha256 = "8106127624bf55f0bf5ae6f8e2c56398e01db75d64c3088eface33885c854351"

# 1Password CLI is proprietary. No source is available.
# These build steps install the official prebuilt binary.

[build.darwin-arm64]
steps = [
  "curl -sL -o /tmp/op.zip https://cache.agilebits.com/dist/1P/op2/pkg/v${VERSION}/op_darwin_arm64_v${VERSION}.zip",
  "echo '8106127624bf55f0bf5ae6f8e2c56398e01db75d64c3088eface33885c854351  /tmp/op.zip' | shasum -a 256 -c",
  "unzip -o /tmp/op.zip -d /tmp/op-extract",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/op-extract/op ${PREFIX}/bin/",
]

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/op.zip https://cache.agilebits.com/dist/1P/op2/pkg/v${VERSION}/op_linux_amd64_v${VERSION}.zip",
  "echo '0fc50cb22d791b5ee5e1421d97e96595fd61ca56ae92271bd1b28bb884971726  /tmp/op.zip' | shasum -a 256 -c",
  "unzip -o /tmp/op.zip -d /tmp/op-extract",
  "mkdir -p ${PREFIX}/bin",
  "cp /tmp/op-extract/op ${PREFIX}/bin/",
]
