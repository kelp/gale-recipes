[package]
name = "ncurses"
version = "6.4"
description = "ncurses (new curses) library - a free software emulation of curses in System V Release 4.0"
license = "X11"
homepage = "https://www.gnu.org/software/ncurses/"

[source]
repo = "mirror/ncurses"
url = "https://github.com/mirror/ncurses/archive/refs/tags/v6.4.tar.gz"
sha256 = "39893846139518e6c2d00ac1d354d4889f0f394acd44885d70b14eaef4e23e8e"
released_at = "2025-01-15"

[build]
system = "autotools"
steps = [
  "./configure --prefix=${PREFIX} --enable-shared --enable-static --with-normal --without-debug --without-ada --enable-widec --enable-pc-files --with-pkg-config-libdir=${PREFIX}/lib/pkgconfig",
  "make -j${JOBS}",
  "make install",
  "ln -sf ncursesw ${PREFIX}/include/ncurses",
  "for lib in ncurses form panel menu; do for f in ${PREFIX}/lib/lib${lib}w*; do ln -sf $(basename $f) ${PREFIX}/lib/$(basename $f | sed s/w//); done; done",
  "cd ${PREFIX}/include && for f in ncursesw/*.h; do ln -sf \"$f\" \"$(basename $f)\"; done",
]