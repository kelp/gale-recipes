[package]
name = "neovim"
version = "0.12.2"
revision = 4
description = "Ambitious Vim-fork focused on extensibility and agility"
license = "Apache-2.0"
homepage = "https://neovim.io/"

[source]
repo = "neovim/neovim"
url = "https://github.com/neovim/neovim/archive/refs/tags/v0.12.2.tar.gz"
sha256 = "ef9f58da7d687ed4d1dad9715542bf0dabdeedbfe8089e2ce17fff21b920a268"

# Neovim bundles all its deps (luajit, libuv, luv, lpeg,
# unibilium, utf8proc, tree-sitter) via USE_BUNDLED=ON.
# Only cmake (build) and gettext (runtime, for libintl
# on macOS) are needed externally.
#
# The build has two phases:
# 1. cmake.deps: downloads and builds bundled deps
# 2. build: compiles neovim against bundled deps
#
# Network access is required during phase 1 to download
# dependency sources.
#
# -DCACHE_PRG=CACHE_PRG-NOTFOUND short-circuits the
# find_program() in cmake/Deps.cmake that auto-wires
# ccache/sccache as CMAKE_C_COMPILER_LAUNCHER. Both phases
# include() Deps.cmake (cmake.deps directly, and the main
# CMakeLists.txt at line 32), so the flag must be passed to
# both cmake invocations — phase 1 forwards the launcher
# into the ExternalProject sub-builds for libuv/unibilium,
# phase 2 uses it for the main src/nvim build. Once gale
# started symlinking sccache into the build sandbox (v0.15+),
# the chained launcher (`cmake -E env ... sccache cc`)
# failed with bare "no such file or directory" inside the
# sub-makes. Pre-populating the cache with a *-NOTFOUND
# sentinel makes find_program a no-op and the if(CACHE_PRG)
# branch false-y, restoring the pre-v0.15 plain-compiler path.

[build]
steps = [
  "cmake -S cmake.deps -B .deps -DUSE_BUNDLED=ON -DCMAKE_BUILD_TYPE=Release -DCACHE_PRG=CACHE_PRG-NOTFOUND",
  "cmake --build .deps -j ${JOBS}",
  "DEP_RPATH=$(echo $LIBRARY_PATH | tr ':' ';') && cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${PREFIX} -DCACHE_PRG=CACHE_PRG-NOTFOUND \"-DCMAKE_BUILD_RPATH=${DEP_RPATH}\" \"-DCMAKE_INSTALL_RPATH=${DEP_RPATH}\"",
  "cmake --build build -j ${JOBS}",
  "cmake --install build",
]

[dependencies]
build = ["cmake"]
runtime = ["gettext"]
