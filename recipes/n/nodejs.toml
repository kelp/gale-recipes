[package]
name = "nodejs"
version = "26.1.0"
revision = 2
description = "Open-source, cross-platform JavaScript runtime environment"
license = "MIT"
homepage = "https://nodejs.org/"

[source]
repo = "nodejs/node"
url = "https://nodejs.org/dist/v26.1.0/node-v26.1.0.tar.xz"
sha256 = "779a1364889575d44e0215adc381806bbd0d9437557b59893e172f5b9d35a990"

[build]
steps = [
  "./configure --prefix=${PREFIX}",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = []
