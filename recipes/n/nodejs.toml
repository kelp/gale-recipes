[package]
name = "nodejs"
version = "25.8.2"
description = "Open-source, cross-platform JavaScript runtime environment"
license = "MIT"
homepage = "https://nodejs.org/"

[source]
repo = "nodejs/node"
url = "https://nodejs.org/dist/v25.8.2/node-v25.8.2.tar.xz"
sha256 = "3efb19e757dc59bb21632507200d2de782369d5226a68955e9372c925fdf2471"

[build]
steps = [
  "./configure --prefix=${PREFIX}",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = []
