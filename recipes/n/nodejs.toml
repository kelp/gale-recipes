[package]
name = "nodejs"
version = "26.5.0"
revision = 2
description = "Open-source, cross-platform JavaScript runtime environment"
license = "MIT"
homepage = "https://nodejs.org/"

[source]
repo = "nodejs/node"
url = "https://nodejs.org/dist/v26.5.0/node-v26.5.0.tar.xz"
sha256 = "0e179470097e247a0c0769b77cc1359fc3e1baf0686df89bafe1fb48cb1887f4"

[build]
steps = [
  "./configure --prefix=${PREFIX}",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = []
