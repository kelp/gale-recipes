[package]
name = "nodejs"
version = "26.7.0"
revision = 2
description = "Open-source, cross-platform JavaScript runtime environment"
license = "MIT"
homepage = "https://nodejs.org/"

[source]
repo = "nodejs/node"
url = "https://nodejs.org/dist/v26.7.0/node-v26.7.0.tar.xz"
sha256 = "e6b182cbeeab032d1082ca4ac4fe15e3a57de691d3bde78ecf8a761fd56ee356"

[build]
steps = [
  "./configure --prefix=${PREFIX}",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = []
