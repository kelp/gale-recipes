[package]
name = "age"
version = "1.3.1"
revision = 2
description = "Simple, modern, secure file encryption"
license = "BSD-3-Clause"
homepage = "https://github.com/FiloSottile/age"

[source]
repo = "FiloSottile/age"
url = "https://github.com/FiloSottile/age/archive/refs/tags/v1.3.1.tar.gz"
sha256 = "396007bc0bc53de253391493bda1252757ba63af1a19db86cfb60a35cb9d290a"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "go build -o ${PREFIX}/bin/age ./cmd/age",
  "go build -o ${PREFIX}/bin/age-keygen ./cmd/age-keygen",
]

[dependencies]
build = ["go"]
