[package]
name = "age"
version = "1.3.1"
# rev 3: CGO_ENABLED=0 static rebuild — the default-cgo
# build linked the CI runner's glibc (see gale-recipes#189)
revision = 3
description = "Simple, modern, secure file encryption"
license = "BSD-3-Clause"
homepage = "https://github.com/FiloSottile/age"

[source]
repo = "FiloSottile/age"
url = "https://github.com/FiloSottile/age/archive/refs/tags/v1.3.1.tar.gz"
sha256 = "396007bc0bc53de253391493bda1252757ba63af1a19db86cfb60a35cb9d290a"

[build]
steps = [
  "mkdir -p ${PREFIX}/bin",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/age ./cmd/age",
  "CGO_ENABLED=0 go build -o ${PREFIX}/bin/age-keygen ./cmd/age-keygen",
]

[dependencies]
build = ["go"]

# Runtime probes pass on the build host even for a
# dynamically linked binary (same libc) — only a
# build-product property check catches a dropped
# CGO_ENABLED=0. See recipes/g/gh.toml.
[smoke]
commands = [
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/age | grep -q 'statically linked'; fi",
  "if [ \"$OS\" = linux ]; then file ${PREFIX}/bin/age-keygen | grep -q 'statically linked'; fi",
]
