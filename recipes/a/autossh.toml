[package]
name = "autossh"
version = "1.4g"
description = "Automatically restart SSH sessions and tunnels"
license = "BSD-1-Clause"
homepage = "https://www.harding.motd.ca/autossh/"

[source]
url = "https://www.harding.motd.ca/autossh/autossh-1.4g.tgz"
sha256 = "5fc3cee3361ca1615af862364c480593171d0c54ec156de79fc421e31ae21277"

[build]
# --mandir redirects the man page out of the upstream default
# (${PREFIX}/man) into the FHS-standard ${PREFIX}/share/man,
# matching every other recipe in this repo.
steps = [
  "./configure --prefix=${PREFIX} --mandir=${PREFIX}/share/man",
  "make -j${JOBS}",
  "make install",
]

[dependencies]
build = []

[smoke]
commands = [
  "${PREFIX}/bin/autossh -V",
]
