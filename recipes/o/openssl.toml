[package]
name = "openssl"
version = "3.6.1"
revision = 3
description = "Cryptography and SSL/TLS Toolkit"
license = "Apache-2.0"
homepage = "https://openssl-library.org"

[source]
repo = "openssl/openssl"
url = "https://github.com/openssl/openssl/releases/download/openssl-3.6.1/openssl-3.6.1.tar.gz"
sha256 = "b1bfedcd5b289ff22aee87c9d600f515767ebf45f77168cb6d64f231f518a82e"

[build.darwin-arm64]
steps = [
  "perl ./Configure --prefix=${PREFIX} --openssldir=${PREFIX}/etc/openssl --libdir=lib no-ssl3 no-ssl3-method no-zlib enable-ec_nistp_64_gcc_128 darwin64-arm64-cc",
  "make -j${JOBS}",
  "make install MANDIR=${PREFIX}/share/man MANSUFFIX=ssl",
  # The provider/engine modules in lib/ossl-modules and
  # lib/engines-3 link against @rpath/libcrypto.3.dylib, but
  # `make install` adds no rpath on them resolving back to
  # ${PREFIX}/lib. Without it dyld aborts loading the module
  # (check_install.py flags the unresolvable @rpath). From
  # either subdir, @loader_path/.. is lib/, where
  # libcrypto.3.dylib lives. Darwin-only; linux builds clean.
  # Mirrors the same fix in openssl4.toml.
  "for m in ${PREFIX}/lib/ossl-modules/*.dylib ${PREFIX}/lib/engines-3/*.dylib; do install_name_tool -add_rpath @loader_path/.. \"$m\" 2>/dev/null || true; done",
]

[build.linux-amd64]
steps = [
  "perl ./Configure --prefix=${PREFIX} --openssldir=${PREFIX}/etc/openssl --libdir=lib no-ssl3 no-ssl3-method no-zlib linux-x86_64",
  "make -j${JOBS}",
  "make install MANDIR=${PREFIX}/share/man MANSUFFIX=ssl",
]

[build.linux-arm64]
steps = [
  "perl ./Configure --prefix=${PREFIX} --openssldir=${PREFIX}/etc/openssl --libdir=lib no-ssl3 no-ssl3-method no-zlib linux-aarch64",
  "make -j${JOBS}",
  "make install MANDIR=${PREFIX}/share/man MANSUFFIX=ssl",
]
