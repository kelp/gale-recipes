[package]
name = "openssl"
version = "3.6.1"
description = "Cryptography and SSL/TLS Toolkit"
license = "Apache-2.0"
homepage = "https://openssl-library.org"

[source]
repo = "openssl/openssl"
url = "https://github.com/openssl/openssl/releases/download/openssl-3.6.1/openssl-3.6.1.tar.gz"
sha256 = "b1bfedcd5b289ff22aee87c9d600f515767ebf45f77168cb6d64f231f518a82e"

[build.darwin-arm64]
steps = [
  "perl ./Configure --prefix=${PREFIX} --openssldir=${PREFIX}/etc/openssl --libdir=lib no-ssl3 no-ssl3-method no-zlib enable-ec_nistp_64_gcc_128 darwin64-arm64-cc",
  "make -j${JOBS}",
  "make install MANDIR=${PREFIX}/share/man MANSUFFIX=ssl",
]

[build.linux-amd64]
steps = [
  "perl ./Configure --prefix=${PREFIX} --openssldir=${PREFIX}/etc/openssl --libdir=lib no-ssl3 no-ssl3-method no-zlib linux-x86_64",
  "make -j${JOBS}",
  "make install MANDIR=${PREFIX}/share/man MANSUFFIX=ssl",
]

[binary.darwin-arm64]
url = "https://ghcr.io/v2/kelp/gale-recipes/openssl/blobs/sha256:d0cd90d1e9ed6ee6296efdd6da8149a2eb13ee41bfa8974463e4447a61afa55a"
sha256 = "d0cd90d1e9ed6ee6296efdd6da8149a2eb13ee41bfa8974463e4447a61afa55a"

[binary.linux-amd64]
url = "https://ghcr.io/v2/kelp/gale-recipes/openssl/blobs/sha256:32495a6a0098637b04545fe2768f0c740585538e790cc37abddfb9b30836eb09"
