[package]
name = "openssl"
version = "3.6.2"
revision = 1
description = "Cryptography and SSL/TLS Toolkit"
license = "Apache-2.0"
homepage = "https://openssl-library.org"

[source]
repo = "openssl/openssl"
url = "https://github.com/openssl/openssl/releases/download/openssl-3.6.2/openssl-3.6.2.tar.gz"
sha256 = "aaf51a1fe064384f811daeaeb4ec4dce7340ec8bd893027eee676af31e83a04f"

[build.darwin-arm64]
steps = [
  "perl ./Configure --prefix=${PREFIX} --openssldir=${PREFIX}/etc/openssl --libdir=lib no-ssl3 no-ssl3-method no-zlib enable-ec_nistp_64_gcc_128 darwin64-arm64-cc",
  "make -j${JOBS}",
  "make install MANDIR=${PREFIX}/share/man MANSUFFIX=ssl",
  # openssl 3.6.2's `make install` bakes @rpath/libcrypto.3.dylib
  # install names with no resolving LC_RPATH. Unlike 4.0.0 (whose
  # absolute install names gale rewrites + rpaths automatically),
  # 3.x already emits @rpath, so gale finds nothing to rewrite and
  # adds no rpath — dyld then aborts and check_install.py rejects
  # the unresolvable @rpath. Bake the resolving rpaths at build
  # time (verifiable; gale re-signs every Mach-O afterward).
  # Darwin-only; linux builds clean.
  #   bin/openssl -> @executable_path/../lib (finds lib/libcrypto)
  #   lib/*.dylib (libssl) -> @loader_path (sibling libcrypto)
  #   lib/ossl-modules,engines-3 modules -> @loader_path/.. = lib/
  "for b in ${PREFIX}/bin/*; do [ -f \"$b\" ] || continue; install_name_tool -add_rpath @executable_path/../lib \"$b\" 2>/dev/null || true; done",
  "for d in ${PREFIX}/lib/*.dylib; do [ -f \"$d\" ] || continue; install_name_tool -add_rpath @loader_path \"$d\" 2>/dev/null || true; done",
  "for m in ${PREFIX}/lib/ossl-modules/*.dylib ${PREFIX}/lib/engines-3/*.dylib; do [ -e \"$m\" ] || continue; install_name_tool -add_rpath @loader_path/.. \"$m\" 2>/dev/null || true; done",
]

[build.linux-amd64]
steps = [
  "perl ./Configure --prefix=${PREFIX} --openssldir=${PREFIX}/etc/openssl --libdir=lib no-ssl3 no-ssl3-method no-zlib linux-x86_64",
  "make -j${JOBS}",
  "make install MANDIR=${PREFIX}/share/man MANSUFFIX=ssl",
]

[build.linux-arm64]
steps = [
  "perl ./Configure --prefix=${PREFIX} --openssldir=${PREFIX}/etc/openssl --libdir=lib no-ssl3 no-ssl3-method no-zlib linux-aarch64",
  "make -j${JOBS}",
  "make install MANDIR=${PREFIX}/share/man MANSUFFIX=ssl",
]
