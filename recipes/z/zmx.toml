[package]
name = "zmx"
version = "0.4.2"
description = "Session persistence for terminal processes"
license = "MIT"
homepage = "https://zmx.sh"

[source]
repo = "neurosnap/zmx"
url = "https://github.com/neurosnap/zmx/archive/refs/tags/v0.4.2.tar.gz"
sha256 = "706129c6e6f16088a6b33641ddb4de4c1835374886e2566ada113b84c59e0745"
released_at = "2026-03-19"

[build]
system = "zig"
steps = [
  "zig build -Doptimize=ReleaseSafe --prefix ${PREFIX}",
]

[dependencies]
build = ["zig"]