[package]
name = "zmx"
version = "0.6.0"
description = "Session persistence for terminal processes"
license = "MIT"
homepage = "https://zmx.sh"

[source]
repo = "neurosnap/zmx"
url = "https://github.com/neurosnap/zmx/archive/refs/tags/v0.6.0.tar.gz"
sha256 = "4b5a155a0956abb812ab52fb5d65e63cc1d745eee566ea7fd8930393284d4673"
released_at = "2026-05-17"

[build]
system = "zig"
steps = [
  "zig build -Doptimize=ReleaseSafe --prefix ${PREFIX}",
]

[dependencies]
build = ["zig"]