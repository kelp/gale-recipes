[package]
name = "zmx"
version = "0.7.0"
revision = 2
description = "Session persistence for terminal processes"
license = "MIT"
homepage = "https://zmx.sh"

[source]
repo = "neurosnap/zmx"
url = "https://github.com/neurosnap/zmx/archive/refs/tags/v0.7.0.tar.gz"
sha256 = "f278cbff940bc2d3fcaa3b2f023c4ab43bd6500f2791254d25a421ac006e7beb"
released_at = "2026-07-23"

[build]
system = "zig"
steps = [
  "zig build -Doptimize=ReleaseSafe -Dcpu=baseline --prefix ${PREFIX}",
]

[dependencies]
build = ["zig15"]