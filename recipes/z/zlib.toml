[package]
name = "zlib"
version = "1.3.2"
revision = 2
description = "A massively spiffy yet delicately unobtrusive compression library."
license = "NOASSERTION"
homepage = "http://zlib.net/"

[source]
repo = "madler/zlib"
url = "https://github.com/madler/zlib/archive/refs/tags/v1.3.2.tar.gz"
sha256 = "b99a0b86c0ba9360ec7e78c4f1e43b1cbdf1e6936c8fa0f6835c0cd694a495a1"
released_at = "2025-01-15"

[build]
system = "cmake"
steps = [
  "cmake -B build -DCMAKE_INSTALL_PREFIX=${PREFIX} -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DZLIB_BUILD_SHARED=OFF -DZLIB_BUILD_STATIC=ON",
  "cmake --build build -j${JOBS}",
  "cmake --install build",
]

[dependencies]
build = ["cmake"]