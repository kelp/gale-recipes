[package]
name = "zig"
version = "0.15.1"
revision = 1
description = "General-purpose programming language and toolchain"
license = "MIT"
homepage = "https://ziglang.org"

[source]
repo = "ziglang/zig"
url = "https://ziglang.org/download/0.15.1/zig-0.15.1.tar.xz"
sha256 = "816c0303ab313f59766ce2097658c9fff7fafd1504f61f80f9507cd11652865f"

# Zig distributes prebuilt, statically-linked binaries.
# Building from source requires an existing zig + LLVM.
# These build steps install the official prebuilt binary.

[build.darwin-arm64]
steps = [
  "curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz",
  "echo 'b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  /tmp/zig.tar.xz' | shasum -a 256 -c",
  "mkdir -p /tmp/zig-extract && tar -xJf /tmp/zig.tar.xz -C /tmp/zig-extract --strip-components=1",
  "mkdir -p ${PREFIX}/bin ${PREFIX}/lib",
  "cp /tmp/zig-extract/zig ${PREFIX}/bin/",
  "cp -r /tmp/zig-extract/lib ${PREFIX}/lib/zig",
]

[build.linux-amd64]
steps = [
  "curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz",
  "echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz' | shasum -a 256 -c",
  "mkdir -p /tmp/zig-extract && tar -xJf /tmp/zig.tar.xz -C /tmp/zig-extract --strip-components=1",
  "mkdir -p ${PREFIX}/bin ${PREFIX}/lib",
  "cp /tmp/zig-extract/zig ${PREFIX}/bin/",
  "cp -r /tmp/zig-extract/lib ${PREFIX}/lib/zig",
]

[build.linux-arm64]
steps = [
  "curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz",
  "echo 'ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17  /tmp/zig.tar.xz' | shasum -a 256 -c",
  "mkdir -p /tmp/zig-extract && tar -xJf /tmp/zig.tar.xz -C /tmp/zig-extract --strip-components=1",
  "mkdir -p ${PREFIX}/bin ${PREFIX}/lib",
  "cp /tmp/zig-extract/zig ${PREFIX}/bin/",
  "cp -r /tmp/zig-extract/lib ${PREFIX}/lib/zig",
]
