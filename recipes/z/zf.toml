[package]
name = "zf"
version = "0.10.2"
description = "a commandline fuzzy finder and zig module designed for filtering filepaths"
license = "MIT"
homepage = "https://github.com/natecraddock/zf"

[source]
repo = "natecraddock/zf"
url = "https://github.com/natecraddock/zf/archive/refs/tags/0.10.2.tar.gz"
sha256 = "b8e41f942c7033536fd64f9edea467a7ff4f45d52885d585f0adafb7803ac0ed"
released_at = "2025-01-15"

[build]
system = "zig"
steps = [
  "zig build -Doptimize=ReleaseSafe --prefix ${PREFIX}",
]

[dependencies]
build = ["zig"]