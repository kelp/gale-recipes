name: Auto-Update Recipes

# Daily check against upstream GitHub releases for every
# recipe. Writes _data/upstream.json for the dashboard, and
# opens a PR for any recipe past the 7-day cooldown.

on:
  schedule:
    # Off-peak, non-round minute to avoid top-of-hour API
    # traffic spikes. 09:17 UTC.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe name (blank = all)'
        required: false

# GITHUB_TOKEN scope. Branch pushes and PR creation use the
# gale-recipes-automation App token instead (minted below):
# App-authored PRs fire pull_request natively, so verify and
# ledger-check run as normal PR checks without the manual
# "Approve workflow to run" click GitHub requires for
# github-actions[bot] PRs (policy change 2026-06). contents
# stays for the dashboard-data GraphQL commit, which
# deliberately remains GITHUB_TOKEN-authored so it never
# re-triggers workflows.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Startup jitter
        # Cheap insurance against all scheduled workflows
        # starting at the same sub-minute offset. Only
        # jitters on the scheduled run, not manual dispatch.
        if: ${{ github.event_name == 'schedule' }}
        run: sleep $((RANDOM % 60))

      # upstream.json is the persistent first-observation clock
      # (timestamps, sha256, commit SHA for the cooldown and
      # tamper gates). It lives on the dashboard-data branch, not
      # main, so the daily commit never trips main's required
      # ledger-check. Overlay the prior copy into the working tree
      # so auto-update.sh reads the correct prior state; the main
      # checkout's tracked copy is only a seed/fallback.
      - name: Seed prior upstream.json from dashboard-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _data
          if git fetch origin dashboard-data 2>/dev/null; then
            git show origin/dashboard-data:_data/upstream.json \
              > _data/upstream.json 2>/dev/null \
              && echo "seeded prior state from dashboard-data" \
              || echo "dashboard-data has no upstream.json yet; using main seed"
          else
            echo "dashboard-data branch absent; using main seed"
          fi

      # Installation token for the gale-recipes-automation App
      # (Contents + Pull requests + Issues, this repo only).
      # The script's branch commits and PRs are App-authored so
      # their pull_request events fire unheld; expires in 1h.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          # Numeric App ID; the client-id input accepts either
          # (app-id is deprecated in v3).
          client-id: ${{ vars.AUTOUPDATE_APP_ID }}
          private-key: ${{ secrets.AUTOUPDATE_APP_PRIVATE_KEY }}

      - name: Check for updates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_RECIPE: ${{ inputs.recipe }}
        run: bash .github/scripts/auto-update.sh "$INPUT_RECIPE"

      # GITHUB_TOKEN commits don't re-trigger workflows —
      # same pattern build.yml uses for .binaries.toml.
      # GraphQL createCommitOnBranch auto-signs "Verified"
      # so the commit passes the ~ALL signed-commit rule.
      #
      # Target the dashboard-data branch, not main: main's
      # "Protect main" ruleset requires the ledger-check status on
      # every update, which a non-PR direct commit can never
      # report, so a commit here would be rejected FORBIDDEN.
      - name: Commit _data/upstream.json to dashboard-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f _data/upstream.json ]; then
            echo "No _data/upstream.json produced, skipping commit"
            exit 0
          fi

          # Compare against the current dashboard-data copy (the
          # store), not the working-tree HEAD — the prior file was
          # overlaid from dashboard-data above, so a git-status
          # check would always read dirty. origin/dashboard-data
          # was fetched in the seed step.
          PRIOR=$(mktemp)
          git show origin/dashboard-data:_data/upstream.json \
            > "$PRIOR" 2>/dev/null || : > "$PRIOR"
          if cmp -s _data/upstream.json "$PRIOR"; then
            echo "upstream.json unchanged, skipping commit"
            exit 0
          fi

          HEAD_OID=$(gh api graphql -f query='
            query($owner:String!,$name:String!) {
              repository(owner:$owner,name:$name) {
                ref(qualifiedName:"refs/heads/dashboard-data") {
                  target { oid }
                }
              }
            }' -f owner="${REPO%/*}" \
               -f name="${REPO#*/}" \
               --jq '.data.repository.ref.target.oid')

          # Build the whole GraphQL payload in one jq pass that
          # reads the base64 via --rawfile and write it to a
          # file for `gh --input`. The encoded upstream.json
          # exceeds the 128 KB single-argument limit (Linux
          # MAX_ARG_STRLEN), so it must never ride on argv —
          # neither as `jq --arg "$(base64 ...)"` nor as a
          # `--argjson` of an additions blob. Both die with
          # "Argument list too long" (exit 126/1).
          QUERY='mutation($input:CreateCommitOnBranchInput!) {
            createCommitOnBranch(input:$input) {
              commit { oid url }
            }
          }'
          B64_FILE=$(mktemp)
          PAYLOAD=$(mktemp)
          base64 -w0 < _data/upstream.json > "$B64_FILE"
          jq -n \
            --arg query "$QUERY" \
            --arg repo "$REPO" \
            --arg oid "$HEAD_OID" \
            --arg path "_data/upstream.json" \
            --rawfile contents "$B64_FILE" \
            '{
              query: $query,
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: "dashboard-data"
                  },
                  message: {
                    headline: "Update _data/upstream.json from daily check"
                  },
                  expectedHeadOid: $oid,
                  fileChanges: {
                    additions: [{ path: $path, contents: $contents }]
                  }
                }
              }
            }' > "$PAYLOAD"
          gh api graphql --input "$PAYLOAD"
