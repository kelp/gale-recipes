name: Admit Darwin

# Runs gale admit on macos-26 for PACKAGES not already
# indexed on origin/main. Uploads fragments and failed
# notes; does not commit. tree_digest comes from admit
# stdout only.

on:
  pull_request:
    paths:
      - 'scripts/admit_manifest.py'
      - 'scripts/admit_darwin.py'
      - 'scripts/test_admit_manifest.py'
      - '.github/workflows/admit-darwin.yml'
      - 'index/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch origin/main
        run: git fetch --no-tags origin main

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: kelp/gale
          ref: 1f74eb971bbc819cf0a3f486139ec5601e5f674f
          path: gale-src
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: gale-src/go.mod

      - name: Build gale
        run: go build -o /tmp/gale-admit ./cmd/gale/
        working-directory: gale-src

      - name: Admit darwin/arm64
        env:
          GALE: /tmp/gale-admit
          INDEX_BASE: origin/main
        run: python3 scripts/admit_darwin.py --out fragments

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: admit-darwin-arm64
          path: |
            fragments/*.fragment.toml
            fragments/*.failed.txt
          if-no-files-found: ignore
