name: Admit Darwin

# Runs gale admit on macos-26 for the first-four catalog.
# Uploads fragments; does not commit. tree_digest comes
# from admit stdout only.

on:
  pull_request:
    paths:
      - 'scripts/admit_manifest.py'
      - 'scripts/admit_darwin.py'
      - 'scripts/test_admit_manifest.py'
      - '.github/workflows/admit-darwin.yml'
      - 'index/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: kelp/gale
          ref: 8d661ca376696bc7c5214906127b4a408b6e862a
          path: gale-src

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: gale-src/go.mod

      - name: Build gale
        run: go build -o /tmp/gale-admit ./cmd/gale/
        working-directory: gale-src

      - name: Admit darwin/arm64
        env:
          GALE: /tmp/gale-admit
        run: python3 scripts/admit_darwin.py --out fragments

      - uses: actions/upload-artifact@ea9f4cc7ade83bcc0ba7c5742e6e1707b47413a8  # v4.6.2
        with:
          name: admit-darwin-arm64
          path: fragments/*.fragment.toml
