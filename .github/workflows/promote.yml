name: Promote Recipe Build

# Human authorization gate for the PRIVILEGED build.
#
# A maintainer applies the `approved-for-build` label to a recipe
# PR. This workflow then dispatches build.yml pinned to the exact
# reviewed commit, which builds + pushes to GHCR + attests and
# commits the .binaries.toml/.versions ONTO THE PR BRANCH. The
# human then merges (merge-commit), flipping recipe + binaries
# onto main atomically.
#
# SECURITY — this is a pull_request_target workflow, so it runs in
# the BASE repo context with a writable token. It MUST NOT check
# out or execute PR head code (the classic pull_request_target
# RCE footgun). It only reads event metadata and dispatches a
# separate, SHA-pinned build.yml run — that run is where the
# (authorized) privileged execution happens.
#
# Because there is no branch protection, the in-workflow actor
# permission check is the real gate: applying a label needs only
# triage access, so we additionally require the labeler to have
# write/maintain/admin before dispatching.
#
# Fork PRs are not supported: head.sha from a fork is not
# checkoutable by SHA in the base repo. This repo's recipe PRs
# come from same-repo branches (auto-update bot + maintainer).

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  actions: write

jobs:
  authorize:
    if: github.event.label.name == 'approved-for-build'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.event.sender.login }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Verify labeler has write access
        run: |
          PERM=$(gh api \
            "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission' 2>/dev/null) || PERM="none"
          case "$PERM" in
            admin|maintain|write)
              echo "${ACTOR} has ${PERM} access — authorized" ;;
            *)
              echo "::error::${ACTOR} lacks write access (${PERM}); refusing to dispatch a privileged build"
              exit 1 ;;
          esac

      - name: Derive recipe names from changed files
        id: recipes
        run: |
          # Repo-controlled file paths only — never PR title/body
          # (which can carry upstream-influenced strings). Names are
          # validated against gale's recipe-name charset before use.
          NAMES=$(gh pr diff "$PR_NUMBER" -R "$REPO" --name-only \
            | grep -E '^recipes/[a-z0-9]/[^/]+\.toml$' \
            | grep -v '\.binaries\.toml$' \
            | sed -E 's#^recipes/[a-z0-9]/([^/]+)\.toml$#\1#' \
            | sort -u || true)

          if [ -z "$NAMES" ]; then
            echo "::error::PR #${PR_NUMBER} changes no recipe .toml files; nothing to build"
            exit 1
          fi

          # Reject any name outside [a-z0-9][a-z0-9-]* (defence in
          # depth before the name reaches a dispatch input).
          while IFS= read -r n; do
            if ! printf '%s' "$n" | grep -qE '^[a-z0-9][a-z0-9-]*$'; then
              echo "::error::unsafe recipe name derived from PR: ${n}"
              exit 1
            fi
          done <<< "$NAMES"

          CSV=$(printf '%s' "$NAMES" | paste -sd, -)
          echo "recipes=${CSV}" >> "$GITHUB_OUTPUT"
          echo "Authorized build for: ${CSV}"

      - name: Dispatch privileged build pinned to reviewed SHA
        env:
          RECIPES: ${{ steps.recipes.outputs.recipes }}
        run: |
          # build.yml runs from main's trusted definition (--ref
          # main); it checks out HEAD_SHA for content and commits
          # binaries onto HEAD_REF (the PR branch).
          gh workflow run build.yml --ref main \
            -f recipe="$RECIPES" \
            -f head_sha="$HEAD_SHA" \
            -f target_branch="$HEAD_REF"
          echo "Dispatched build for ${RECIPES} @ ${HEAD_SHA} -> ${HEAD_REF}"
