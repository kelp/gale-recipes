name: Registry Coherence Audit

# Daily watchdog: audits every ledgered [[history]] entry in
# recipes/**/*.binaries.toml against the GHCR revisioned-tag
# descriptors it anchors. This is the ONE thing in-tree
# checks structurally cannot see — external registry
# mutation. Everything the old binary-drift check caught
# (recipe version ahead of .binaries.toml) is now enforced
# pre-merge by the required Ledger Check; the status page
# keeps its own drift display for the dashboard.
#
# Failure modes and their recovery wording:
# - "anchor lost": a published tag 404s — external deletion
#   or GC ate an immutable artifact.
# - "immutable tag conflict: ... bump revision to
#   republish": registry content changed externally; the
#   ledgered digests are what clients pin, so the only
#   forward path is a revision bump through promote.
# A 5xx is retried then counted as an audit error, never as
# absent. Recipes with no history yet are skipped and
# counted (quiet during the bridge; comprehensive after
# backfill + republish).

on:
  schedule:
    # 10:30 UTC — comfortably after auto-update.yml at 09:17
    # so any same-day version bumps have a chance to land
    # before this runs. Off-peak, non-round minute to dodge
    # top-of-hour API spikes.
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Audits are idempotent and cheap; coalesce overlaps
# so a long-running rebuild doesn't stack runs.
concurrency:
  group: drift-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Audit ledger against GHCR
        run: python3 scripts/check_registry_coherence.py --repo-root .
