name: Build Chunk

# Reusable workflow invoked once per chunk by build.yml.
# A chunk is a flat list of {recipe, platform, os} cells
# already sized by scripts/chunk_recipes.py to fit GH
# Actions' per-matrix expansion cap. Each cell becomes one
# matrix job.
#
# Flat cells (vs. the previous nested recipe × platform
# matrix) means the chunker's cell budget directly equals
# the GH cap — no implicit multiplication, no platform-count
# coupling. Adding a platform changes only platforms.json;
# this workflow doesn't care how many cells there are as
# long as len(cells) <= cap. The chunker self-asserts that
# cap at generation (scripts/chunk_recipes.py), and the
# update-recipes completeness check in build.yml turns any
# silently dropped cell into a workflow failure — the
# neovim 9-day stale incident of 2026-05-18 cannot recur
# silently.
#
# Cells arrive pre-filtered to each recipe's declared
# [package].platforms, so every cell here is expected to
# build. A build failure is a failure, full stop — there is
# no 'unsupported platform' skip path.
#
# Registry semantics (write-once GHCR):
# - Every artifact publishes under the IMMUTABLE revisioned
#   tag <version>-<revision>-<platform>, exactly once. Tags
#   are never pushed twice, moved, or deleted.
# - Adopt-or-push: if the tag already exists, the job ADOPTS
#   the registry artifact's digests into build metadata —
#   after still building and smoke-testing locally; adoption
#   never skips testing. A content mismatch between the local
#   rebuild and the registry artifact is a logged ::warning
#   (the darwin non-byte-reproducibility metric), never an
#   overwrite: the registry artifact is what clients pin.
# - Only a confirmed HTTP 404 from the manifest endpoint
#   permits a push. Any other failure retries and then fails
#   the job — a transient registry error must never be
#   treated as an absent tag.
# - Legacy bare <version>-<platform> tags are GC anchors for
#   installs already pinned to them. They are never pushed,
#   moved, or deleted again.

on:
  workflow_call:
    inputs:
      cells_json:
        description: >-
          JSON array of {recipe, platform, os} cells. Each
          cell becomes one build matrix job. Generated by
          scripts/chunk_recipes.py.
        required: true
        type: string
      ref:
        description: >-
          Exact git ref/SHA to check out. Empty (the default)
          checks out the triggering commit (github.sha). The
          promote flow passes the reviewed PR head SHA so the
          privileged build is pinned to exactly what a human
          authorized, closing the post-approval TOCTOU.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    timeout-minutes: 180
    concurrency:
      # Keyed by the build ref, not github.ref alone: promote
      # dispatches all run at github.ref == main, so two
      # promoted PRs touching the same recipe/platform would
      # cancel each other. inputs.ref carries the per-PR
      # reviewed head_sha and keys them apart; same-SHA
      # re-labels share a group and cancel the stale run,
      # which is correct.
      group: build-${{ matrix.cell.recipe }}-${{ matrix.cell.platform }}-${{ inputs.ref || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        cell: ${{ fromJson(inputs.cells_json) }}
    runs-on: ${{ matrix.cell.os }}
    env:
      RECIPE_NAME: ${{ matrix.cell.recipe }}
      PLATFORM: ${{ matrix.cell.platform }}
      GHCR_REPO: ghcr.io/${{ github.repository }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      # ubuntu-latest leaves ~20 GB free on /, which Rust/LLVM source
      # builds plus toolchain and rust-docs extraction exhaust ("No
      # space left on device"). Drop preinstalled SDKs we never use to
      # reclaim ~25-30 GB before any build or cache restore.
      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift || true
          df -h /

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gale-${{ matrix.cell.platform }}
          path: gale-bin

      - name: Install gale
        run: |
          chmod +x gale-bin/gale
          echo "${GITHUB_WORKSPACE}/gale-bin" \
            >> "$GITHUB_PATH"

      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y patchelf

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10

      - name: Start sccache server
        run: sccache --start-server

      - name: Cache build dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.gale/pkg
            ~/.gale/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/.cache/pip
            ~/Library/Caches/pip
            ~/.npm
          key: deps-${{ matrix.cell.platform }}-${{ hashFiles('recipes/**/*.toml') }}
          restore-keys: |
            deps-${{ matrix.cell.platform }}-

      - name: Find recipe file
        id: recipe
        run: |
          LETTER="${RECIPE_NAME:0:1}"
          FILE="recipes/${LETTER}/${RECIPE_NAME}.toml"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Build recipe
        id: build
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          for attempt in 1 2 3; do
            OUTPUT=$(gale build "$RECIPE_FILE" \
              2>&1 | tee /tmp/build.log)
            ARCHIVE=$(echo "$OUTPUT" | grep '^archive:' \
              | awk '{print $2}')
            SHA=$(echo "$OUTPUT" | grep '^sha256:' \
              | awk '{print $2}')

            if [ -n "$ARCHIVE" ]; then
              break
            fi

            echo "::warning::Build attempt $attempt failed, retrying..."
            sleep $((attempt * 10))
          done

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

          if [ -z "$ARCHIVE" ]; then
            echo "::error::Build failed after 3 attempts"
            echo "--- build log ---"
            cat /tmp/build.log || true
            exit 1
          fi

      # Install the recipe (with its build+runtime deps) so the
      # dependency farm is populated and the binary lands at its
      # real store path with the farm rpath baked correctly. The
      # next step then runs THAT installed binary — the way a
      # user runs it. A relocated tar extract would dyld-abort on
      # a dynamically-linked runtime-dep dylib (eza->libgit2,
      # flac->libogg, git-delta, bat), even though the binary is
      # correct, because the @loader_path-relative farm rpath
      # only resolves at the install location. gale cannot
      # install a pre-built archive, so this is a second build;
      # the archive/sha256 the Build step captured for the GHCR
      # push below is untouched.
      - name: Install recipe (populate dep farm)
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          gale install --global "${RECIPE_NAME}" \
            --recipe "${RECIPE_FILE}"

      - name: Verify binary runs
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          python3 scripts/verify_binary.py \
            --recipe "${RECIPE_FILE}"

      - name: Check install (rpath vs runtime deps)
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          CHECK_DIR=$(mktemp -d)
          tar --zstd -xf "${ARCHIVE}" -C "${CHECK_DIR}"
          python3 scripts/check_install.py \
            --recipe "${RECIPE_FILE}" \
            --prefix "${CHECK_DIR}"
          rm -rf "${CHECK_DIR}"

      - name: Install and smoke test
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          HAS_SMOKE=$(python3 -c "
          import sys, tomllib
          with open('${RECIPE_FILE}', 'rb') as f:
              r = tomllib.load(f)
          sys.exit(0 if r.get('smoke', {}).get('commands') else 1)
          " && echo yes || echo no)

          if [ "$HAS_SMOKE" != "yes" ]; then
            echo "No [smoke] section; skipping"
            exit 0
          fi

          gale install --global "${RECIPE_NAME}" \
            --recipe "${RECIPE_FILE}"
          python3 scripts/run_smoke.py \
            --recipe "${RECIPE_FILE}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-log-${{ matrix.cell.recipe }}-${{ matrix.cell.platform }}
          path: /tmp/build.log
          retention-days: 7

      - uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3  # v2.0.0
        with:
          # Pinned: digest capture below depends on
          # `oras push --format`, and the action's floating
          # default could move under us.
          version: "1.3.1"

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | \
            oras login ghcr.io --password-stdin -u github

      # Digest capture must never silently degrade: a metadata
      # JSON without a manifest_digest is worse than a failed
      # job, so refuse to continue with an oras that can't
      # report the pushed manifest digest.
      - name: Assert oras supports digest capture
        run: |
          oras version
          if ! oras push --help | grep -q -- '--format'; then
            echo "::error::oras too old for digest capture"
            exit 1
          fi

      # Adopt-or-push decision for the immutable revisioned
      # tag <version>-<revision>-<platform>:
      #   HTTP 200 -> tag exists; ADOPT the registry
      #     artifact's digests (the local build above was
      #     still tested in full — adoption never skips
      #     testing). A content mismatch is a ::warning,
      #     never an overwrite: the registry artifact is
      #     what clients pin.
      #   HTTP 404 -> confirmed absent; push is permitted.
      #     Covers both MANIFEST_UNKNOWN and NAME_UNKNOWN
      #     (first-ever publish of this package).
      #   anything else -> retry, then hard-fail. Only a
      #     confirmed 404 may permit a push.
      - name: Resolve immutable tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_REPO: ${{ github.repository }}
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
          LOCAL_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          # One tomllib read for version+revision — grep/sed
          # reimplementations drift from TOML semantics.
          read -r VERSION REVISION < <(python3 - "$RECIPE_FILE" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as f:
              pkg = tomllib.load(f)["package"]
          print(pkg["version"], int(pkg.get("revision", 1) or 1))
          PY
          )
          TAG="${VERSION}-${REVISION}-${PLATFORM}"
          echo "Resolving ${OWNER_REPO}/${RECIPE_NAME}:${TAG}"

          # Authenticated pull token: an anonymous probe of a
          # private or never-published package returns an auth
          # error that masquerades as absence.
          TOKEN=$(curl -fsS -u "github:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER_REPO}/${RECIPE_NAME}:pull" \
            | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::could not obtain GHCR pull token for ${OWNER_REPO}/${RECIPE_NAME}"
            exit 1
          fi

          EXISTS=""
          CODE="000"
          for attempt in 1 2 3; do
            CODE=$(curl -sS -D /tmp/mhdr -o /tmp/manifest.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${OWNER_REPO}/${RECIPE_NAME}/manifests/${TAG}") \
              || CODE="000"
            if [ "$CODE" = "200" ]; then
              EXISTS=true
              break
            fi
            if [ "$CODE" = "404" ]; then
              EXISTS=false
              break
            fi
            echo "::warning::GHCR manifest probe for ${TAG} returned HTTP ${CODE} (attempt ${attempt})"
            sleep $((attempt * 10))
          done

          # SAFETY-CRITICAL: a transient error treated as
          # "absent" would re-push over an immutable tag.
          if [ -z "$EXISTS" ]; then
            echo "::error::cannot determine whether ${TAG} exists (last HTTP ${CODE}); refusing to guess — a transient error must never be treated as an absent tag"
            exit 1
          fi

          MANIFEST_DIGEST=""
          OUT_SHA="${LOCAL_SHA256}"
          if [ "$EXISTS" = "true" ]; then
            HDR_DIGEST=$(grep -i '^docker-content-digest:' /tmp/mhdr \
              | head -1 | awk '{print $2}' | tr -d '\r')
            CALC_DIGEST="sha256:$(python3 -c "import hashlib; print(hashlib.sha256(open('/tmp/manifest.json','rb').read()).hexdigest())")"
            if [ -n "$HDR_DIGEST" ] && \
               [ "$HDR_DIGEST" != "$CALC_DIGEST" ]; then
              echo "::error::Docker-Content-Digest ${HDR_DIGEST} disagrees with sha256 of the served manifest ${CALC_DIGEST} for ${TAG}"
              exit 1
            fi
            MANIFEST_DIGEST="${HDR_DIGEST:-$CALC_DIGEST}"
            REG_SHA=$(jq -r '.layers[0].digest // empty' /tmp/manifest.json)
            REG_SHA="${REG_SHA#sha256:}"
            if ! printf '%s' "$MANIFEST_DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
              echo "::error::malformed manifest digest '${MANIFEST_DIGEST}' for ${TAG}"
              exit 1
            fi
            if ! printf '%s' "$REG_SHA" | grep -qE '^[0-9a-f]{64}$'; then
              echo "::error::malformed layer digest in registry manifest for ${TAG}"
              exit 1
            fi
            if [ "$REG_SHA" != "$LOCAL_SHA256" ]; then
              echo "::warning::immutable tag ${TAG} already published with different content (registry layer ${REG_SHA} != local build ${LOCAL_SHA256}); adopting the registry artifact — it is what clients pin. If you intended to ship new bytes, bump [package].revision."
            else
              echo "Registry artifact matches local build (${REG_SHA})"
            fi
            OUT_SHA="${REG_SHA}"
            echo "Adopting existing ${TAG} (manifest ${MANIFEST_DIGEST})"
          else
            echo "Tag ${TAG} confirmed absent (HTTP 404); push permitted"
          fi

          {
            echo "exists=${EXISTS}"
            echo "manifest_digest=${MANIFEST_DIGEST}"
            echo "sha256=${OUT_SHA}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      # File-subject attestation for old-client compatibility.
      # Clients before #132 verify the tar.zst FILE digest via
      # the GitHub attestations API; without this they find
      # nothing, fail verification, and fall back to a source
      # build (the #131 disk-fill). It runs only on first
      # publish (steps.tag.outputs.exists != 'true') because the
      # tar.zst exists locally only at build time, and an
      # immutable tag was already file-attested on its first
      # publish. We ADD this subject alongside the manifest
      # referrer below; we never change the existing subject,
      # honoring the original "Never change the attestation
      # subject" intent. REMOVABLE once #132 is the floor
      # version every client runs.
      # Retry transient GitHub API 401s (gale-recipes#78: three
      # "Failed to persist attestation: Requires authentication"
      # flakes on 2026-06-10, each gating an otherwise-green
      # publish). actions/attest is a uses: step, so it cannot ride
      # the shell `for attempt` loop the build/oras-push steps use;
      # instead chain three attempts via continue-on-error + step
      # outcome guards with a backoff between tries. The final
      # attempt keeps no continue-on-error, so a persistent failure
      # still hard-fails the job: this absorbs transient 401s, it
      # does not make attestation optional.
      - name: Attest build provenance (file subject, old clients)
        id: attest_file_1
        if: steps.tag.outputs.exists != 'true'
        continue-on-error: true
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: ${{ steps.build.outputs.archive }}
      - name: Attest file subject retry 1 (backoff)
        if: steps.tag.outputs.exists != 'true' && steps.attest_file_1.outcome == 'failure'
        run: |
          echo "::warning::attest (file subject) attempt 1 failed, retrying..."
          sleep 10
      - name: Attest build provenance (file subject, old clients) attempt 2
        id: attest_file_2
        if: steps.tag.outputs.exists != 'true' && steps.attest_file_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: ${{ steps.build.outputs.archive }}
      - name: Attest file subject retry 2 (backoff)
        if: steps.tag.outputs.exists != 'true' && steps.attest_file_1.outcome == 'failure' && steps.attest_file_2.outcome == 'failure'
        run: |
          echo "::warning::attest (file subject) attempt 2 failed, retrying..."
          sleep 20
      - name: Attest build provenance (file subject, old clients) final attempt
        if: steps.tag.outputs.exists != 'true' && steps.attest_file_1.outcome == 'failure' && steps.attest_file_2.outcome == 'failure'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: ${{ steps.build.outputs.archive }}

      - name: Push to GHCR
        id: push
        if: steps.tag.outputs.exists != 'true'
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          # If an attempt partially lands and a retry then
          # fails against the now-existing tag, this step
          # fails; a job re-run recovers via the adopt path.
          DIGEST=""
          for attempt in 1 2 3; do
            if DIGEST=$(oras push --disable-path-validation \
                --annotation "org.opencontainers.image.source=${REPO_URL}" \
                --format go-template='{{.digest}}' \
                "${GHCR_REPO}/${RECIPE_NAME}:${TAG}" \
                "${ARCHIVE}:application/vnd.oci.image.layer.v1.tar+zstd"); then
              break
            fi
            DIGEST=""
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::oras push attempt $attempt failed, retrying..."
              sleep $((attempt * 10))
            fi
          done
          if [ -z "$DIGEST" ]; then
            echo "::error::oras push failed after 3 attempts"
            exit 1
          fi
          if ! printf '%s' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::oras reported malformed digest '${DIGEST}' for ${TAG}; never proceed without a digest"
            exit 1
          fi
          echo "Pushed ${TAG} as ${DIGEST}"
          echo "manifest_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Manifest-subject attestation pushed as an OCI referrer,
      # ADDED so #132+ clients can verify token-free via
      # `gh attestation verify --bundle-from-oci` (no GitHub API,
      # no token). This is an ADDED subject (the image manifest),
      # not a change to the file subject attested above — the
      # original "Never change the attestation subject" intent
      # holds. Attest whenever the image manifest is available:
      # on a first publish the digest comes from the push step;
      # on the adopt path it comes from the resolve step.
      # Re-running on an already-attested image is harmless and
      # covers the case where a previous attestation failed after
      # a successful push, leaving the image without an OCI
      # referrer.
      # Same transient-401 retry chain as the file-subject attest
      # above (gale-recipes#78): three attempts with backoff, the
      # final one hard-fails.
      - name: Attest build provenance (manifest subject, OCI referrer)
        id: attest_manifest_1
        if: steps.push.outputs.manifest_digest != '' || steps.tag.outputs.manifest_digest != ''
        continue-on-error: true
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.cell.recipe }}
          subject-digest: ${{ steps.push.outputs.manifest_digest || steps.tag.outputs.manifest_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest manifest subject retry 1 (backoff)
        if: (steps.push.outputs.manifest_digest != '' || steps.tag.outputs.manifest_digest != '') && steps.attest_manifest_1.outcome == 'failure'
        run: |
          echo "::warning::attest (manifest subject) attempt 1 failed, retrying..."
          sleep 10
      - name: Attest build provenance (manifest subject, OCI referrer) attempt 2
        id: attest_manifest_2
        if: (steps.push.outputs.manifest_digest != '' || steps.tag.outputs.manifest_digest != '') && steps.attest_manifest_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.cell.recipe }}
          subject-digest: ${{ steps.push.outputs.manifest_digest || steps.tag.outputs.manifest_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest manifest subject retry 2 (backoff)
        if: (steps.push.outputs.manifest_digest != '' || steps.tag.outputs.manifest_digest != '') && steps.attest_manifest_1.outcome == 'failure' && steps.attest_manifest_2.outcome == 'failure'
        run: |
          echo "::warning::attest (manifest subject) attempt 2 failed, retrying..."
          sleep 20
      - name: Attest build provenance (manifest subject, OCI referrer) final attempt
        if: (steps.push.outputs.manifest_digest != '' || steps.tag.outputs.manifest_digest != '') && steps.attest_manifest_1.outcome == 'failure' && steps.attest_manifest_2.outcome == 'failure'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.cell.recipe }}
          subject-digest: ${{ steps.push.outputs.manifest_digest || steps.tag.outputs.manifest_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Save build metadata
        env:
          # Registry truth wins: on the adopt path sha256 is
          # the registry layer digest (what clients pin), not
          # the local rebuild's; manifest_digest comes from
          # whichever of resolve/push talked to GHCR. The
          # metadata always matches what GHCR serves.
          SHA256: ${{ steps.tag.outputs.sha256 }}
          MANIFEST_DIGEST: ${{ steps.tag.outputs.exists == 'true' && steps.tag.outputs.manifest_digest || steps.push.outputs.manifest_digest }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          if ! printf '%s' "${MANIFEST_DIGEST}" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::missing or malformed manifest_digest '${MANIFEST_DIGEST}'; metadata must always match what GHCR serves"
            exit 1
          fi

          mkdir -p /tmp/metadata

          # deps come from the LOCALLY built archive's
          # .gale-deps.toml (informational only). Adopt-path
          # caveat: they describe what this rebuild linked
          # against, which can differ from the registry
          # artifact's closure; the archive's own
          # .gale-deps.toml stays authoritative.
          DEPS_JSON="[]"
          EXTRACT_DIR=$(mktemp -d)
          if tar --zstd -xf "${ARCHIVE}" -C "${EXTRACT_DIR}" .gale-deps.toml 2>/dev/null; then
            DEPS_JSON=$(python3 - "${EXTRACT_DIR}/.gale-deps.toml" <<'PY'
          import json, sys, tomllib
          with open(sys.argv[1], "rb") as f:
              data = tomllib.load(f)
          out = []
          for dep in data.get("deps", []):
              out.append({
                  "name": dep.get("name", ""),
                  "version": dep.get("version", ""),
                  "revision": int(dep.get("revision", 1) or 1),
              })
          print(json.dumps(out))
          PY
          )
          fi
          rm -rf "${EXTRACT_DIR}"

          jq -n \
            --arg recipe "${RECIPE_NAME}" \
            --arg platform "${PLATFORM}" \
            --arg sha256 "${SHA256}" \
            --arg md "${MANIFEST_DIGEST}" \
            --argjson deps "${DEPS_JSON}" \
            '{recipe: $recipe, platform: $platform, sha256: $sha256, manifest_digest: $md, deps: $deps}' \
            > "/tmp/metadata/${RECIPE_NAME}-${PLATFORM}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: metadata-${{ matrix.cell.recipe }}-${{ matrix.cell.platform }}
          path: /tmp/metadata/
