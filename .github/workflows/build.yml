name: Build Recipes

# THE one writer. This workflow is the only thing that builds,
# attests, pushes to GHCR, and commits .binaries.toml — and it
# only ever commits onto a PR branch, never main.
#
# It runs exclusively via workflow_dispatch:
#   - promote.yml dispatches it after a human applies the
#     `approved-for-build` label, pinned to the reviewed PR
#     head SHA with the PR branch as target_branch.
#   - A reconcile is the same flow done by hand: branch from
#     main, dispatch here, merge the PR.
#
# There is no push-to-main publish path, no build-all, and no
# post-merge rebuild: recipe + binaries + ledger merge
# atomically in the PR, so main is never written by CI.
#
# NOTE: there is deliberately NO `pull_request` trigger. This
# workflow is PRIVILEGED (packages/id-token/attestations write,
# GHCR push). Running it pre-merge on a PR would execute
# unreviewed upstream build code with those tokens. Pre-merge
# builds run in the UNPRIVILEGED verify.yml instead.

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe names, comma-separated'
        required: true
      head_sha:
        description: >-
          Exact commit SHA to build. The promote flow passes
          the reviewed PR head SHA so the build is pinned to
          exactly what was authorized.
        required: true
      target_branch:
        description: >-
          PR branch the .binaries.toml commit lands on, so
          binaries merge atomically with the recipe.
          Never main.
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  # Lets update-recipes dispatch Ledger Check onto the PR
  # branch — the GraphQL commit cannot fire pull_request
  # events itself, so without the dispatch the required
  # check would sit "Expected" forever.
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      # JSON array-of-arrays. Each inner array is a list of
      # {recipe, platform, os} cells dispatched as one
      # build-chunk.yml reusable-workflow call. Chunk sizing
      # is derived in scripts/chunk_recipes.py from
      # GH_MATRIX_CELL_CAP — no magic numbers in this YAML.
      chunks: ${{ steps.list.outputs.chunks }}
      # Flat sorted list of every recipe name that should
      # produce metadata. Completeness is enforced by the
      # required Ledger Check, not here: a dropped chunk
      # yields a missing [[history]] entry and an
      # unmergeable PR.
      all_recipes: ${{ steps.list.outputs.all_recipes }}
      # The build-matrix platform list, echoed back so
      # build-gale can fromJson it without re-reading
      # platforms.json itself.
      platforms: ${{ steps.list.outputs.platforms }}
      gale_version: ${{ steps.gale.outputs.version }}
    steps:
      # GitHub does not enforce `required: true` on dispatch
      # inputs sent via the API, so enforce the contract here
      # before anything privileged runs.
      - name: Validate dispatch inputs
        env:
          INPUT_RECIPE: ${{ inputs.recipe }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          if [ -z "$INPUT_RECIPE" ] || [ -z "$HEAD_SHA" ] || \
             [ -z "$TARGET_BRANCH" ] || \
             [ "$TARGET_BRANCH" = "main" ]; then
            echo "::error::build.yml is publish-only: it builds the reviewed head_sha and commits binaries+ledger onto target_branch (a PR branch). Pre-merge testing runs in verify.yml. Reconcile = branch from main, dispatch here, merge the PR."
            exit 1
          fi
          echo "Building ${INPUT_RECIPE} @ ${HEAD_SHA} -> ${TARGET_BRANCH}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Pin to the reviewed SHA the promote flow authorized.
          ref: ${{ inputs.head_sha }}

      # Read the canonical gale version from its own recipe
      # so bumping recipes/g/gale.toml is enough to drag the
      # CI build toolchain forward. No hand-edited pin in
      # this workflow to drift.
      - name: Resolve gale version from recipe
        id: gale
        run: |
          VERSION=$(awk -F'"' '/^version[[:space:]]*=/ {print $2; exit}' \
            recipes/g/gale.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from recipes/g/gale.toml" >&2
            exit 1
          fi
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using gale v${VERSION} for CI build"

      - name: List recipes to build
        id: list
        env:
          INPUT_RECIPE: ${{ inputs.recipe }}
        run: |
          # Support comma-separated recipe names.
          IFS=',' read -ra NAMES <<< "$INPUT_RECIPE"
          NAMES_NL=$(for name in "${NAMES[@]}"; do
            name="${name## }"; name="${name%% }"
            LETTER="${name:0:1}"
            FILE="recipes/${LETTER}/${name}.toml"
            if [ ! -f "$FILE" ]; then
              echo "::error::Recipe not found: $FILE" >&2
              exit 1
            fi
            echo "$name"
          done)

          # Hand the recipe list to the chunker. It reads
          # .github/platforms.json itself, filters each
          # recipe's cells to its declared [package].platforms
          # (declared platforms are authoritative — ineligible
          # platforms get no cell), derives the cell budget
          # from GH_MATRIX_CELL_CAP, and emits a JSON object
          # with chunks, all_recipes, and platforms.
          # Self-asserts each chunk stays within the cap.
          # Stderr is the human log line; stdout is the
          # contract.
          DOC=$(printf '%s' "$NAMES_NL" \
            | python3 scripts/chunk_recipes.py)

          # Split the document into the three outputs the
          # downstream jobs consume. jq -c keeps each line
          # compact so the GITHUB_OUTPUT shell-pair stays on
          # one line (multi-line outputs need an EOF marker).
          {
            echo "chunks=$(echo "$DOC" | jq -c '.chunks')"
            echo "all_recipes=$(echo "$DOC" | jq -c '.all_recipes')"
            echo "platforms=$(echo "$DOC" | jq -c '.platforms')"
          } >> "$GITHUB_OUTPUT"

  build-gale:
    needs: discover
    if: needs.discover.outputs.chunks != '[]'
    strategy:
      # Platforms come from .github/platforms.json via
      # discover's output — same list build-chunk consumes,
      # so the two matrices can't drift.
      matrix:
        target: ${{ fromJson(needs.discover.outputs.platforms) }}
    runs-on: ${{ matrix.target.os }}
    env:
      GALE_VERSION: ${{ needs.discover.outputs.gale_version }}
    steps:
      - name: Use resolved gale version
        run: echo "Using gale ${GALE_VERSION}"

      - name: Cache gale binary
        id: cache-gale
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: gale-bin
          key: gale-${{ env.GALE_VERSION }}-${{ matrix.target.platform }}

      - name: Download gale release binary
        if: steps.cache-gale.outputs.cache-hit != 'true'
        env:
          PLATFORM: ${{ matrix.target.platform }}
        run: |
          mkdir -p gale-bin
          ARCHIVE="gale-${GALE_VERSION}-${PLATFORM}.tar.gz"
          curl -sL -o "/tmp/${ARCHIVE}" \
            "https://github.com/kelp/gale/releases/download/${GALE_VERSION}/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C gale-bin
          mv gale-bin/gale-* gale-bin/gale
          chmod +x gale-bin/gale

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gale-${{ matrix.target.platform }}
          path: gale-bin/gale
          retention-days: 1

  # Fan one reusable-workflow call per chunk. Each chunk
  # carries a flat list of {recipe, platform, os} cells
  # (already sized to fit GH's per-matrix cell cap by the
  # discover chunker, which self-asserts the cap at
  # generation).
  #
  # `secrets: inherit` so the called workflow gets
  # GITHUB_TOKEN with the same scopes (`packages: write`,
  # `id-token: write`, `attestations: write`).
  build:
    needs: [discover, build-gale]
    if: needs.discover.outputs.chunks != '[]'
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.discover.outputs.chunks) }}
    uses: ./.github/workflows/build-chunk.yml
    with:
      cells_json: ${{ toJson(matrix.chunk) }}
      # Pin the build to the reviewed SHA the promote flow
      # authorized.
      ref: ${{ inputs.head_sha }}
    secrets: inherit

  update-recipes:
    needs: [discover, build]
    if: >-
      always() && !cancelled()
      && needs.discover.outputs.chunks != '[]'
      && needs.build.result != 'skipped'
    # Serialize per target branch. Two promotes of the same
    # branch queue rather than cancel — dropping a run would
    # lose its .binaries.toml writes. The GraphQL commit
    # below uses expectedHeadOid as an atomic optimistic
    # lock; serialization keeps the loser's working-tree
    # writes from being silently discarded.
    concurrency:
      group: update-recipes-${{ inputs.target_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Build artifacts and recipe content must come from
          # the exact reviewed SHA.
          ref: ${{ inputs.head_sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/metadata
          pattern: metadata-*
          merge-multiple: true

      # There is deliberately NO metadata-completeness gate
      # here anymore: a recipe whose chunk was dropped (GH
      # matrix truncation, dead chunk job, all-platform
      # failure — the neovim 9-day incident of 2026-05-18)
      # now surfaces as a missing [[history]] entry, which
      # the required Ledger Check turns into an unmergeable
      # PR. The failure moved from this run's log to the
      # merge button.

      # Regenerate each built recipe's .binaries.toml: the
      # v0.16.5-readable head mirror plus the append-only
      # [[history]] ledger. The script enforces the
      # per-recipe all-eligible-platforms gate, hard-fails on
      # missing digests, and refuses to rewrite history.
      - name: Write .binaries.toml files
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python3 scripts/write_binaries.py \
            --metadata-dir /tmp/metadata --repo-root . \
            --commit "${HEAD_SHA}"

      # Commit the regenerated .binaries.toml onto the PR branch.
      #
      # This was deliberately TWO commits until the step-3
      # cutover (#100 / #94): .binaries.toml first, then a
      # .versions append whose entry pointed at the binaries
      # commit. That shape existed only for the v0.16.5 bridge —
      # those clients resolved latest through .versions → commit
      # C and then fetched recipe@C AND binaries@C, so C had to
      # be a commit whose tree held both, and C's own SHA could
      # not be written inside C.
      #
      # Every supported client (gale >= v0.20.0) resolves latest
      # and historical installs from the [[history]] ledger in
      # .binaries.toml instead, so CI no longer writes .versions.
      # The existing .versions files stay on disk, frozen at
      # their last-written entry, until step 4 deletes them: a
      # client still on the .versions path keeps resolving what
      # it already could, it just never sees a newer version.
      # Do not reformat or delete them here.
      #
      # GITHUB_TOKEN commits don't re-trigger workflows (no rebuild
      # loop). createCommitOnBranch auto-signs "Verified".
      - name: Commit binaries
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.target_branch }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          QUERY='mutation($input:CreateCommitOnBranchInput!) {
            createCommitOnBranch(input:$input) {
              commit { oid url }
            }
          }'

          # commit_to_branch <headline> <expected_oid> <file>...
          #   -> echoes new oid
          # expectedHeadOid is the atomic optimistic lock: the
          # mutation only lands if the branch tip still equals
          # expected_oid. The call passes the reviewed HEAD_SHA,
          # so a branch that moved after approval fails the
          # mutation itself — the TOCTOU guard, atomic instead
          # of check-then-act. On failure the tip is re-read:
          # a moved tip is terminal (re-approval required); an
          # unmoved tip means transient transport error,
          # retried with backoff.
          commit_to_branch() {
            local headline="$1"; shift
            local expected_oid="$1"; shift
            local additions oid tip resp attempt
            additions="[]"
            for f in "$@"; do
              additions=$(jq -n --argjson arr "$additions" \
                --arg path "$f" \
                --arg contents "$(base64 -w0 < "$f")" \
                '$arr + [{"path":$path,"contents":$contents}]')
            done
            for attempt in 1 2 3; do
              if resp=$(gh api graphql --input <(jq -n \
                  --arg query "$QUERY" --arg repo "$REPO" --arg branch "$BRANCH" \
                  --arg oid "$expected_oid" --arg headline "$headline" \
                  --argjson adds "$additions" \
                  '{query:$query, variables:{input:{
                     branch:{repositoryNameWithOwner:$repo, branchName:$branch},
                     message:{headline:$headline},
                     expectedHeadOid:$oid,
                     fileChanges:{additions:$adds}}}}') 2>/tmp/gqlerr); then
                oid=$(echo "$resp" | jq -r '.data.createCommitOnBranch.commit.oid // empty')
                if [ -n "$oid" ]; then
                  echo "$oid"
                  return 0
                fi
              fi
              tip=$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" \
                --jq '.object.sha' 2>/dev/null) || tip=""
              if [ -n "$tip" ] && [ "$tip" != "$expected_oid" ]; then
                echo "::error::${BRANCH} tip ${tip} != expected ${expected_oid}; branch moved since approval — re-apply approved-for-build to re-authorize" >&2
                return 1
              fi
              echo "::warning::commit '$headline' attempt $attempt to ${BRANCH} failed (transient), retrying" >&2
              cat /tmp/gqlerr >&2 2>/dev/null || true
              sleep $((attempt * 3))
            done
            echo "::error::failed to commit '$headline' to ${BRANCH} after retries" >&2
            return 1
          }

          # --- collect changed .binaries.toml ---
          BIN_CHANGED=$(git diff --name-only -- 'recipes/**/*.binaries.toml' || true)
          BIN_NEW=$(git ls-files --others --exclude-standard -- 'recipes/**/*.binaries.toml' || true)
          BIN_FILES=$(printf '%s\n%s' "$BIN_CHANGED" "$BIN_NEW" | sort -u | grep . || true)

          # --- commit the binaries (locked to the reviewed SHA) ---
          if [ -n "$BIN_FILES" ]; then
            mapfile -t BIN_ARR < <(printf '%s\n' "$BIN_FILES")
            BIN_OID=$(commit_to_branch "Update .binaries.toml from build" "$HEAD_SHA" "${BIN_ARR[@]}") || exit 1
            echo "Binaries committed as ${BIN_OID}"
          else
            # No binary changes — write_binaries.py regenerated
            # byte-identical files, so HEAD_SHA's tree already
            # holds binaries matching the metadata. Do NOT exit:
            # a prior run may have landed this commit and died
            # before dispatching the ledger check below, and
            # falling through is the documented recovery for
            # that crash window.
            echo "No binary changes; nothing to commit"
          fi

          # Explicit did-commit signal for the dispatch step
          # below. Deliberately true on every successful path,
          # including the all-no-op re-promote: a no-op
          # re-promote is the documented recovery for a prior
          # run that died after committing but before the
          # dispatch fired, and the dispatched check is
          # idempotent against an unchanged tip.
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The GraphQL commits above are GITHUB_TOKEN-authored,
      # so they cannot fire pull_request events — without
      # this explicit dispatch the required Ledger Check
      # would sit "Expected" forever and the promoted PR
      # would stay unmergeable. The dispatched run verifies
      # the freshly committed ledger on the branch tip and
      # posts a `ledger-check` commit STATUS on that SHA; the
      # status (not the dispatch check-run, which the PR rollup
      # ignores) is what credits the required check (gh#146).
      # The gate reads `committed`, an output the commit step
      # above explicitly writes — never gate this on outputs of
      # steps that may not exist: GitHub evaluates a missing
      # step output as '' and skips the dispatch silently.
      - name: Report ledger check on PR branch
        if: >-
          steps.commit.outputs.committed == 'true'
          && inputs.target_branch != 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.target_branch }}
        # Same 3-attempt treatment as auto-update.sh's
        # dispatches: a transient failure here leaves the
        # required check stuck at "Expected" with no run.
        # If all attempts fail the step (and job) fail —
        # recovery is re-running this job, or manually:
        # gh workflow run ledger-check.yml --ref <branch>
        run: |
          for attempt in 1 2 3; do
            if gh workflow run ledger-check.yml --ref "${BRANCH}"; then
              exit 0
            fi
            echo "::warning::ledger-check dispatch attempt ${attempt} failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "::error::ledger-check dispatch failed after 3 attempts; required check stuck at Expected. Re-run this job or: gh workflow run ledger-check.yml --ref ${BRANCH}"
          exit 1
