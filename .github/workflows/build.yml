name: Build Recipes

on:
  push:
    branches: [main]
    paths: ['recipes/**']
  pull_request:
    paths: ['recipes/**']
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe names, comma-separated (blank = changed only)'
        required: false

concurrency:
  group: build-${{ github.ref }}-${{ inputs.recipe }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.list.outputs.recipes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: List recipes to build
        id: list
        env:
          INPUT_RECIPE: ${{ inputs.recipe }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$INPUT_RECIPE" ]; then
            # Support comma-separated recipe names.
            IFS=',' read -ra NAMES <<< "$INPUT_RECIPE"
            RECIPES=$(for name in "${NAMES[@]}"; do
              name="${name## }"; name="${name%% }"
              LETTER="${name:0:1}"
              FILE="recipes/${LETTER}/${name}.toml"
              if [ ! -f "$FILE" ]; then
                echo "::error::Recipe not found: $FILE" >&2
                exit 1
              fi
              echo "$name"
            done | jq -R . | jq -sc .)
            echo "recipes=${RECIPES}" >> "$GITHUB_OUTPUT"

          else
            # Detect only changed recipes for push/PR.
            if [ "$EVENT_NAME" = "pull_request" ]; then
              CHANGED=$(git diff --name-only \
                "origin/${PR_BASE_REF}...HEAD" \
                -- 'recipes/**/*.toml' \
                | grep -v '\.binaries\.toml$' || true)
            else
              NULL_SHA="0000000000000000000000000000000000000000"
              if [ "$BEFORE_SHA" = "$NULL_SHA" ] || \
                 [ -z "$BEFORE_SHA" ]; then
                CHANGED=$(find recipes -name '*.toml' \
                  ! -name '*.binaries.toml')
              else
                if ! CHANGED=$(git diff --name-only \
                  "$BEFORE_SHA" "$CURRENT_SHA" \
                  -- 'recipes/**/*.toml' 2>/dev/null); then
                  CHANGED=$(find recipes -name '*.toml' \
                    ! -name '*.binaries.toml')
                else
                  CHANGED=$(echo "$CHANGED" \
                    | grep -v '\.binaries\.toml$' || true)
                fi
              fi
            fi

            if [ -z "$CHANGED" ]; then
              echo "No recipe files changed"
              echo "recipes=[]" >> "$GITHUB_OUTPUT"
            else
              RECIPES=$(echo "$CHANGED" | while read -r f; do
                [ -f "$f" ] && basename "$f" .toml
              done | sort -u | jq -R . | jq -sc .)
              echo "recipes=${RECIPES}" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-gale:
    needs: discover
    if: needs.discover.outputs.recipes != '[]'
    strategy:
      matrix:
        target:
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-amd64
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Resolve latest gale version
        id: gale-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(gh release view --repo kelp/gale \
            --json tagName --jq '.tagName')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using gale ${VERSION}"

      - name: Cache gale binary
        id: cache-gale
        uses: actions/cache@v4
        with:
          path: gale-bin
          key: gale-${{ steps.gale-version.outputs.version }}-${{ matrix.target.platform }}

      - name: Download gale release binary
        if: steps.cache-gale.outputs.cache-hit != 'true'
        env:
          GALE_VERSION: ${{ steps.gale-version.outputs.version }}
          PLATFORM: ${{ matrix.target.platform }}
        run: |
          mkdir -p gale-bin
          ARCHIVE="gale-${GALE_VERSION}-${PLATFORM}.tar.gz"
          curl -sL -o "/tmp/${ARCHIVE}" \
            "https://github.com/kelp/gale/releases/download/${GALE_VERSION}/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C gale-bin
          mv gale-bin/gale-* gale-bin/gale
          chmod +x gale-bin/gale

      - uses: actions/upload-artifact@v7
        with:
          name: gale-${{ matrix.target.platform }}
          path: gale-bin/gale
          retention-days: 1

  build:
    needs: [discover, build-gale]
    if: needs.discover.outputs.recipes != '[]'
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        recipe: ${{ fromJson(needs.discover.outputs.recipes) }}
        target:
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-amd64
    runs-on: ${{ matrix.target.os }}
    env:
      RECIPE_NAME: ${{ matrix.recipe }}
      PLATFORM: ${{ matrix.target.platform }}
      GHCR_REPO: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: gale-${{ matrix.target.platform }}
          path: gale-bin

      - name: Install gale
        run: |
          chmod +x gale-bin/gale
          echo "${GITHUB_WORKSPACE}/gale-bin" \
            >> "$GITHUB_PATH"

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gale/pkg
            ~/.gale/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/.cache/pip
            ~/Library/Caches/pip
            ~/.npm
          key: deps-${{ matrix.target.platform }}-${{ hashFiles('recipes/**/*.toml') }}
          restore-keys: |
            deps-${{ matrix.target.platform }}-

      - name: Find recipe file
        id: recipe
        run: |
          LETTER="${RECIPE_NAME:0:1}"
          FILE="recipes/${LETTER}/${RECIPE_NAME}.toml"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Build recipe
        id: build
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          OUTPUT=$(gale build "$RECIPE_FILE" \
            2>&1 | tee /tmp/build.log)
          ARCHIVE=$(echo "$OUTPUT" | grep '^archive:' \
            | awk '{print $2}')
          SHA=$(echo "$OUTPUT" | grep '^sha256:' \
            | awk '{print $2}')
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

          if [ -z "$ARCHIVE" ]; then
            echo "::error::Build produced no archive"
            echo "--- build log ---"
            cat /tmp/build.log || true
            exit 1
          fi

      - name: Verify binary runs
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          VERIFY_DIR=$(mktemp -d)
          tar --zstd -xf "${ARCHIVE}" -C "${VERIFY_DIR}"

          # Find an executable to test.
          BIN=""

          # 1. Try bin/<recipe-name> or sbin/<recipe-name>.
          for dir in bin sbin; do
            if [ -x "${VERIFY_DIR}/${dir}/${RECIPE_NAME}" ]; then
              BIN="${VERIFY_DIR}/${dir}/${RECIPE_NAME}"
              break
            fi
          done

          # 2. Fall back to first executable in bin/ or sbin/.
          if [ -z "$BIN" ]; then
            for dir in bin sbin; do
              for f in "${VERIFY_DIR}/${dir}/"*; do
                if [ -x "$f" ] && [ ! -d "$f" ]; then
                  BIN="$f"
                  break 2
                fi
              done
            done
          fi

          # 3. Library recipes: no binaries, but lib/ or
          #    include/ contain installed files.
          if [ -z "$BIN" ]; then
            LIB_COUNT=0
            for dir in lib include; do
              if [ -d "${VERIFY_DIR}/${dir}" ]; then
                COUNT=$(find "${VERIFY_DIR}/${dir}" \
                  -type f 2>/dev/null | wc -l)
                LIB_COUNT=$((LIB_COUNT + COUNT))
              fi
            done
            if [ "$LIB_COUNT" -gt 0 ]; then
              echo "Library recipe: ${LIB_COUNT} files" \
                "in lib/ and/or include/"
              echo "Verified: library install produced output"
              rm -rf "$VERIFY_DIR"
              exit 0
            fi
            echo "::error::No executables or library files"
            ls -laR "$VERIFY_DIR" 2>/dev/null | head -40
            exit 1
          fi

          echo "Testing: $(basename "$BIN")"

          # Set up library paths so scripts can find
          # their modules when run outside the prefix.
          export PERL5LIB="${VERIFY_DIR}/share:${PERL5LIB}"
          export PYTHONPATH="${VERIFY_DIR}/lib:${PYTHONPATH}"
          export PATH="${VERIFY_DIR}/bin:${PATH}"

          "$BIN" --version \
            || "$BIN" version \
            || "$BIN" --help \
            || "$BIN" -V \
            || "$BIN" -v \
            || {
              # If execution fails, check if it's a script
              # (not a compiled binary). Scripts may need
              # their full install tree to run. Verify it
              # exists and is executable instead.
              if file "$BIN" | grep -qiE "text|script"; then
                echo "Script binary, cannot run outside" \
                  "install prefix"
                echo "Verified: $(basename "$BIN") exists" \
                  "and is executable"
                rm -rf "$VERIFY_DIR"
                exit 0
              fi
              # Some binaries (e.g. mandoc) don't support
              # any standard version/help flags but still
              # ran and printed usage. A valid executable
              # that produced output is good enough.
              if file "$BIN" | grep -qiE "executable|Mach-O|ELF"; then
                echo "Binary ran but has no version/help flag"
                echo "Verified: $(basename "$BIN") is a" \
                  "valid executable"
                rm -rf "$VERIFY_DIR"
                exit 0
              fi
              echo "::error::Binary failed to run"
              exit 1
            }
          echo "Verified: $(basename "$BIN") runs"
          rm -rf "$VERIFY_DIR"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.recipe }}-${{ matrix.target.platform }}
          path: /tmp/build.log
          retention-days: 7

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build.outputs.archive }}

      - uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | \
            oras login ghcr.io --password-stdin -u github

      - name: Push to GHCR
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          VERSION=$(grep '^version' "$RECIPE_FILE" | \
            head -1 | sed 's/.*= *"//' | sed 's/".*//')
          TAG="${VERSION}-${PLATFORM}"
          oras push --disable-path-validation \
            --annotation "org.opencontainers.image.source=${REPO_URL}" \
            "${GHCR_REPO}/${RECIPE_NAME}:${TAG}" \
            "${ARCHIVE}:application/vnd.oci.image.layer.v1.tar+zstd"

      - name: Save build metadata
        env:
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          mkdir -p /tmp/metadata
          cat > "/tmp/metadata/${RECIPE_NAME}-${PLATFORM}.json" <<ENDJSON
          {
            "recipe": "${RECIPE_NAME}",
            "platform": "${PLATFORM}",
            "sha256": "${SHA256}"
          }
          ENDJSON

      - uses: actions/upload-artifact@v7
        with:
          name: metadata-${{ matrix.recipe }}-${{ matrix.target.platform }}
          path: /tmp/metadata/

  update-recipes:
    needs: [discover, build]
    if: >-
      always() && !cancelled()
      && github.event_name != 'pull_request'
      && needs.discover.outputs.recipes != '[]'
      && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/metadata
          pattern: metadata-*
          merge-multiple: true

      - name: Write .binaries.toml files
        run: |
          shopt -s nullglob

          # Group metadata by recipe name.
          declare -A RECIPE_META
          for META in /tmp/metadata/*.json; do
            RECIPE=$(jq -r '.recipe' "$META")
            RECIPE_META[$RECIPE]+=" $META"
          done

          for RECIPE in "${!RECIPE_META[@]}"; do
            LETTER="${RECIPE:0:1}"
            RECIPE_FILE="recipes/${LETTER}/${RECIPE}.toml"
            BINARIES_FILE="recipes/${LETTER}/${RECIPE}.binaries.toml"

            # Get version from recipe.
            VERSION=$(grep '^version' "$RECIPE_FILE" | \
              head -1 | sed 's/.*= *"//' | sed 's/".*//')

            # Build .binaries.toml with version + platform sha256 entries.
            printf 'version = "%s"\n' "$VERSION" > "$BINARIES_FILE"

            for META in ${RECIPE_META[$RECIPE]}; do
              PLATFORM=$(jq -r '.platform' "$META")
              SHA256=$(jq -r '.sha256' "$META")
              printf '\n[%s]\nsha256 = "%s"\n' \
                "$PLATFORM" "$SHA256" >> "$BINARIES_FILE"
            done

            echo "Wrote ${BINARIES_FILE}"
          done

      - name: Set up Go for signing
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Sign recipes
        env:
          RECIPE_SIGNING_KEY: ${{ secrets.RECIPE_SIGNING_KEY }}
        run: |
          if [ -n "$RECIPE_SIGNING_KEY" ]; then
            bash scripts/sign-recipes.sh
          else
            echo "RECIPE_SIGNING_KEY not set, skipping signing"
          fi

      # GITHUB_TOKEN commits don't re-trigger workflows.
      # Switching to a PAT or App token would cause a
      # rebuild loop — add commit-message filtering first.
      - name: Commit .binaries.toml files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Collect new and modified .binaries.toml files.
          CHANGED=$(git diff --name-only -- 'recipes/**/*.binaries.toml' 'recipes/**/*.sig' || true)
          UNTRACKED=$(git ls-files --others --exclude-standard -- 'recipes/**/*.binaries.toml' 'recipes/**/*.sig' || true)
          FILES=$(printf '%s\n%s' "$CHANGED" "$UNTRACKED" | sort -u | grep . || true)

          if [ -z "$FILES" ]; then
            echo "No changes to commit"
            exit 0
          fi

          # Build additions array from changed files.
          ADDITIONS="[]"
          while IFS= read -r FILE; do
            ADDITIONS=$(jq -n \
              --argjson arr "$ADDITIONS" \
              --arg path "$FILE" \
              --arg contents "$(base64 -w0 < "$FILE")" \
              '$arr + [{"path":$path,"contents":$contents}]')
          done <<< "$FILES"

          # Get current HEAD for optimistic lock.
          HEAD_OID=$(gh api graphql -f query='
            query($owner:String!,$name:String!) {
              repository(owner:$owner,name:$name) {
                ref(qualifiedName:"refs/heads/main") {
                  target { oid }
                }
              }
            }' -f owner="${REPO%/*}" \
               -f name="${REPO#*/}" \
               --jq '.data.repository.ref.target.oid')

          # Commit via GraphQL (auto-signed "Verified").
          QUERY='mutation($input:CreateCommitOnBranchInput!) {
            createCommitOnBranch(input:$input) {
              commit { oid url }
            }
          }'
          gh api graphql --input <(jq -n \
            --arg query "$QUERY" \
            --arg repo "$REPO" \
            --arg oid "$HEAD_OID" \
            --argjson adds "$ADDITIONS" \
            '{
              query: $query,
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: "main"
                  },
                  message: {
                    headline: "Update .binaries.toml from build"
                  },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: $adds }
                }
              }
            }')
