name: Build Recipes

on:
  push:
    branches: [main]
    paths: ['recipes/**']
  pull_request:
    paths: ['recipes/**']
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe names, comma-separated (blank = changed only)'
        required: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  # Lets update-recipes dispatch Publish Pages after a
  # .binaries.toml commit lands — the GITHUB_TOKEN-authored
  # commit won't fire workflow_run / push triggers on its own.
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.list.outputs.recipes }}
      gale_version: ${{ steps.gale.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Read the canonical gale version from its own recipe
      # so bumping recipes/g/gale.toml is enough to drag the
      # CI build toolchain forward. No hand-edited pin in
      # this workflow to drift.
      - name: Resolve gale version from recipe
        id: gale
        run: |
          VERSION=$(awk -F'"' '/^version[[:space:]]*=/ {print $2; exit}' \
            recipes/g/gale.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from recipes/g/gale.toml" >&2
            exit 1
          fi
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using gale v${VERSION} for CI build"

      - name: List recipes to build
        id: list
        env:
          INPUT_RECIPE: ${{ inputs.recipe }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$INPUT_RECIPE" ]; then
            # Support comma-separated recipe names.
            IFS=',' read -ra NAMES <<< "$INPUT_RECIPE"
            RECIPES=$(for name in "${NAMES[@]}"; do
              name="${name## }"; name="${name%% }"
              LETTER="${name:0:1}"
              FILE="recipes/${LETTER}/${name}.toml"
              if [ ! -f "$FILE" ]; then
                echo "::error::Recipe not found: $FILE" >&2
                exit 1
              fi
              echo "$name"
            done | jq -R . | jq -sc .)
            echo "recipes=${RECIPES}" >> "$GITHUB_OUTPUT"

          else
            # Detect only changed recipes for push/PR.
            if [ "$EVENT_NAME" = "pull_request" ]; then
              CHANGED=$(git diff --name-only \
                "origin/${PR_BASE_REF}...HEAD" \
                -- 'recipes/**/*.toml' \
                | grep -v '\.binaries\.toml$' || true)
            else
              NULL_SHA="0000000000000000000000000000000000000000"
              if [ "$BEFORE_SHA" = "$NULL_SHA" ] || \
                 [ -z "$BEFORE_SHA" ]; then
                CHANGED=$(find recipes -name '*.toml' \
                  ! -name '*.binaries.toml')
              else
                if ! CHANGED=$(git diff --name-only \
                  "$BEFORE_SHA" "$CURRENT_SHA" \
                  -- 'recipes/**/*.toml' 2>/dev/null); then
                  CHANGED=$(find recipes -name '*.toml' \
                    ! -name '*.binaries.toml')
                else
                  CHANGED=$(echo "$CHANGED" \
                    | grep -v '\.binaries\.toml$' || true)
                fi
              fi
            fi

            if [ -z "$CHANGED" ]; then
              echo "No recipe files changed"
              echo "recipes=[]" >> "$GITHUB_OUTPUT"
            else
              # Names from changed files.
              NAMES=$(echo "$CHANGED" | while read -r f; do
                [ -f "$f" ] && basename "$f" .toml
              done | sort -u)
              # Expand to include transitive dependents.
              # A revision bump on X must also rebuild
              # anything that depends on X, so CI publishes
              # fresh prebuilts for the whole cascade.
              EXPANDED=$(echo "$NAMES" | \
                python3 scripts/expand_changed.py)
              RECIPES=$(echo "$EXPANDED" | jq -R . | jq -sc .)
              echo "recipes=${RECIPES}" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-gale:
    needs: discover
    if: needs.discover.outputs.recipes != '[]'
    strategy:
      matrix:
        target:
          - os: macos-26
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.target.os }}
    env:
      GALE_VERSION: ${{ needs.discover.outputs.gale_version }}
    steps:
      - name: Use resolved gale version
        run: echo "Using gale ${GALE_VERSION}"

      - name: Cache gale binary
        id: cache-gale
        uses: actions/cache@v5
        with:
          path: gale-bin
          key: gale-${{ env.GALE_VERSION }}-${{ matrix.target.platform }}

      - name: Download gale release binary
        if: steps.cache-gale.outputs.cache-hit != 'true'
        env:
          PLATFORM: ${{ matrix.target.platform }}
        run: |
          mkdir -p gale-bin
          ARCHIVE="gale-${GALE_VERSION}-${PLATFORM}.tar.gz"
          curl -sL -o "/tmp/${ARCHIVE}" \
            "https://github.com/kelp/gale/releases/download/${GALE_VERSION}/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C gale-bin
          mv gale-bin/gale-* gale-bin/gale
          chmod +x gale-bin/gale

      - uses: actions/upload-artifact@v7
        with:
          name: gale-${{ matrix.target.platform }}
          path: gale-bin/gale
          retention-days: 1

  build:
    needs: [discover, build-gale]
    if: needs.discover.outputs.recipes != '[]'
    timeout-minutes: 180
    concurrency:
      group: build-${{ matrix.recipe }}-${{ matrix.target.platform }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        recipe: ${{ fromJson(needs.discover.outputs.recipes) }}
        target:
          - os: macos-26
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.target.os }}
    env:
      RECIPE_NAME: ${{ matrix.recipe }}
      PLATFORM: ${{ matrix.target.platform }}
      GHCR_REPO: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: gale-${{ matrix.target.platform }}
          path: gale-bin

      - name: Install gale
        run: |
          chmod +x gale-bin/gale
          echo "${GITHUB_WORKSPACE}/gale-bin" \
            >> "$GITHUB_PATH"

      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y patchelf

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gale/pkg
            ~/.gale/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/.cache/pip
            ~/Library/Caches/pip
            ~/.npm
          key: deps-${{ matrix.target.platform }}-${{ hashFiles('recipes/**/*.toml') }}
          restore-keys: |
            deps-${{ matrix.target.platform }}-

      - name: Find recipe file
        id: recipe
        run: |
          LETTER="${RECIPE_NAME:0:1}"
          FILE="recipes/${LETTER}/${RECIPE_NAME}.toml"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Build recipe
        id: build
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          SKIPPED=false

          for attempt in 1 2 3; do
            OUTPUT=$(gale build "$RECIPE_FILE" \
              2>&1 | tee /tmp/build.log)
            ARCHIVE=$(echo "$OUTPUT" | grep '^archive:' \
              | awk '{print $2}')
            SHA=$(echo "$OUTPUT" | grep '^sha256:' \
              | awk '{print $2}')

            if [ -n "$ARCHIVE" ]; then
              break
            fi

            if grep -q 'unsupported platform' /tmp/build.log; then
              echo "::notice::Skipping unsupported platform ${PLATFORM} for ${RECIPE_NAME}"
              SKIPPED=true
              break
            fi

            echo "::warning::Build attempt $attempt failed, retrying..."
            sleep $((attempt * 10))
          done

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"

          if [ "$SKIPPED" = true ]; then
            exit 0
          fi

          if [ -z "$ARCHIVE" ]; then
            echo "::error::Build failed after 3 attempts"
            echo "--- build log ---"
            cat /tmp/build.log || true
            exit 1
          fi

      - name: Verify binary runs
        if: steps.build.outputs.skipped != 'true'
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          VERIFY_DIR=$(mktemp -d)
          tar --zstd -xf "${ARCHIVE}" -C "${VERIFY_DIR}"

          # Find an executable to test.
          BIN=""

          # 1. Try bin/<recipe-name> or sbin/<recipe-name>.
          for dir in bin sbin; do
            if [ -x "${VERIFY_DIR}/${dir}/${RECIPE_NAME}" ]; then
              BIN="${VERIFY_DIR}/${dir}/${RECIPE_NAME}"
              break
            fi
          done

          # 2. Fall back to first executable in bin/ or sbin/.
          if [ -z "$BIN" ]; then
            for dir in bin sbin; do
              for f in "${VERIFY_DIR}/${dir}/"*; do
                if [ -x "$f" ] && [ ! -d "$f" ]; then
                  BIN="$f"
                  break 2
                fi
              done
            done
          fi

          # 3. Library recipes: no binaries, but lib/ or
          #    include/ contain installed files.
          if [ -z "$BIN" ]; then
            LIB_COUNT=0
            for dir in lib include; do
              if [ -d "${VERIFY_DIR}/${dir}" ]; then
                COUNT=$(find "${VERIFY_DIR}/${dir}" \
                  -type f 2>/dev/null | wc -l)
                LIB_COUNT=$((LIB_COUNT + COUNT))
              fi
            done
            if [ "$LIB_COUNT" -gt 0 ]; then
              echo "Library recipe: ${LIB_COUNT} files" \
                "in lib/ and/or include/"
              echo "Verified: library install produced output"
              rm -rf "$VERIFY_DIR"
              exit 0
            fi
            echo "::error::No executables or library files"
            ls -laR "$VERIFY_DIR" 2>/dev/null | head -40
            exit 1
          fi

          echo "Testing: $(basename "$BIN")"

          # Set up library paths so scripts can find
          # their modules when run outside the prefix.
          export PERL5LIB="${VERIFY_DIR}/share:${PERL5LIB}"
          for sp in "${VERIFY_DIR}"/lib/python*/site-packages; do
            [ -d "$sp" ] && PYTHONPATH="${sp}:${PYTHONPATH}"
          done
          for sp in "${VERIFY_DIR}"/lib/*/lib/python*/site-packages; do
            [ -d "$sp" ] && PYTHONPATH="${sp}:${PYTHONPATH}"
          done
          export PYTHONPATH="${VERIFY_DIR}/lib:${PYTHONPATH}"
          export PATH="${VERIFY_DIR}/bin:${PATH}"

          # Probe each flag individually so we can tell
          # "flag not recognized" (normal nonzero exit)
          # apart from "binary crashed before running"
          # (killed by signal — bash reports 128+N, e.g.
          # 134 for SIGABRT from a dyld "Library not
          # loaded" failure). The old `|| ... || {fallback}`
          # chain collapsed both cases together, so a
          # crashing Mach-O still matched the `file` test
          # and was waved through as "valid executable".
          PROBE_OK=0
          KILLED_BY_SIGNAL=0
          for args in --version version --help -V -v; do
            "$BIN" "$args" && PROBE_OK=1 && break
            rc=$?
            [ $rc -ge 128 ] && KILLED_BY_SIGNAL=1
          done

          if [ "$PROBE_OK" = 0 ] && \
             [ "$KILLED_BY_SIGNAL" = 1 ]; then
            echo "::error::$(basename "$BIN") was killed" \
              "by a signal (likely dyld could not load a" \
              "required library). Diagnostic:"
            "$BIN" --version 2>&1 | head -20 || true
            exit 1
          fi

          if [ "$PROBE_OK" = 0 ]; then
            # All probes exited nonzero but gracefully —
            # the binary launched and rejected each flag.
            if file "$BIN" | grep -qiE "text|script"; then
              echo "Script binary, cannot run outside" \
                "install prefix"
              echo "Verified: $(basename "$BIN") exists" \
                "and is executable"
              rm -rf "$VERIFY_DIR"
              exit 0
            fi
            # Some binaries (e.g. mandoc) don't support
            # any standard version/help flags but still
            # ran and printed usage. A valid executable
            # that produced output is good enough.
            if file "$BIN" | grep -qiE "executable|Mach-O|ELF"; then
              echo "Binary ran but has no version/help flag"
              echo "Verified: $(basename "$BIN") is a" \
                "valid executable"
              rm -rf "$VERIFY_DIR"
              exit 0
            fi
            echo "::error::Binary failed to run"
            exit 1
          fi

          echo "Verified: $(basename "$BIN") runs"
          rm -rf "$VERIFY_DIR"

      - name: Check install (rpath vs runtime deps)
        if: steps.build.outputs.skipped != 'true'
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          CHECK_DIR=$(mktemp -d)
          tar --zstd -xf "${ARCHIVE}" -C "${CHECK_DIR}"
          python3 scripts/check_install.py \
            --recipe "${RECIPE_FILE}" \
            --prefix "${CHECK_DIR}"
          rm -rf "${CHECK_DIR}"

      - name: Install and smoke test
        if: steps.build.outputs.skipped != 'true'
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          # Only install + smoke if the recipe defines a
          # [smoke] section. python -c is the cheapest probe.
          HAS_SMOKE=$(python3 -c "
          import sys, tomllib
          with open('${RECIPE_FILE}', 'rb') as f:
              r = tomllib.load(f)
          sys.exit(0 if r.get('smoke', {}).get('commands') else 1)
          " && echo yes || echo no)

          if [ "$HAS_SMOKE" != "yes" ]; then
            echo "No [smoke] section; skipping"
            exit 0
          fi

          # Smoke runs against the regular install to catch
          # functional regressions (e.g. a remote helper that
          # crashes on real HTTPS). The missing-runtime-dep
          # class is caught separately by check_install.py;
          # a fresh-HOME test here would require a local
          # --archive install mode in gale that doesn't
          # exist yet.
          gale install "${RECIPE_NAME}" \
            --recipe "${RECIPE_FILE}"
          python3 scripts/run_smoke.py \
            --recipe "${RECIPE_FILE}"

      - name: Upload build log on failure
        if: failure() && steps.build.outputs.skipped != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.recipe }}-${{ matrix.target.platform }}
          path: /tmp/build.log
          retention-days: 7

      - name: Attest build provenance
        if: steps.build.outputs.skipped != 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build.outputs.archive }}

      - uses: oras-project/setup-oras@v2
        if: steps.build.outputs.skipped != 'true'

      - name: Login to GHCR
        if: steps.build.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | \
            oras login ghcr.io --password-stdin -u github

      - name: Push to GHCR
        if: steps.build.outputs.skipped != 'true'
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          VERSION=$(grep '^version' "$RECIPE_FILE" | \
            head -1 | sed 's/.*= *"//' | sed 's/".*//')
          TAG="${VERSION}-${PLATFORM}"
          oras push --disable-path-validation \
            --annotation "org.opencontainers.image.source=${REPO_URL}" \
            "${GHCR_REPO}/${RECIPE_NAME}:${TAG}" \
            "${ARCHIVE}:application/vnd.oci.image.layer.v1.tar+zstd"

      - name: Save build metadata
        if: steps.build.outputs.skipped != 'true'
        env:
          SHA256: ${{ steps.build.outputs.sha256 }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          mkdir -p /tmp/metadata

          # C4: extract the archive's .gale-deps.toml (written by
          # gale build) so the resolved dep closure can be baked
          # into .binaries.toml. Builds with no declared deps
          # produce no file; write an empty deps list in that
          # case. gale's .binaries.toml parser tolerates missing
          # or empty `deps`, so this is safe to include
          # unconditionally.
          DEPS_JSON="[]"
          EXTRACT_DIR=$(mktemp -d)
          if tar --zstd -xf "${ARCHIVE}" -C "${EXTRACT_DIR}" .gale-deps.toml 2>/dev/null; then
            DEPS_JSON=$(python3 - "${EXTRACT_DIR}/.gale-deps.toml" <<'PY'
          import json, sys, tomllib
          with open(sys.argv[1], "rb") as f:
              data = tomllib.load(f)
          out = []
          for dep in data.get("deps", []):
              out.append({
                  "name": dep.get("name", ""),
                  "version": dep.get("version", ""),
                  "revision": int(dep.get("revision", 1) or 1),
              })
          print(json.dumps(out))
          PY
          )
          fi
          rm -rf "${EXTRACT_DIR}"

          # jq --argjson parses the deps list as JSON (not a
          # string) so the resulting document has a real array,
          # not a quoted blob.
          jq -n \
            --arg recipe "${RECIPE_NAME}" \
            --arg platform "${PLATFORM}" \
            --arg sha256 "${SHA256}" \
            --argjson deps "${DEPS_JSON}" \
            '{recipe: $recipe, platform: $platform, sha256: $sha256, deps: $deps}' \
            > "/tmp/metadata/${RECIPE_NAME}-${PLATFORM}.json"

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.skipped != 'true'
        with:
          name: metadata-${{ matrix.recipe }}-${{ matrix.target.platform }}
          path: /tmp/metadata/

  update-recipes:
    needs: [discover, build]
    if: >-
      always() && !cancelled()
      && github.event_name != 'pull_request'
      && needs.discover.outputs.recipes != '[]'
      && needs.build.result != 'skipped'
    # Serialize across every trigger that can reach this
    # job (push to main, workflow_dispatch). The per-matrix
    # `build` concurrency above is unrelated — it scopes to
    # one recipe+platform and cancels in progress. Here we
    # must queue, not cancel: dropping a run would lose the
    # .versions / .binaries.toml writes it was going to do.
    # The GraphQL commit below already uses expectedHeadOid
    # as an optimistic lock, but without serialization the
    # loser's writes (including a non-transactional
    # `printf >> .versions` in its working tree) are simply
    # discarded. Group on a fixed key since we only commit
    # to `main`.
    concurrency:
      group: update-recipes-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/metadata
          pattern: metadata-*
          merge-multiple: true

      - name: Write .binaries.toml files
        run: |
          shopt -s nullglob

          # Matrix has darwin-arm64, linux-amd64, linux-arm64.
          # A recipe's .binaries.toml is only rewritten when
          # metadata from every eligible platform landed — a
          # per-recipe gate, not a batch-level one.
          # Partial-success cases (one platform fails, others
          # succeed) would otherwise overwrite the file and
          # drop the previously-good shas for the platforms
          # that didn't build this run. Eligible platforms
          # come from the recipe's [package].platforms
          # declaration when set (intersected with the CI
          # matrix), else the full CI matrix — so linux-only
          # or macOS-only recipes update their .binaries.toml
          # as soon as every declared target builds.

          # Group metadata by recipe name.
          declare -A RECIPE_META
          for META in /tmp/metadata/*.json; do
            RECIPE=$(jq -r '.recipe' "$META")
            RECIPE_META[$RECIPE]+=" $META"
          done

          for RECIPE in "${!RECIPE_META[@]}"; do
            LETTER="${RECIPE:0:1}"
            RECIPE_FILE="recipes/${LETTER}/${RECIPE}.toml"
            BINARIES_FILE="recipes/${LETTER}/${RECIPE}.binaries.toml"

            # Eligible platforms for this recipe: intersection
            # of the CI matrix and the recipe's declared
            # platforms. Falls back to the full matrix when
            # the recipe declares none.
            EXPECTED_PLATFORMS=$(python3 - "$RECIPE_FILE" <<'PY'
          import sys, tomllib
          CI = {"darwin-arm64", "linux-amd64", "linux-arm64"}
          with open(sys.argv[1], "rb") as f:
              data = tomllib.load(f)
          declared = data.get("package", {}).get("platforms")
          if isinstance(declared, list):
              eligible = {p for p in declared if p in CI}
              print(len(eligible) or len(CI))
          else:
              print(len(CI))
          PY
          )

            # Count platforms that produced metadata.
            PLATFORM_COUNT=$(echo "${RECIPE_META[$RECIPE]}" | wc -w | tr -d ' ')
            if [ "$PLATFORM_COUNT" -lt "$EXPECTED_PLATFORMS" ]; then
              echo "::warning::Skipping ${RECIPE}: ${PLATFORM_COUNT}/${EXPECTED_PLATFORMS} platforms built; keeping existing ${BINARIES_FILE}"
              continue
            fi

            # Get version from recipe.
            VERSION=$(grep '^version' "$RECIPE_FILE" | \
              head -1 | sed 's/.*= *"//' | sed 's/".*//')

            # Build .binaries.toml with version + platform sha256 entries.
            printf 'version = "%s"\n' "$VERSION" > "$BINARIES_FILE"

            for META in ${RECIPE_META[$RECIPE]}; do
              PLATFORM=$(jq -r '.platform' "$META")
              SHA256=$(jq -r '.sha256' "$META")
              printf '\n[%s]\nsha256 = "%s"\n' \
                "$PLATFORM" "$SHA256" >> "$BINARIES_FILE"

              # C4: surface the resolved dep closure recorded at
              # build time (captured from the archive's
              # .gale-deps.toml in "Save build metadata"). Purely
              # informational at install time — the archive's own
              # .gale-deps.toml stays authoritative — but baking
              # the closure into the registry lets `gale info` and
              # audit tooling inspect it without fetching the
              # tarball. Empty list is omitted to keep diffs
              # quiet for zero-dep recipes.
              DEP_COUNT=$(jq '.deps | length' "$META")
              if [ "$DEP_COUNT" -gt 0 ]; then
                printf 'deps = [\n' >> "$BINARIES_FILE"
                jq -r '.deps[] | "  { name = \"\(.name)\", version = \"\(.version)\", revision = \(.revision) },"' \
                  "$META" >> "$BINARIES_FILE"
                printf ']\n' >> "$BINARIES_FILE"
              fi
            done

            echo "Wrote ${BINARIES_FILE}"
          done

      # Append `.versions` entries for every build. The entry
      # key is the bare version for revision 1 and
      # `<version>-<revision>` for revision > 1, so gale's
      # registry resolver can find the prebuilt via an explicit
      # revision request (gale install foo@1.2.3-2). The file
      # is the canonical history rendered on the status page,
      # so we append on every version or revision bump.
      - name: Update .versions with build entries
        run: |
          shopt -s nullglob
          RECIPES=$(for META in /tmp/metadata/*.json; do
            jq -r '.recipe' "$META"
          done | sort -u)

          for RECIPE in $RECIPES; do
            LETTER="${RECIPE:0:1}"
            RECIPE_FILE="recipes/${LETTER}/${RECIPE}.toml"
            VERSIONS_FILE="recipes/${LETTER}/${RECIPE}.versions"

            VERSION=$(grep '^version' "$RECIPE_FILE" | \
              head -1 | sed 's/.*= *"//; s/".*//')
            REVISION=$(grep '^revision' "$RECIPE_FILE" | \
              head -1 | sed 's/.*= *//; s/[^0-9].*//')

            if [ -z "$REVISION" ] || \
               [ "$REVISION" -lt 1 ] 2>/dev/null; then
              REVISION=1
            fi

            if [ "$REVISION" -le 1 ]; then
              ENTRY_KEY="${VERSION}"
            else
              ENTRY_KEY="${VERSION}-${REVISION}"
            fi

            if [ -f "$VERSIONS_FILE" ] && \
               grep -q "^${ENTRY_KEY} " "$VERSIONS_FILE"; then
              echo "${ENTRY_KEY} already in ${VERSIONS_FILE}"
              continue
            fi

            # Ensure the file ends with a newline before
            # appending so we don't glom onto the last line.
            if [ -f "$VERSIONS_FILE" ] && \
               [ -s "$VERSIONS_FILE" ] && \
               [ -n "$(tail -c1 "$VERSIONS_FILE")" ]; then
              printf '\n' >> "$VERSIONS_FILE"
            fi
            printf '%s %s\n' "$ENTRY_KEY" "$GITHUB_SHA" \
              >> "$VERSIONS_FILE"
            echo "Appended ${ENTRY_KEY} to ${VERSIONS_FILE}"
          done

      # GITHUB_TOKEN commits don't re-trigger workflows.
      # Switching to a PAT or App token would cause a
      # rebuild loop — add commit-message filtering first.
      - name: Commit .binaries.toml files
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Collect new and modified .binaries.toml and .versions
          # files. .versions is updated in the step above when a
          # recipe ships at revision > 1.
          CHANGED=$(git diff --name-only -- 'recipes/**/*.binaries.toml' 'recipes/**/*.versions' || true)
          UNTRACKED=$(git ls-files --others --exclude-standard -- 'recipes/**/*.binaries.toml' 'recipes/**/*.versions' || true)
          FILES=$(printf '%s\n%s' "$CHANGED" "$UNTRACKED" | sort -u | grep . || true)

          if [ -z "$FILES" ]; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build additions array from changed files.
          ADDITIONS="[]"
          while IFS= read -r FILE; do
            ADDITIONS=$(jq -n \
              --argjson arr "$ADDITIONS" \
              --arg path "$FILE" \
              --arg contents "$(base64 -w0 < "$FILE")" \
              '$arr + [{"path":$path,"contents":$contents}]')
          done <<< "$FILES"

          # Get current HEAD for optimistic lock.
          HEAD_OID=$(gh api graphql -f query='
            query($owner:String!,$name:String!) {
              repository(owner:$owner,name:$name) {
                ref(qualifiedName:"refs/heads/main") {
                  target { oid }
                }
              }
            }' -f owner="${REPO%/*}" \
               -f name="${REPO#*/}" \
               --jq '.data.repository.ref.target.oid')

          # Commit via GraphQL (auto-signed "Verified").
          QUERY='mutation($input:CreateCommitOnBranchInput!) {
            createCommitOnBranch(input:$input) {
              commit { oid url }
            }
          }'
          gh api graphql --input <(jq -n \
            --arg query "$QUERY" \
            --arg repo "$REPO" \
            --arg oid "$HEAD_OID" \
            --argjson adds "$ADDITIONS" \
            '{
              query: $query,
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: "main"
                  },
                  message: {
                    headline: "Update .binaries.toml and .versions from build"
                  },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: $adds }
                }
              }
            }')

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # GitHub's workflow_run trigger is suppressed when the
      # upstream workflow was dispatched with GITHUB_TOKEN
      # (anti-loop safety). push triggers on the just-landed
      # commit are suppressed for the same reason. So Publish
      # Pages has no way to auto-refresh after a CI commit.
      # Dispatch it explicitly, gated on an actual commit to
      # avoid regenerating for no-op runs (no recipes built,
      # or build matrix produced nothing new).
      - name: Regenerate status dashboard
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
