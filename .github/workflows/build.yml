name: Build Recipes

on:
  push:
    branches: [main]
    paths: ['recipes/**']
  pull_request:
    paths: ['recipes/**']
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe name (blank = all)'
        required: false

permissions:
  contents: write
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.list.outputs.recipes }}
    steps:
      - uses: actions/checkout@v5

      - name: List recipes to build
        id: list
        env:
          INPUT_RECIPE: ${{ inputs.recipe }}
        run: |
          if [ -n "$INPUT_RECIPE" ]; then
            LETTER="${INPUT_RECIPE:0:1}"
            FILE="recipes/${LETTER}/${INPUT_RECIPE}.toml"
            if [ ! -f "$FILE" ]; then
              echo "::error::Recipe not found: $FILE"
              exit 1
            fi
            echo "recipes=[\"${INPUT_RECIPE}\"]" \
              >> "$GITHUB_OUTPUT"
          else
            RECIPES=$(find recipes -name '*.toml' \
              -exec basename {} .toml \; | sort | \
              jq -R . | jq -sc .)
            echo "recipes=${RECIPES}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJson(needs.discover.outputs.recipes) }}
        target:
          - os: macos-14
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-amd64
    runs-on: ${{ matrix.target.os }}
    env:
      RECIPE_NAME: ${{ matrix.recipe }}
      PLATFORM: ${{ matrix.target.platform }}
      GHCR_REPO: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: kelp/gale
          path: _gale

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build gale
        run: |
          cd _gale
          go build -o "${RUNNER_TEMP}/gale" ./cmd/gale/
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Find recipe file
        id: recipe
        run: |
          LETTER="${RECIPE_NAME:0:1}"
          FILE="recipes/${LETTER}/${RECIPE_NAME}.toml"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Build recipe
        id: build
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          OUTPUT=$(gale build "$RECIPE_FILE")
          ARCHIVE=$(echo "$OUTPUT" | grep '^archive:' \
            | awk '{print $2}')
          SHA=$(echo "$OUTPUT" | grep '^sha256:' \
            | awk '{print $2}')
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify binary runs
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          VERIFY_DIR=$(mktemp -d)
          tar --zstd -xf "${ARCHIVE}" -C "${VERIFY_DIR}"
          # Look for the package binary by name first,
          # fall back to any executable in bin/.
          BIN="${VERIFY_DIR}/bin/${RECIPE_NAME}"
          if [ ! -x "$BIN" ]; then
            # Try first executable file in bin/.
            for f in "${VERIFY_DIR}/bin/"*; do
              if [ -f "$f" ] && [ -x "$f" ]; then
                BIN="$f"
                break
              fi
            done
          fi
          if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
            echo "::error::No executable found in archive"
            ls -la "$VERIFY_DIR/bin/" 2>/dev/null || \
              echo "No bin/ directory"
            exit 1
          fi
          echo "Testing: $(basename "$BIN")"
          "$BIN" --version || "$BIN" version || "$BIN" --help || "$BIN" -V || {
            echo "::error::Binary failed to run"
            exit 1
          }
          echo "Verified: $(basename "$BIN") runs"
          rm -rf "$VERIFY_DIR"

      - uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | \
            oras login ghcr.io --password-stdin -u github

      - name: Push to GHCR
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          VERSION=$(grep '^version' "$RECIPE_FILE" | \
            head -1 | sed 's/.*= *"//' | sed 's/".*//')
          TAG="${VERSION}-${PLATFORM}"
          oras push --disable-path-validation \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            "${GHCR_REPO}/${RECIPE_NAME}:${TAG}" \
            "${ARCHIVE}:application/vnd.oci.image.layer.v1.tar+zstd"

      - name: Save build metadata
        env:
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          mkdir -p /tmp/metadata
          cat > "/tmp/metadata/${RECIPE_NAME}-${PLATFORM}.json" <<ENDJSON
          {
            "recipe": "${RECIPE_NAME}",
            "platform": "${PLATFORM}",
            "sha256": "${SHA256}"
          }
          ENDJSON

      - uses: actions/upload-artifact@v5
        with:
          name: metadata-${{ matrix.recipe }}-${{ matrix.target.platform }}
          path: /tmp/metadata/

  update-recipes:
    needs: build
    if: always() && !cancelled() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GHCR_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: /tmp/metadata
          pattern: metadata-*
          merge-multiple: true

      - name: Update recipe binary sections
        run: |
          for META in /tmp/metadata/*.json; do
            RECIPE=$(jq -r '.recipe' "$META")
            PLATFORM=$(jq -r '.platform' "$META")
            SHA256=$(jq -r '.sha256' "$META")
            LETTER="${RECIPE:0:1}"
            FILE="recipes/${LETTER}/${RECIPE}.toml"
            VERSION=$(grep '^version' "$FILE" | \
              head -1 | sed 's/.*= *"//' | sed 's/".*//')

            URL="https://ghcr.io/v2/${GHCR_REPO}/${RECIPE}/blobs/sha256:${SHA256}"

            # Remove existing section for this platform.
            sed -i "/^\[binary\.${PLATFORM}\]/,/^$/d" "$FILE"

            # Append new binary section.
            printf '\n[binary.%s]\nurl = "%s"\nsha256 = "%s"\n' \
              "$PLATFORM" "$URL" "$SHA256" >> "$FILE"

            echo "Updated ${FILE} [binary.${PLATFORM}]"
          done

      - name: Commit updated recipes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet recipes/; then
            echo "No changes to commit"
            exit 0
          fi

          # Create commit via GitHub API so it's
          # automatically signed and shows "Verified".
          BRANCH="main"
          BASE_SHA=$(gh api "/repos/${REPO}/git/ref/heads/${BRANCH}" \
            --jq '.object.sha')
          BASE_TREE=$(gh api "/repos/${REPO}/git/commits/${BASE_SHA}" \
            --jq '.tree.sha')

          # Create blobs and build tree entries.
          TREE_JSON="[]"
          for FILE in $(git diff --name-only recipes/); do
            BLOB_SHA=$(gh api "/repos/${REPO}/git/blobs" \
              -f "content=$(base64 < "$FILE")" \
              -f "encoding=base64" \
              --jq '.sha')
            TREE_JSON=$(echo "$TREE_JSON" | jq \
              --arg p "$FILE" --arg s "$BLOB_SHA" \
              '. + [{"path":$p,"mode":"100644","type":"blob","sha":$s}]')
          done

          # Create tree.
          NEW_TREE=$(jq -n \
            --arg bt "$BASE_TREE" \
            --argjson t "$TREE_JSON" \
            '{"base_tree":$bt,"tree":$t}' | \
            gh api "/repos/${REPO}/git/trees" \
              --input - --jq '.sha')

          # Create commit.
          COMMIT=$(jq -n \
            --arg msg "Update binary sections from build" \
            --arg tree "$NEW_TREE" \
            --arg parent "$BASE_SHA" \
            '{"message":$msg,"tree":$tree,"parents":[$parent]}' | \
            gh api "/repos/${REPO}/git/commits" \
              --input - --jq '.sha')

          # Update branch.
          gh api "/repos/${REPO}/git/refs/heads/${BRANCH}" \
            -X PATCH -f "sha=${COMMIT}"

          echo "Committed ${COMMIT}"
