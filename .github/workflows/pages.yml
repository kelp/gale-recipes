name: Publish Pages

on:
  # Refresh the dashboard when the scheduled Auto-Update run
  # finishes (it commits _data/upstream.json with
  # GITHUB_TOKEN, which fires workflow_run from a schedule).
  # Build Recipes is not listed: its runs are
  # GITHUB_TOKEN-dispatched, so they never fire workflow_run.
  workflow_run:
    workflows: ["Auto-Update Recipes"]
    types: [completed]
    branches: [main]
  # Manual regen.
  workflow_dispatch:
  # With one writer, every recipes/** change on main arrives
  # as a human merge push, which fires this event — that is
  # how .binaries.toml updates reach the dashboard. Generator
  # and data tweaks ship the same way.
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - '_data/**'
      - 'scripts/gen_status_page.py'
      - 'scripts/templates/**'
      - '.github/workflows/pages.yml'

# Deploys via actions/deploy-pages (artifact flow), so no
# commits are made to any branch — avoids conflict with
# branch-level "Commits must have verified signatures"
# rules.

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish in flight at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # For workflow_run, github.sha points at the
          # triggering run's commit — but auto-update commits
          # _data/upstream.json afterward, so we explicitly
          # pull latest main.
          ref: main

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      # upstream.json lives on the dashboard-data branch (kept off
      # main so the daily auto-update commit doesn't trip main's
      # required ledger-check). Overlay the live copy onto the main
      # checkout before rendering; main's tracked copy is only a
      # fallback, and the generator tolerates a missing file.
      - name: Overlay dashboard data from dashboard-data branch
        run: |
          if git fetch origin dashboard-data 2>/dev/null; then
            git show origin/dashboard-data:_data/upstream.json \
              > _data/upstream.json 2>/dev/null \
              && echo "overlaid upstream.json from dashboard-data" \
              || echo "dashboard-data has no upstream.json; using main copy"
          else
            echo "dashboard-data branch absent; using main copy"
          fi

      - name: Generate site
        run: python3 scripts/gen_status_page.py --repo-root . --out-dir _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
