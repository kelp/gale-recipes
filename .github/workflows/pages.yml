name: Publish Pages

on:
  # Refresh the dashboard whenever Build Recipes finishes,
  # so .binaries.toml updates are reflected promptly.
  workflow_run:
    workflows: ["Build Recipes"]
    types: [completed]
    branches: [main]
  # Manual regen.
  workflow_dispatch:
  # Ship generator/template tweaks immediately without
  # waiting for a build.
  push:
    branches: [main]
    paths:
      - 'scripts/gen_status_page.py'
      - 'scripts/templates/**'
      - '.github/workflows/pages.yml'

# Deploys via actions/deploy-pages (artifact flow), so no
# commits are made to any branch — avoids conflict with
# branch-level "Commits must have verified signatures"
# rules.

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish in flight at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # For workflow_run, github.sha points at the
          # triggering run's commit — but build.yml commits
          # .binaries.toml updates afterward, so we
          # explicitly pull latest main.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate site
        run: python3 scripts/gen_status_page.py --repo-root . --out-dir _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
