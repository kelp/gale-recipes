name: Reproducibility check

# Build a recipe twice on each platform and diff the
# resulting tar.zst archives. Closes the loop on the
# determinism work in gale (SOURCE_DATE_EPOCH from
# source.released_at, scoped HOME/TMPDIR, deterministic
# touchAll). Manual dispatch only — running on every
# push would double CI minutes for everything.

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe name (e.g. jq, fzf, ripgrep)'
        required: true
        default: 'jq'

permissions:
  contents: read

jobs:
  reproduce:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: macos-26
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.target.os }}
    env:
      RECIPE_NAME: ${{ inputs.recipe }}
      PLATFORM: ${{ matrix.target.platform }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Resolve gale version from recipes/g/gale.toml
        id: gale-version
        run: |
          VERSION=$(awk -F'"' '/^version *=/ {print $2; exit}' \
            recipes/g/gale.toml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using gale ${VERSION}"

      - name: Download gale release binary
        env:
          GALE_VERSION: ${{ steps.gale-version.outputs.version }}
        run: |
          mkdir -p gale-bin
          ARCHIVE="gale-${GALE_VERSION}-${PLATFORM}.tar.gz"
          curl -sL -o "/tmp/${ARCHIVE}" \
            "https://github.com/kelp/gale/releases/download/${GALE_VERSION}/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C gale-bin
          mv gale-bin/gale-* gale-bin/gale
          chmod +x gale-bin/gale
          echo "${GITHUB_WORKSPACE}/gale-bin" >> "$GITHUB_PATH"

      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y patchelf

      - name: Find recipe file
        id: recipe
        run: |
          LETTER="${RECIPE_NAME:0:1}"
          FILE="recipes/${LETTER}/${RECIPE_NAME}.toml"
          if [ ! -f "$FILE" ]; then
            echo "::error::Recipe not found: ${FILE}"
            exit 1
          fi
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      # Manual-only workflow keeps its skip semantics, but the
      # decision comes from the recipe's [package].platforms
      # declaration, not from grepping build-log text.
      - name: Check platform eligibility
        id: eligible
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          SKIP=$(python3 - "$RECIPE_FILE" <<'PY'
          import os, sys, tomllib
          with open(sys.argv[1], "rb") as f:
              data = tomllib.load(f)
          declared = data.get("package", {}).get("platforms")
          platform = os.environ["PLATFORM"]
          ineligible = (
              isinstance(declared, list) and platform not in declared
          )
          print("true" if ineligible else "false")
          PY
          )
          if [ "$SKIP" = "true" ]; then
            echo "::notice::Recipe ${RECIPE_NAME} doesn't declare ${PLATFORM}; skipping"
          fi
          echo "skipped=${SKIP}" >> "$GITHUB_OUTPUT"

      - name: Build recipe (first run)
        if: steps.eligible.outputs.skipped != 'true'
        id: build1
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          OUTPUT=$(gale build "$RECIPE_FILE" 2>&1 | tee /tmp/build1.log)
          ARCHIVE=$(echo "$OUTPUT" | grep '^archive:' | awk '{print $2}')
          SHA=$(echo "$OUTPUT" | grep '^sha256:' | awk '{print $2}')
          if [ -z "$ARCHIVE" ] || [ -z "$SHA" ]; then
            echo "::error::First build failed"
            cat /tmp/build1.log
            exit 1
          fi
          cp "$ARCHIVE" /tmp/build1.tar.zst
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "First build sha256: ${SHA}"

      - name: Reset transient build state
        if: steps.eligible.outputs.skipped != 'true'
        run: |
          # Wipe the produced archive and any per-build tmpdirs
          # so the second run rebuilds from scratch. Source-tarball
          # cache stays — the determinism check is on the build,
          # not the network fetch.
          rm -rf ~/.gale/tmp || true

      - name: Build recipe (second run)
        if: steps.eligible.outputs.skipped != 'true'
        id: build2
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          OUTPUT=$(gale build "$RECIPE_FILE" 2>&1 | tee /tmp/build2.log)
          ARCHIVE=$(echo "$OUTPUT" | grep '^archive:' | awk '{print $2}')
          SHA=$(echo "$OUTPUT" | grep '^sha256:' | awk '{print $2}')
          if [ -z "$ARCHIVE" ] || [ -z "$SHA" ]; then
            echo "::error::Second build failed"
            cat /tmp/build2.log
            exit 1
          fi
          cp "$ARCHIVE" /tmp/build2.tar.zst
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Second build sha256: ${SHA}"

      - name: Compare archives
        if: steps.eligible.outputs.skipped != 'true'
        env:
          SHA1: ${{ steps.build1.outputs.sha256 }}
          SHA2: ${{ steps.build2.outputs.sha256 }}
        run: |
          if [ "$SHA1" = "$SHA2" ]; then
            echo "::notice::Reproducible: ${RECIPE_NAME} on ${PLATFORM} (sha256 ${SHA1})"
            exit 0
          fi
          echo "::error::Non-reproducible: ${RECIPE_NAME} on ${PLATFORM}"
          echo "First build:  ${SHA1}"
          echo "Second build: ${SHA2}"
          mkdir -p /tmp/diff1 /tmp/diff2
          tar --zstd -xf /tmp/build1.tar.zst -C /tmp/diff1
          tar --zstd -xf /tmp/build2.tar.zst -C /tmp/diff2
          echo "--- file-level diff (first 200 lines) ---"
          diff -r /tmp/diff1 /tmp/diff2 2>&1 | head -200 || true
          exit 1

      - name: Upload archives on mismatch
        if: failure() && steps.eligible.outputs.skipped != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: archives-${{ matrix.target.platform }}
          path: |
            /tmp/build1.tar.zst
            /tmp/build2.tar.zst
            /tmp/build1.log
            /tmp/build2.log
          retention-days: 7
