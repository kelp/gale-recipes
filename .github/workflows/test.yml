name: Script Tests

# Unit tests for repo tooling in scripts/ and
# .github/scripts/. verify.yml only covers recipes/**, so
# script-only PRs previously ran no CI at all (the
# auto-update fixes in #52 shipped with just a bot review).
#
# Read-only: no secrets, no GHCR, no recipe builds.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/test.yml'
      - 'index/**'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/test.yml'
      - 'index/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Python unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # PATH-shimmed end-to-end run of check_recipe; mocks
      # gh/curl/shasum/git, so no network and no token.
      - name: auto-update.sh smoke tests
        run: bash scripts/test_auto_update_sh.sh

      - name: attestation-parsing tests
        run: bash scripts/test_verify_upstream_attestation.sh

  # Pin must be a gale commit that lints index documents
  # (kelp/gale#293 / a0dba6c). Do not use the released
  # binary from recipes/g/gale.toml until that release
  # includes the dispatch.
  index-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch origin/main
        run: git fetch --no-tags origin main

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: kelp/gale
          ref: a0dba6c0c8975e2742fa6000b3c878cab05bb3f2
          path: gale-src

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: gale-src/go.mod

      - name: Build gale
        run: go build -o /tmp/gale-index-lint ./cmd/gale/
        working-directory: gale-src

      - name: Lint index
        env:
          GALE: /tmp/gale-index-lint
          INDEX_BASE: origin/main
        run: bash scripts/lint_index.sh .
