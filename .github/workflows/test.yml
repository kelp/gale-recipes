name: Script Tests

# Unit tests for repo tooling in scripts/ plus index lint
# and zizmor on GitHub Actions workflows.
# Read-only: no secrets, no GHCR, no package installs.
# No path filters: Protect-main may require these jobs on
# every PR, including docs-only changes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Python unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  # Pin must be a gale commit that lints index documents
  # and allows adding a platform (kelp/gale lint-allow-added-platform).
  # Do not use a released binary until that release includes
  # the dispatch.
  index-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch origin/main
        run: git fetch --no-tags origin main

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: kelp/gale
          ref: dbd2446dee4329f538a6a2b66687972ab72a5e1a
          path: gale-src
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: gale-src/go.mod

      - name: Build gale
        run: go build -o /tmp/gale-index-lint ./cmd/gale/
        working-directory: gale-src

      - name: Lint index
        env:
          GALE: /tmp/gale-index-lint
          INDEX_BASE: origin/main
        run: bash scripts/lint_index.sh .

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: zizmor
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            ghcr.io/zizmorcore/zizmor:1.29.0@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284 \
            --offline --color=always .

  # Protect-main (ruleset 17473700) still requires this
  # context. The farm ledger checker is gone. This job
  # only posts the required name. Drop ledger-check from
  # the ruleset, require test + index-lint, then delete
  # this job.
  ledger-check:
    runs-on: ubuntu-latest
    steps:
      - name: Farm ledger-check is retired
        run: echo "ledger-check is retired; test and index-lint are the gates"
