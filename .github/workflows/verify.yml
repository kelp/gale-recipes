name: Verify Recipe

# UNPRIVILEGED pre-merge build + smoke test.
#
# This workflow holds only `contents: read` and is never given
# `secrets: inherit`, so it structurally CANNOT push to GHCR or
# mint a Sigstore attestation regardless of step logic. That is
# the security guarantee: unreviewed upstream build code (and a
# recipe's [smoke] commands) run here with no write-capable
# token, before any human has authorized the privileged build.
#
# Triggers:
#   - pull_request: fires natively for human PRs and for
#     auto-update bot PRs (their branch commits are authored by
#     the gale-recipes-automation App, whose events run unheld;
#     GITHUB_TOKEN-authored commits would sit at
#     action_required awaiting manual approval).
#   - workflow_dispatch: ad-hoc manual run for a single recipe
#     on any ref.
#
# Hardening against cache-poisoning into later privileged builds:
#   - sccache's GHA backend is NOT enabled here (no
#     SCCACHE_GHA_ENABLED), so unreviewed code can't write the
#     shared compiler cache.
#   - dependency caches are RESTORE-ONLY (actions/cache/restore),
#     never saved, so a verify build can't publish a cache entry
#     a privileged/main build would later restore.

on:
  pull_request:
    # runner-overrides.json is here too: a PR that retargets a
    # recipe's runner without touching its TOML must still run
    # Verify. Discover (below) re-lists the affected recipes.
    paths:
      - 'recipes/**'
      - '.github/runner-overrides.json'
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe name (single)'
        required: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      # JSON array of {recipe, platform, os} cells — one verify
      # job each. Empty array means nothing to verify.
      cells: ${{ steps.list.outputs.cells }}
      gale_version: ${{ steps.gale.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      # Read the canonical gale version from its own recipe so a
      # bump to recipes/g/gale.toml drags the verify toolchain
      # forward too — no hand-edited pin to drift.
      - name: Resolve gale version from recipe
        id: gale
        run: |
          VERSION=$(awk -F'"' '/^version[[:space:]]*=/ {print $2; exit}' \
            recipes/g/gale.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from recipes/g/gale.toml" >&2
            exit 1
          fi
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: List recipes to verify
        id: list
        env:
          INPUT_RECIPE: ${{ inputs.recipe }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$INPUT_RECIPE" ]; then
            # Dispatch: a single, repo-controlled recipe name.
            name="$INPUT_RECIPE"
            LETTER="${name:0:1}"
            FILE="recipes/${LETTER}/${name}.toml"
            if [ ! -f "$FILE" ]; then
              echo "::error::Recipe not found: $FILE" >&2
              exit 1
            fi
            NAMES="$name"
          else
            # pull_request: only changed recipe .toml files.
            CHANGED=$(git diff --name-only \
              "origin/${PR_BASE_REF}...HEAD" \
              -- 'recipes/**/*.toml' \
              | grep -v '\.binaries\.toml$' || true)
            NAMES=$(echo "$CHANGED" | while read -r f; do
              [ -f "$f" ] && basename "$f" .toml
            done | sort -u)

            # If the runner-override sidecar changed, re-verify
            # every recipe it names. An override-only PR (or one
            # that retargets an existing recipe's runner without
            # touching its TOML) leaves CHANGED empty for that
            # recipe, so without this the affected build never
            # reruns. The override set is tiny; rebuilding all of
            # it on any sidecar change is the conservative choice
            # for a merge gate.
            OVERRIDES_FILE=".github/runner-overrides.json"
            if git diff --name-only \
                 "origin/${PR_BASE_REF}...HEAD" \
                 -- "$OVERRIDES_FILE" | grep -q .; then
              OVR_NAMES=$(python3 - "$OVERRIDES_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          try:
              data = json.load(open(sys.argv[1]))
          except (OSError, ValueError):
              sys.exit(0)
          for name in (data if isinstance(data, dict) else []):
              if (Path("recipes") / name[0] / f"{name}.toml").is_file():
                  print(name)
          PY
              )
              NAMES=$(printf '%s\n%s\n' "$NAMES" "$OVR_NAMES" \
                | sort -u | sed '/^$/d')
            fi
          fi

          # Build recipe × platform cells through the same
          # chunker build.yml uses, so verify and build can
          # never disagree on a recipe's eligible platforms
          # (declared [package].platforms are authoritative —
          # ineligible platforms get no cell, so there is no
          # skip path downstream).
          CELLS=$(NAMES="$NAMES" python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          import chunk_recipes
          names = sorted(set(os.environ["NAMES"].split()))
          try:
              cells = chunk_recipes.build_cells(
                  names,
                  chunk_recipes.load_platforms(
                      chunk_recipes.Path(".github/platforms.json")),
                  overrides=chunk_recipes.load_runner_overrides(
                      chunk_recipes.Path(
                          ".github/runner-overrides.json")),
              )
          except ValueError as e:
              print(f"::error::{e}", file=sys.stderr)
              sys.exit(1)
          print(json.dumps(cells))
          PY
          )
          echo "cells=${CELLS}" >> "$GITHUB_OUTPUT"
          echo "Verifying: ${NAMES:-<none>}"

  verify:
    needs: discover
    if: needs.discover.outputs.cells != '[]'
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        cell: ${{ fromJson(needs.discover.outputs.cells) }}
    runs-on: ${{ matrix.cell.os }}
    env:
      RECIPE_NAME: ${{ matrix.cell.recipe }}
      PLATFORM: ${{ matrix.cell.platform }}
      GALE_VERSION: ${{ needs.discover.outputs.gale_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # ubuntu-latest leaves ~20 GB free on /, which Rust/LLVM source
      # builds plus toolchain and rust-docs extraction exhaust ("No
      # space left on device"). Drop preinstalled SDKs we never use to
      # reclaim ~25-30 GB before any build or cache restore.
      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift || true
          df -h /

      - name: Download gale release binary
        run: |
          mkdir -p gale-bin
          ARCHIVE="gale-${GALE_VERSION}-${PLATFORM}.tar.gz"
          curl -sL -o "/tmp/${ARCHIVE}" \
            "https://github.com/kelp/gale/releases/download/${GALE_VERSION}/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C gale-bin
          mv gale-bin/gale-* gale-bin/gale
          chmod +x gale-bin/gale
          echo "${GITHUB_WORKSPACE}/gale-bin" >> "$GITHUB_PATH"

      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y patchelf

      # RESTORE-ONLY: read existing dep caches to stay fast but
      # never save a cache entry from unreviewed upstream source.
      - name: Restore build dependencies (read-only)
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.gale/pkg
            ~/.gale/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/.cache/pip
            ~/Library/Caches/pip
            ~/.npm
          key: deps-${{ matrix.cell.platform }}-${{ hashFiles('recipes/**/*.toml') }}
          restore-keys: |
            deps-${{ matrix.cell.platform }}-

      - name: Find recipe file
        id: recipe
        run: |
          LETTER="${RECIPE_NAME:0:1}"
          FILE="recipes/${LETTER}/${RECIPE_NAME}.toml"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      # The restore-only dep cache above repopulates ~/.gale/pkg,
      # which includes any previously built revision of THIS recipe
      # (the deps-<platform>- cache is saved by privileged
      # build-chunk runs and keyed per-platform, not per-runner or
      # per-PR). gale's installer short-circuits to MethodCached
      # with NO build when ~/.gale/pkg/<name>/<version>-<revision>
      # already exists, and `gale install --recipe` has no --force.
      # Under the old two-step flow `gale build` never consulted the
      # store, so it always compiled; the install-only flow does not,
      # so on a cache hit it would compile nothing and every check
      # below would validate a STALE cached binary. That breaks
      # gh#95's own invariant ("both still exercise a real build")
      # and the runner-override re-verify path (a recipe retargeted
      # to a new runner with no version/revision bump). Evict just
      # the target's store entries so the single install always does
      # a real build; the deps stay cached, preserving the #95
      # speedup. Do NOT remove this step — it is what makes
      # install-only equivalent to the old build+install for verify.
      - name: Evict target from restored store (force real build)
        run: rm -rf "$HOME/.gale/pkg/${RECIPE_NAME}"

      # Verify never publishes an archive, so it skips `gale build`
      # entirely and does a SINGLE build via `gale install`. That
      # one build populates the dependency farm and lands the
      # binary at its real store path with the farm rpath baked
      # correctly — the tree every check below scans. build-chunk
      # keeps the separate `gale build` because its archive/sha256
      # feed the GHCR push; verify has no such consumer, so the
      # second full compile that step used to cost here is dropped
      # (gh#95: install-only halves heavy-recipe verify time).
      #
      # The retry loop covers transient upstream/network flakes on
      # the sole build, mirroring the former build step.
      - name: Install recipe (single build, populate dep farm)
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          for attempt in 1 2 3; do
            if gale install --global "${RECIPE_NAME}" \
                --recipe "${RECIPE_FILE}" 2>&1 | tee /tmp/build.log
            then
              exit 0
            fi
            echo "::warning::Install attempt $attempt failed, retrying..."
            sleep $((attempt * 10))
          done
          echo "::error::Install failed after 3 attempts"
          echo "--- build log ---"
          cat /tmp/build.log || true
          exit 1

      - name: Verify binary runs
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          python3 scripts/verify_binary.py \
            --recipe "${RECIPE_FILE}"

      # Scan the INSTALLED store prefix, not an extracted archive.
      # gale no longer rewrites rpaths at install (linking policy),
      # so the installed tree has the same files and the same baked
      # rpaths the archive would — the static rpath check is
      # equivalent. Omitting --prefix/--archive makes check_install
      # resolve ~/.gale/pkg/<name>/<version>-<revision> itself.
      - name: Check install (rpath vs runtime deps)
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          python3 scripts/check_install.py \
            --recipe "${RECIPE_FILE}"

      - name: Install and smoke test
        env:
          RECIPE_FILE: ${{ steps.recipe.outputs.file }}
        run: |
          HAS_SMOKE=$(python3 -c "
          import sys, tomllib
          with open('${RECIPE_FILE}', 'rb') as f:
              r = tomllib.load(f)
          sys.exit(0 if r.get('smoke', {}).get('commands') else 1)
          " && echo yes || echo no)

          if [ "$HAS_SMOKE" != "yes" ]; then
            echo "No [smoke] section; skipping"
            exit 0
          fi

          gale install --global "${RECIPE_NAME}" \
            --recipe "${RECIPE_FILE}"
          python3 scripts/run_smoke.py \
            --recipe "${RECIPE_FILE}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verify-log-${{ matrix.cell.recipe }}-${{ matrix.cell.platform }}
          path: /tmp/build.log
          retention-days: 7
